  hammer_curl_sub:{c:["Neutral grip, palms facing each other","Elbows pinned","Curl, pause, lower 2-3s","Alternating or together","Brachialis focus"],b:"Exhale on the curl",s:null},
  lying_db_tricep:{c:["Flat on a bench, DBs over the chest","Lower toward the forehead, elbows completely fixed","Only the forearm moves","Full stretch at the bottom, drive up through the tricep","Don't let elbows flare as you fatigue"],b:"Inhale down, exhale up",s:"If the overhead-ish position bothers the shoulder, use the pushdown instead."},
  single_db_overhead:{c:["Both hands grip one DB at the top, diamond shape","Hold overhead, elbows forward and close","Lower behind the head to a full tricep stretch","Drive up, elbows stay fixed","Best long-head stretch available"],b:"Exhale on the extension",s:"If overhead is uncomfortable, use the lying extension."},
  bench_dip_sub:{c:["Hands on the bench behind you","Feet on the floor or elevated","Lower to upper arms parallel — no deeper","Drive up through the triceps","Elbows back, never flared"],b:"Inhale down, exhale up",s:"Stop immediately if the shoulder complains. Depth is the risk factor."},
  ab_wheel_rollout:{c:["Kneel, wheel under the shoulders","Roll out slowly, keeping the core braced","Go only as far as you can control","Pull back using the ABS, not the hip flexors","Lower back must not arch — shorten the range if it does"],b:"Inhale on the roll out, exhale pulling back",s:null},
  hanging_knee_raise_sub:{c:["Dead hang, shoulders packed","Curl the pelvis up, knees to chest","Hold 1s at the top","Slow controlled lower","No swinging"],b:"Exhale on the raise",s:"Keep shoulders depressed in the hang."},
  dead_bug_sub:{c:["On your back, arms pointing at the ceiling, knees at 90°","Lower opposite arm and leg SLOWLY","Lower back stays pressed flat to the floor the whole time","Return and switch sides","If the back arches, shorten the range"],b:"Exhale as you extend",s:null},
  lying_leg_raise_sub:{c:["Flat on the floor or a bench","Legs straight, raise to 90°","Lower slowly without touching down","Lower back stays pressed down","Bend the knees if the back arches"],b:"Exhale on the raise",s:null},
  seated_db_lateral:{c:["Seated upright, DBs at your sides","Seated removes all leg drive and momentum","Thumb up, raise to shoulder height only","Control the lower","You'll need less weight than standing — that's correct"],b:"Exhale on the raise",s:"Seated is more shoulder-safe than standing because there's no momentum loading the joint."},
  bent_over_db_lateral:{c:["Hinge forward at the hips 45°","DBs hang straight down from the shoulders","Raise out to the sides, lead with the elbows","Rear and side delt together","Very light — this is a finisher"],b:"Exhale on the raise",s:"Stay in the plane of your torso, don't raise toward the ceiling."},
  arnold_press:{c:["Seated, DB at shoulder height, palm facing YOU","Rotate to palm-forward as you press up","Elbows travel forward, never out to the sides","Stop just short of lockout","Reverse the rotation on the way down"],b:"Exhale on the press",s:"The rotation keeps the shoulder in a safe path — closest match to the landmine arc. Start at 20lbs given your landmine numbers."},
  db_shoulder_press_strict:{c:["Seated upright or on an incline bench","DBs start at EAR height, elbows FORWARD","Press up and slightly in","Stop at ear height on the way down — no deeper","Strict only, no leg drive"],b:"Exhale on the press",s:"Elbows forward in the scapular plane. Never the goal-post position with elbows flared to 90°."},
  cable_chest_press_sub:{c:["Cables at chest height","Press forward, not overhead","Squeeze the chest at extension","Controlled return","Zero overhead loading"],b:"Exhale on the press",s:"The safest pressing option when the shoulder is irritated."},
  incline_pushup:{c:["Hands on a bench, feet on the floor","Body rigid in a straight line","Chest to the bench edge","Controlled descent","Easier variation — use it to keep moving"],b:"Inhale down, exhale up",s:null},
  db_floor_press:{c:["On your back on the floor, DBs at the chest","Press up, elbows at 45°","The floor stops your elbows — that's the point","Pause when the upper arms touch down","Great shoulder-safe pressing option"],b:"Inhale down, exhale up",s:"The floor physically limits range so the shoulder can't over-extend. Excellent for instability."},

/* ══════════════════════════════════════════════════════════════
   5. STORAGE — dual layer: IndexedDB + localStorage.
   Both are written on every save. On load both are read and
   MERGED by session date. iOS would have to wipe two independent
   stores to lose your history.
   ══════════════════════════════════════════════════════════════ */
const DB_NAME='recompdb', STORE='kv';
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    try{
      const r=indexedDB.open(DB_NAME,1);
      r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
      r.onsuccess=()=>{_db=r.result;res(_db);};
      r.onerror=()=>rej(r.error);
    }catch(e){rej(e);}
  });
}
async function idbGet(k){
  try{
    const db=await openDB();
    return await new Promise(res=>{
      const tx=db.transaction(STORE,'readonly');
      const rq=tx.objectStore(STORE).get(k);
      rq.onsuccess=()=>res(rq.result==null?null:rq.result);
      rq.onerror=()=>res(null);
    });
  }catch{ return null; }
}
async function idbSet(k,v){
  try{
    const db=await openDB();
    return await new Promise(res=>{
      const tx=db.transaction(STORE,'readwrite');
      tx.objectStore(STORE).put(v,k);
      tx.oncomplete=()=>res(true);
      tx.onerror=()=>res(false);
      tx.onabort=()=>res(false);
    });
  }catch{ return false; }
}
function lsGet(k){ try{ const v=localStorage.getItem(k); return v==null?null:JSON.parse(v); }catch{ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch{ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch{} }

const K={hist:'recomp_history_v2', sess:'recomp_session_v2', prog:'recomp_program_v2', bw:'recomp_bw_v2', screen:'recomp_screen_v2'};

// Merge two history arrays, dedupe by date, sort chronologically
function mergeHistory(a,b){
  const m=new Map();
  [...(Array.isArray(a)?a:[]),...(Array.isArray(b)?b:[])].forEach(e=>{
    if(e&&e.date) m.set(e.date,e);
  });
  return [...m.values()].sort((x,y)=>new Date(x.date)-new Date(y.date));
}
async function saveHistory(h){ lsSet(K.hist,h); await idbSet(K.hist,h); }
async function saveSession(s){
  if(s){ lsSet(K.sess,s); await idbSet(K.sess,s); }
  else { lsDel(K.sess); await idbSet(K.sess,null); }
}
async function saveProgram(p){ lsSet(K.prog,p); await idbSet(K.prog,p); }
async function saveBW(b){ lsSet(K.bw,b); await idbSet(K.bw,b); }

const fmtShort=iso=>{try{return new Date(iso).toLocaleDateString('en-CA',{month:'short',day:'numeric'});}catch{return '—';}};
const fmtLong=iso=>{try{return new Date(iso).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'});}catch{return '—';}};
const fmtTime=s=>`${Math.floor(Math.max(s,0)/60)}:${(Math.max(s,0)%60).toString().padStart(2,'0')}`;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const epley=(w,r)=>{const W=parseFloat(w),R=parseInt(r);if(!W||!R||R<=0)return null;return R===1?W:Math.round(W*(1+R/30)*10)/10;};
const best1RM=sets=>Array.isArray(sets)?sets.reduce((b,s)=>{const rm=epley(s.weight,s.reps);return(rm&&(!b||rm>b))?rm:b;},null):null;
const isTimeBased=reps=>/s$|rounds|min/i.test(String(reps||''));

// Progressive overload target based on the LAST time this exact exercise id was done
function getTarget(last, repsStr){
  if(!Array.isArray(last)||!last.length) return null;
  if(isTimeBased(repsStr)) return null;
  const v=last.filter(s=>s.weight&&s.reps);
  if(!v.length) return null;
  const p=String(repsStr).split('-');
  const top=parseInt(p[p.length-1]), bot=parseInt(p[0]);
  if(!top||!bot) return null;
  const avgW=v.reduce((a,s)=>a+parseFloat(s.weight),0)/v.length;
  if(v.every(s=>parseInt(s.reps)>=top)){
    const nw=Math.round((avgW+5)/5)*5;
    return {weight:nw,reps:bot,label:`Add weight — try ${nw}lbs × ${bot} reps`};
  }
  const avgR=Math.round(v.reduce((a,s)=>a+parseInt(s.reps),0)/v.length);
  const tr=Math.min(avgR+1,top);
  return {weight:Math.round(avgW/5)*5,reps:tr,label:`Same weight — push for ${tr}+ reps`};
}
function overloadHint(last,repsStr,ex){
  if(!Array.isArray(last)||isTimeBased(repsStr)) return '';
  const p=String(repsStr).split('-'),top=parseInt(p[p.length-1]),bot=parseInt(p[0]);
  if(!top) return '';
  if(ex&&ex.bell&&!ex.bw&&last.length){
    const cur=snapBell(Math.max.apply(null,last.map(s=>parseFloat(s.weight)||0)));
    if(last.every(s=>parseInt(s.reps)>=top)){
      const up=nextBell(cur);
      return up ? `Topped out at ${cur}lb — move up to the ${up}lb bell`
                : `Topped out on your heaviest bell — add reps, or it's time for a bigger one`;
    }
    return last.every(s=>parseInt(s.reps)>=bot) ? 'Solid — push for more reps on this bell'
                                                : 'Build reps before changing bell';
  }
  if(last.every(s=>parseInt(s.reps)>=top)) return 'Hit the top of the range — add weight';
  if(last.every(s=>parseInt(s.reps)>=bot)) return 'Solid — push for more reps';
  return 'Build reps before adding weight';
}

   7. AUDIO — real-time playback only. No pre-scheduling, which is
   what caused the random phantom beeps.
   ══════════════════════════════════════════════════════════════ */
let _ac=null;
function getAC(){ if(!_ac||_ac.state==='closed'){ try{_ac=new(window.AudioContext||window.webkitAudioContext)();}catch{} } return _ac; }
function unlockAudio(){ const c=getAC(); if(c&&c.state==='suspended') c.resume().catch(()=>{}); }
function tone(freq,dur,vol){
  try{
    const ctx=getAC(); if(!ctx) return;
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.value=freq;
    const t=ctx.currentTime;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.05);
  }catch{}
}
function beepCountdown(rem){
  if(rem===3||rem===2||rem===1) tone(680,0.16,0.85);
  if(rem===0){ tone(880,0.28,1); setTimeout(()=>tone(1120,0.28,1),290); setTimeout(()=>tone(1400,0.42,1),580); }
}

/* Your saved program is a snapshot of the days as they were the last
   time you edited one. Without this merge, every day added to the app
   afterwards would be invisible to you forever, because the snapshot
   would simply replace the defaults. So: your days and your edits always
   win, and any default day your snapshot has never seen is appended.
   Nothing can delete a day, so a day missing from the snapshot can only
   mean it is newer than the snapshot. */
function mergeProgram(saved){
  if(!Array.isArray(saved)||!saved.length) return DEFAULT_PROGRAM;
  const seen={};
  saved.forEach(d=>{ if(d&&d.id) seen[d.id]=1; });
  const fresh=DEFAULT_PROGRAM.filter(d=>d&&d.id&&!seen[d.id]);
  if(!fresh.length) return saved;
  return saved.filter(d=>d&&d.id&&Array.isArray(d.exercises)).concat(fresh);
}
const getProgram = () => mergeProgram(S.program);
const getDay = id => getProgram().find(d=>d.id===id);
const allExercises = () => getProgram().flatMap(d=>d.exercises);

// Look up the display info for any id (main exercise OR sub)
function lookupName(id){
  for(const d of getProgram()){
    for(const ex of d.exercises){
      if(ex.id===id) return ex.name;
      const s=(ex.subs||[]).find(s=>s.id===id);
      if(s) return s.name;
    }
  }
  const lib=LIBRARY.find(l=>l.id===id);
  return lib?lib.name:id;
}
function lookupMuscle(id){
  for(const d of getProgram()){
    for(const ex of d.exercises){
      if(ex.id===id) return ex.muscle;
      if((ex.subs||[]).some(s=>s.id===id)) return ex.muscle; // sub inherits the slot's muscle
    }
  }
  return null;
}
// Most recent performance of this exact exercise id, anywhere in history
function getLastPerf(id){
  for(let i=S.history.length-1;i>=0;i--){
    const sets=S.history[i]&&S.history[i].sets&&S.history[i].sets[id];
    if(Array.isArray(sets)&&sets.some(s=>s.done||s.weight)) return sets;
  }
  return null;
}
function getLastDrop(id){

    const d=S.history[i]&&S.history[i].drops&&S.history[i].drops[id];
    if(d&&(d.weight||d.reps)) return d;
  }

}

  return S.history.reduce((b,e)=>{
    const rm=best1RM(((e.sets||{})[id]||[]).filter(s=>s.done||s.weight));
    return rm&&rm>b?rm:b;
  },0);
}

function blankSets(n,w,r){ return Array.from({length:Math.max(1,n|0)},()=>({weight:w||'',reps:r||'',done:false,rpe:null,warm:false})); }

/* ── PER-SET TARGETING ────────────────────────────────────────
   Standard days give one target for all sets. Pyramid days give a
   different weight per set. Tempo days scale down off your normal
   working weight. This is the engine for all three.               */

// Reps for a specific set index. 'reps' may be "6,8,10" for per-set.
function repsForSet(ex,i){
  const r=String(ex.reps||'');
  if(r.indexOf(',')>-1){ const p=r.split(',').map(x=>x.trim()); return p[i]||p[p.length-1]; }
  return r;
}
function setCountFor(ex){ return Math.max(1,ex.sets|0)+((ex.warmup&&ex.warmup.length)||0); }
const round5=w=>Math.max(5,Math.round(w/5)*5);
const floor5=w=>Math.max(5,Math.floor(w/5)*5);

// Working sets only — warm-ups must never influence targets or PRs
const workingOnly=arr=>Array.isArray(arr)?arr.filter(s=>s&&!s.warm):[];

// What could you lift for N reps, based on an exercise's own history?
function estimateWeight(sourceId,targetReps){
  const last=workingOnly(getLastPerf(sourceId));
  if(!last.length) return null;
  const rm=best1RM(last.filter(s=>s.weight&&s.reps));
  if(!rm||!targetReps) return null;
  return floor5(rm/(1+targetReps/30));   // round DOWN — start conservative
}
// Average working weight of an exercise's last session
function lastAvgWeight(sourceId){
  const last=workingOnly(getLastPerf(sourceId));
  const v=last.filter(s=>s.weight);
  if(!v.length) return null;
  return v.reduce((a,s)=>a+parseFloat(s.weight),0)/v.length;
}

/* ── KETTLEBELLS ───────────────────────────────────────────────
   Bells do not micro-load. The normal engine adds 5lb when you top
   out a rep range, which is meaningless when the next bell you own
   is 18lb heavier. So for bell work: add REPS on the bell you have,
   and only change bell when there is genuinely one to change to.
   BUYING A NEW BELL? Add its weight to this list and the app will
   start programming it. */
const BELLS=[25,35,50];
function snapBell(w){
  if(w==null||!isFinite(w)) return BELLS[0];
  let b=BELLS[0]; BELLS.forEach(x=>{ if(x<=w) b=x; }); return b;
}
function nextBell(w){ return BELLS.find(x=>x>w)||null; }

function bellTargets(ex){
  const n=Math.max(1,ex.sets|0), out=[];
  const start=snapBell(ex.defaultWeight);
  const last=workingOnly(getLastPerf(ex.id)).filter(s=>s.weight&&s.reps);
  if(!last.length){
    for(let i=0;i<n;i++) out.push({weight:start,reps:repsForSet(ex,i)});
    return out;
  }
  const cur=snapBell(Math.max.apply(null,last.map(s=>parseFloat(s.weight)||0))||start);
  const p=String(ex.reps).split('-'), top=parseInt(p[p.length-1]);
  // a carry measured in seconds can never be "maxed on reps"
  const timed=isTimeBased(ex.reps);
  const maxed=!timed&&!!top&&last.every(s=>parseInt(s.reps)>=top);
  const lastReps=Math.max.apply(null,last.map(s=>parseInt(s.reps)||0));
  for(let i=0;i<n;i++){
    if(!maxed){ out.push({weight:cur,reps:repsForSet(ex,i)}); continue; }
    const pres=parseInt(repsForSet(ex,i))||lastReps;
    const up=nextBell(cur);
    // a heavier bell is a big jump, so drop back to the prescribed reps
    if(up) out.push({weight:up,reps:String(pres)});
    // no heavier bell — earn it by adding reps, capped at prescribed +6
    else   out.push({weight:cur,reps:String(Math.min(pres+6,lastReps+2))});
  }
  return out;
}

// Returns one {weight,reps} per WORKING set
function getSetTargets(ex){
  const n=Math.max(1,ex.sets|0), out=[];
  if(ex.bell&&!ex.bw) return bellTargets(ex);

  if(ex.scheme==='pyramid'){
    const topReps=parseInt(repsForSet(ex,0))||6;
    // Prefer this exercise's own pyramid history, else derive from the
    // regular-day movement it's based on
    let top=estimateWeight(ex.id,topReps);
    if(!top&&ex.basedOn) top=estimateWeight(ex.basedOn,topReps);
    let prev=null;
    for(let i=0;i<n;i++){
      const drop=(ex.drops&&ex.drops[i]!=null)?ex.drops[i]:i*0.10;
      let w=top?round5(top*(1-drop)):null;
      // Force a real step down. With light dumbbells a 10% drop can round
      // back onto the same plate, which would defeat the whole point.
      if(w!=null&&prev!=null&&w>=prev) w=Math.max(5,prev-5);
      prev=w;
      out.push({weight:w,reps:repsForSet(ex,i)});
    }
    return out;
  }

  if(ex.scheme==='tempo'){
    let base=null;
    // Own tempo history first — it progresses on its own terms
    const own=workingOnly(getLastPerf(ex.id));
    if(own.length){ const t=getTarget(own,repsForSet(ex,0)); if(t) base=t.weight; }
    // Otherwise scale down from the normal-day version of the lift
    if(!base&&ex.basedOn){
      const avg=lastAvgWeight(ex.basedOn);
      if(avg) base=round5(avg*(ex.loadPct||0.65));
    }
    for(let i=0;i<n;i++) out.push({weight:base,reps:repsForSet(ex,i)});
    return out;
  }

  const t=getTarget(workingOnly(getLastPerf(ex.id)),ex.reps);
  for(let i=0;i<n;i++) out.push({
    // no history yet? fall back to the prescribed bell / load
    weight: t ? t.weight : (ex.defaultWeight||null),
    reps:   t ? t.reps   : repsForSet(ex,i)
  });
  return out;
}

// Warm-up ramp, as a % of the top working set
function warmupSets(ex,topWeight){
  if(!ex.warmup||!ex.warmup.length) return [];
  return ex.warmup.map(w=>({
    weight:topWeight?String(round5(topWeight*w.pct)):'',
    reps:String(w.reps),done:false,rpe:null,warm:true,pre:true
  }));
}

// Full set array for an exercise id: warm-ups then working sets
function buildSets(ex){
  const tg=getSetTargets(ex);
  const top=tg[0]&&tg[0].weight;
  const work=tg.map(t=>({
    weight:t.weight?String(t.weight):'',
    reps:t.reps?String(t.reps):'',
    done:false,rpe:null,warm:false,
    pre:!!(t.weight||t.reps)   // suggestion, not something you've actually done
  }));
  return warmupSets(ex,top).concat(work);
}

function startWorkout(dayId){
  const day=getDay(dayId); if(!day) return;
  const setData={}, dropData={};
  day.exercises.forEach(ex=>{
    // main — scheme-aware (standard / pyramid / tempo), warm-ups included
    setData[ex.id]=buildSets(ex);
    const tg=getSetTargets(ex);
    const topW=tg[0]&&tg[0].weight;
    if(ex.dropSet) dropData[ex.id]={weight:topW?String(round5(topW*0.7)):'',reps:'',done:false};
    // every sub gets its own slot, prefilled from its OWN history
    (ex.subs||[]).forEach(sub=>{
      if(!sub||!sub.id) return;
      const proxy={...ex,id:sub.id,basedOn:ex.basedOn||ex.id};
      // a bodyweight or band substitute inherits the slot, not the bell
      if(sub.bw){ proxy.bell=false; proxy.bw=true; delete proxy.defaultWeight; }
      setData[sub.id]=buildSets(proxy);
      const stg=getSetTargets(proxy);
      const sw=stg[0]&&stg[0].weight;
      if(ex.dropSet) dropData[sub.id]={weight:sw?String(round5(sw*0.7)):'',reps:'',done:false};
    });
  });
  S.session={dayId,setData,dropData,activeSubs:{},clock:null,startTime:Date.now()};
  S.elapsed=0; S.restTimers={}; S.paused=false; S.pausedAt=null;
  saveSession(S.session); startElapsed(); go('workout');
}

/* Normalise the session into a guaranteed-valid shape.
   Called on load AND at the top of every render, so no malformed or
   out-of-date session object can ever crash the UI. Returns false if
   the session is unsalvageable (e.g. its day no longer exists). */
function normalizeSession(){
  const s=S.session;
  if(!s || typeof s!=='object') return false;
  const day=getDay(s.dayId);
  if(!day || !Array.isArray(day.exercises)) return false;

  if(!s.setData   || typeof s.setData!=='object')   s.setData={};
  if(!s.dropData  || typeof s.dropData!=='object')  s.dropData={};
  if(!s.activeSubs|| typeof s.activeSubs!=='object')s.activeSubs={};
  if(typeof s.startTime!=='number' || !isFinite(s.startTime)) s.startTime=Date.now();
  // clock must be a valid, live handle on a real clock block or nothing at all
  if(s.clock){
    const c=s.clock, b=((day.blocks||[])[c&&c.bi]);
    if(!c || typeof c!=='object' || typeof c.startTs!=='number' || !isFinite(c.startTs)
       || !b || (b.kind!=='clock'&&b.kind!=='amrap')) s.clock=null;
    else {
      if(typeof c.pauseAcc!=='number'||!isFinite(c.pauseAcc)) c.pauseAcc=0;
      if(typeof c.pausedAt!=='number') c.pausedAt=null;
      if(typeof c.lastRound!=='number') c.lastRound=-1;
      if(typeof c.rounds!=='number'||c.rounds<0) c.rounds=0;
    }
  } else s.clock=null;

  const validSet=x=>x&&typeof x==='object';
  const fixSlot=(id,count,warmCount)=>{
    if(!Array.isArray(s.setData[id])) { s.setData[id]=blankSets(count); return; }
    s.setData[id]=s.setData[id].map((x,i)=>validSet(x)?{
      weight:x.weight==null?'':String(x.weight),
      reps:x.reps==null?'':String(x.reps),
      done:!!x.done,
      rpe:(typeof x.rpe==='number')?x.rpe:null,
      warm:(x.warm!=null)?!!x.warm:(i<warmCount),
      pre:!!x.pre
    }:{weight:'',reps:'',done:false,rpe:null,warm:i<warmCount,pre:false});
    while(s.setData[id].length<count) s.setData[id].push({weight:'',reps:'',done:false,rpe:null,warm:false,pre:false});
  };
  const fixDrop=id=>{
    const d=s.dropData[id];
    if(!d||typeof d!=='object') s.dropData[id]={weight:'',reps:'',done:false};
    else s.dropData[id]={weight:d.weight==null?'':String(d.weight),reps:d.reps==null?'':String(d.reps),done:!!d.done};
  };

  day.exercises.forEach(ex=>{
    const n=setCountFor(ex);
    const wc=(ex.warmup&&ex.warmup.length)||0;
    fixSlot(ex.id,n,wc);
    if(ex.dropSet) fixDrop(ex.id);
    (ex.subs||[]).forEach(sub=>{
      if(!sub||!sub.id) return;
      fixSlot(sub.id,n,wc);
      if(ex.dropSet) fixDrop(sub.id);
    });
    // drop any activeSub index that points at a sub that no longer exists
    const i=s.activeSubs[ex.id];
    if(i!=null && !((ex.subs||[])[i] && ex.subs[i].id)) delete s.activeSubs[ex.id];
  });
  return true;
}

function activeIdFor(ex){
  if(!ex) return '';
  const map=(S.session&&S.session.activeSubs)||{};
  const i=map[ex.id];
  if(i!=null && (ex.subs||[])[i] && ex.subs[i].id) return ex.subs[i].id;
  return ex.id;
}
function activeSubFor(ex){
  if(!ex) return null;
  const map=(S.session&&S.session.activeSubs)||{};
  const i=map[ex.id];
  return (i!=null && (ex.subs||[])[i]) ? ex.subs[i] : null;
}

function updSet(id,idx,f,v){
  const arr=S.session&&S.session.setData[id]; if(!arr||!arr[idx])return;
  arr[idx][f]=v;
  if(f==='weight'||f==='reps') arr[idx].pre=false;   // you touched it, it's real now
  saveSession(S.session);
}
function updDrop(id,f,v){
  const d=S.session&&S.session.dropData[id]; if(!d)return;
  d[f]=v; saveSession(S.session);
}
function togSet(id,idx,rest){
  const arr=S.session&&S.session.setData[id]; if(!arr||!arr[idx])return;
  arr[idx].done=!arr[idx].done;
  if(arr[idx].done) arr[idx].pre=false;
  saveSession(S.session);
  if(arr[idx].done) startRest(id+'_'+idx, rest); else stopRest(id+'_'+idx);
  render();
}
function togDrop(id){
  const d=S.session&&S.session.dropData[id]; if(!d)return;
  const was=d.done; d.done=!d.done; saveSession(S.session);
  if(!was) startRest(id+'_drop',90); else stopRest(id+'_drop');
  render();
}
function togSub(exId,idx){
  const a=S.session.activeSubs;
  if(a[exId]===idx) delete a[exId]; else a[exId]=idx;
  saveSession(S.session); render();
}

function calcProg(){
  if(!S.session) return {total:0,done:0,pct:0};
  const day=getDay(S.session.dayId); if(!day) return {total:0,done:0,pct:0};
  const sd=S.session.setData||{}, dd=S.session.dropData||{};
  let t=0,d=0;
  (day.exercises||[]).forEach(ex=>{
    const id=activeIdFor(ex);
    const arr=Array.isArray(sd[id])?sd[id]:[];
    t+=arr.length; d+=arr.filter(s=>s&&s.done).length;
    if(ex.dropSet){ t+=1; if((dd[id]||{}).done) d+=1; }
  });
  return {total:t,done:d,pct:t?Math.round(d/t*100):0};
}

function sessionPRs(){
  if(!S.session) return [];
  const day=getDay(S.session.dayId); if(!day) return [];
  const out=[];
  day.exercises.forEach(ex=>{
    const id=activeIdFor(ex);
    const cur=best1RM(workingOnly(S.session.setData[id]).filter(s=>s.done));
    if(!cur) return;
    if(cur>allTimeBest(id)) out.push(id);
  });
  return out;
}

function confirmFinish(){
  const {total,done}=calcProg();
  if(done===0){ alert('Log at least one set first.'); return; }
  const inc=total-done;
  if(inc>0 && !confirm(`${inc} set${inc>1?'s':''} not marked done. Finish anyway?`)) return;
  finishWorkout();
}
function finishWorkout(){
  clearAllRest(); clearInterval(elapsedIv); stopClockTimer();
  const day=getDay(S.session.dayId);
  const dur=Math.max(1,Math.round((Date.now()-S.session.startTime)/60000));
  const sets={},drops={},used=[];
  day.exercises.forEach(ex=>{
    const id=activeIdFor(ex);
    const arr=workingOnly(S.session.setData[id]).filter(s=>s.done||(!s.pre&&(s.weight||s.reps)));
    if(arr.length) sets[id]=arr;
    const d=S.session.dropData[id];
    if(ex.dropSet&&d&&(d.done||d.weight)) drops[id]=d;
    used.push(id);
  });
  const prs=sessionPRs();
  const entry={v:2,dayId:S.session.dayId,dayName:day.name,date:new Date().toISOString(),duration:dur,sets,drops,used};
  S.history=mergeHistory(S.history,[entry]);
  saveHistory(S.history);
  const totalDone=Object.values(sets).reduce((a,s)=>a+s.filter(x=>x.done).length,0);
  S.summary={dayName:day.name,date:entry.date,duration:dur,totalDone,exCount:day.exercises.length,prs,sets};
  S.session=null; saveSession(null);
  S.screen='summary'; render();   // never persisted — see go()
}
function discardWorkout(){
  if(!confirm('Discard this workout? All logged sets will be lost.')) return;
  clearAllRest(); clearInterval(elapsedIv); stopClockTimer();
  S.session=null; saveSession(null); go('home');
}
function pauseWorkout(){
  S.paused=true; S.pausedAt=Date.now(); clearInterval(elapsedIv);
  if(S.session&&S.session.clock&&!S.session.clock.pausedAt){ S.session.clock.pausedAt=Date.now(); saveSession(S.session); }
  render();
}
function resumeWorkout(){
  if(!S.paused||!S.pausedAt) return;
  const delta=Date.now()-S.pausedAt;
  if(S.session){ S.session.startTime+=delta; saveSession(S.session); }
  Object.keys(S.restTimers).forEach(k=>{ if(!S.restTimers[k].done) S.restTimers[k].endTs+=delta; });
  const c=S.session&&S.session.clock;
  if(c&&c.pausedAt){ c.pauseAcc=(c.pauseAcc||0)+(Date.now()-c.pausedAt); c.pausedAt=null; c.lastBeep=null; saveSession(S.session); runClock(); }
  S.paused=false; S.pausedAt=null; startElapsed(); render();
}
function startElapsed(){
  clearInterval(elapsedIv);
  if(!S.session) return;
  elapsedIv=setInterval(()=>{
    S.elapsed=Math.floor((Date.now()-S.session.startTime)/1000);
    const el=document.getElementById('etxt'); if(el) el.textContent=fmtTime(S.elapsed);
  },1000);
}

/* ── INTERVAL CLOCK — EMOM / E2MOM / any fixed interval ───────
   Absolute timestamps throughout, so a locked screen, a throttled
   background tab or a suspended AudioContext cannot drift it. Every
   round that elapses is logged the instant it does, against the
   station's ACTIVE exercise id, so substitutions keep their own
   history exactly like anywhere else in the app. */
const CLK_R=88, CLK_C=2*Math.PI*CLK_R;
let clockIv=null;

function curDay(){ return S.session?getDay(S.session.dayId):null; }
function exById(id){ const d=curDay(); return d?(d.exercises||[]).find(e=>e.id===id)||null:null; }
function blockOf(i){ const d=curDay(); return ((d&&d.blocks)||[])[i]||null; }
function blockExercises(bi){ const d=curDay(); return d?(d.exercises||[]).filter(e=>e.block===bi):[]; }
function clockRounds(b){ return Math.max(1, b.rounds || Math.round((b.minutes*60)/(b.interval||60))); }
function clockKind(b){
  if(b.kind==='amrap') return 'AMRAP';
  // a mobility block is not an EMOM, and calling it one sets the wrong tone
  if(b.quiet) return (b.ids||[]).length+' × '+Math.round((b.interval||60)/60)+' min';
  const i=b.interval||60; return i===60?'EMOM':i===120?'E2MOM':i===180?'E3MOM':i+'s intervals';
}
/* How many rounds you managed last time you ran this block. That number is
   the entire progression model for an AMRAP: same bell, same clock, beat it. */
function lastAmrapRounds(b){
  const id=(b.ids||[])[0]; if(!id) return 0;
  const ex=exById(id); if(!ex) return 0;
  const last=getLastPerf(activeIdFor(ex));
  return Array.isArray(last)?last.filter(s=>s&&s.done).length:0;
}
function amrapCap(b){
  const id=(b.ids||[])[0], ex=id?exById(id):null;
  return ex?Math.max(1,ex.sets|0):6;
}
function dispName(ex){ const s=activeSubFor(ex); return s?s.name:(ex?ex.name:''); }

function clockElapsed(){
  const c=S.session&&S.session.clock; if(!c) return 0;
  const now=c.pausedAt||Date.now();
  return Math.max(0,Math.floor((now-c.startTs-(c.pauseAcc||0))/1000));
}
function clockInfo(){
  const c=S.session&&S.session.clock; if(!c) return null;
  const b=blockOf(c.bi); if(!b) return null;

  /* AMRAP: one countdown for the whole block, and YOU tell it when a round
     is done. No fixed rotation, no auto-logging on a minute boundary. */
  if(b.kind==='amrap'){
    const total=Math.max(60,(b.minutes|0)*60), el=clockElapsed();
    return {amrap:true,b,ids:b.ids||[],total,elapsed:el,
      rem:Math.max(0,total-el),
      finished: el>=total,
      rounds: c.rounds||0,
      cap: amrapCap(b),
      target: lastAmrapRounds(b),
      paused: !!c.pausedAt};
  }
  if(b.kind!=='clock') return null;
  const iv=Math.max(5,b.interval||60), rounds=clockRounds(b), ids=b.ids||[], n=ids.length||1;
  const el=clockElapsed(), r=Math.floor(el/iv);
  return {b,iv,rounds,ids,n,elapsed:el,round:r,
    rem: r>=rounds?0:(iv-(el%iv)),
    finished: r>=rounds,
    station: exById(ids[r%n]),
    cycle: Math.floor(r/n),
    next: (r+1<rounds) ? exById(ids[(r+1)%n]) : null,
    nextCycle: Math.floor((r+1)/n),
    paused: !!c.pausedAt};
}

/* Log one completed round against the active exercise for that station */
function logRound(b,r){
  if(!S.session) return;
  const ids=b.ids||[], n=ids.length||1;
  const ex=exById(ids[r%n]); if(!ex) return;
  const id=activeIdFor(ex);
  const arr=S.session.setData[id]; if(!Array.isArray(arr)) return;
  const wc=(ex.warmup&&ex.warmup.length)||0, k=Math.floor(r/n), s=arr[wc+k];
  if(!s||s.done) return;
  s.done=true; s.pre=false;
  if(!s.reps)   s.reps=repsForSet(ex,k);
  if(!s.weight && ex.defaultWeight) s.weight=String(ex.defaultWeight);
  saveSession(S.session);
}

function startClock(bi){
  if(!S.session) return;
  const b=blockOf(bi); if(!b||(b.kind!=='clock'&&b.kind!=='amrap')) return;
  unlockAudio();
  S.session.clock={bi,startTs:Date.now(),pauseAcc:0,pausedAt:null,lastBeep:null,lastRound:-1,painted:-1,rounds:0};
  saveSession(S.session);
  tone(980,0.2,1); setTimeout(()=>tone(1320,0.34,1),210);
  runClock(); go('clock');
}
function runClock(){ clearInterval(clockIv); clockIv=setInterval(clockTick,200); }
function stopClockTimer(){ clearInterval(clockIv); clockIv=null; }

function clockTick(){
  const c=S.session&&S.session.clock;
  if(!c){ stopClockTimer(); return; }
  if(c.pausedAt) return;
  const i=clockInfo(); if(!i){ stopClockTimer(); return; }

  if(i.amrap){
    if(i.finished){ finishClock(); return; }
    const k='a'+i.rem;
    if(c.lastBeep!==k){
      c.lastBeep=k;
      if(i.rem===3||i.rem===2||i.rem===1) tone(760,0.15,0.95);
      if(i.rem===60) tone(680,0.25,0.8);          // one minute to go
    }
    paintAmrap(i);
    return;
  }

  // log every round that has fully elapsed since the last tick
  const upTo=Math.min(i.round,i.rounds)-1;
  while(c.lastRound<upTo){ c.lastRound++; logRound(i.b,c.lastRound); }

  if(i.finished){ finishClock(); return; }

  /* A quiet block (mobility, breathing) gets one soft chime on the turn
     and no countdown at all. Barking 3-2-1 at someone who is trying to
     breathe slowly defeats the point of the session. This changes the
     AUDIO only: the logging and the finish above are identical. */
  if(i.b.quiet){
    const qk='q'+i.round;
    if(c.lastBeep!==qk && i.rem===i.iv){ c.lastBeep=qk; if(i.round>0) tone(528,0.5,0.35); }
  }else{
    const key=i.round+':'+i.rem;
    if(c.lastBeep!==key){
      c.lastBeep=key;
      if(i.rem===3||i.rem===2||i.rem===1) tone(760,0.15,0.95);
      if(i.rem===i.iv&&i.round>0){ tone(980,0.2,1); setTimeout(()=>tone(1320,0.34,1),210); }
    }
  }
  paintClock(i);
}
/* One tap = one completed round, logged across every movement in the block. */
function amrapRound(){
  const c=S.session&&S.session.clock; if(!c) return;
  const b=blockOf(c.bi); if(!b||b.kind!=='amrap') return;
  const r=c.rounds||0, cap=amrapCap(b);
  if(r>=cap){
    alert('That is '+cap+' rounds, which is the top of what this block tracks.\n\nGo up a bell next time, or slow every rep down.');
    return;
  }
  (b.ids||[]).forEach(id=>{
    const ex=exById(id); if(!ex) return;
    const arr=S.session.setData[activeIdFor(ex)]; if(!Array.isArray(arr)) return;
    const s=arr[r]; if(!s||s.done) return;
    s.done=true; s.pre=false;
    if(!s.reps) s.reps=repsForSet(ex,r);
    if(!s.weight && ex.defaultWeight) s.weight=String(ex.defaultWeight);
  });
  c.rounds=r+1; saveSession(S.session);
  tone(920,0.12,0.9);
  render();
}
function amrapUndo(){
  const c=S.session&&S.session.clock; if(!c||!(c.rounds>0)) return;
  const b=blockOf(c.bi); if(!b||b.kind!=='amrap') return;
  const r=c.rounds-1;
  (b.ids||[]).forEach(id=>{
    const ex=exById(id); if(!ex) return;
    const arr=S.session.setData[activeIdFor(ex)]; if(!Array.isArray(arr)) return;
    const s=arr[r]; if(s){ s.done=false; }
  });
  c.rounds=r; saveSession(S.session); render();
}
function paintAmrap(i){
  const t=document.getElementById('clk-time');
  if(t){ t.textContent=fmtTime(i.rem); t.classList.toggle('hot',i.rem<=10); }
  const rg=document.getElementById('clk-ring');
  if(rg) rg.style.strokeDashoffset=String(CLK_C*(1-i.rem/i.total));
  const el=document.getElementById('clk-elapsed');
  if(el) el.textContent=fmtTime(i.elapsed)+' / '+fmtTime(i.total);
}
function paintClock(i){
  const c=S.session.clock;
  if(c.painted!==i.round){ c.painted=i.round; render(); return; }   // new station, full repaint
  const t=document.getElementById('clk-time');
  if(t){ t.textContent=fmtTime(i.rem); t.classList.toggle('hot',i.rem<=3); }
  const rg=document.getElementById('clk-ring');
  if(rg) rg.style.strokeDashoffset=String(CLK_C*(1-i.rem/i.iv));
  const el=document.getElementById('clk-elapsed');
  if(el) el.textContent=fmtTime(i.elapsed)+' / '+fmtTime(i.rounds*i.iv);
}
function finishClock(){
  stopClockTimer();
  const c=S.session&&S.session.clock; if(!c) return;
  const b=blockOf(c.bi);
  // An EMOM backfills: the clock ran, so the work happened. An AMRAP must NOT,
  // because only the rounds you actually tapped were actually done.
  if(b && b.kind!=='amrap'){ const R=clockRounds(b); for(let r=0;r<R;r++) logRound(b,r); }
  S.session.clock=null; saveSession(S.session);
  tone(880,0.3,1); setTimeout(()=>tone(660,0.55,1),330);
  go('workout');
}
function endClockEarly(){
  if(!confirm('End this block early? Rounds you already finished stay logged.')) return;
  stopClockTimer();
  if(S.session){ S.session.clock=null; saveSession(S.session); }
  go('workout');
}
function pauseClock(){
  const c=S.session&&S.session.clock; if(!c||c.pausedAt) return;
  c.pausedAt=Date.now(); saveSession(S.session); render();
}
function resumeClock(){
  const c=S.session&&S.session.clock; if(!c||!c.pausedAt) return;
  c.pauseAcc=(c.pauseAcc||0)+(Date.now()-c.pausedAt);
  c.pausedAt=null; c.lastBeep=null; saveSession(S.session);
  unlockAudio(); runClock(); render();
}

/* ── REST TIMERS ─────────────────────────────────────────────── */
function startRest(key,dur){
  if(dur===0) return;          // interval-clock blocks handle their own timing
  stopRest(key);
  const secs=Math.max(5,dur|0||90);
  const endTs=Date.now()+secs*1000;
  const iv=setInterval(()=>{
    const t=S.restTimers[key]; if(!t){clearInterval(iv);return;}
    const rem=Math.max(0,Math.round((t.endTs-Date.now())/1000));
    beepCountdown(rem);
    const tel=document.getElementById('rt-'+key), bel=document.getElementById('rb-'+key), lel=document.getElementById('rl-'+key);
    if(rem<=0){
      clearInterval(iv); t.done=true;
      if(bel){bel.classList.remove('counting');bel.classList.add('done-rest');}
      if(tel) tel.textContent='✓';
      if(lel) lel.textContent='Rest done — go';
      setTimeout(()=>skipRest(key),2500);
    }else{
      if(tel) tel.textContent=rem<=3?String(rem):fmtTime(rem);
      if(rem<=3){ if(bel)bel.classList.add('counting'); if(lel)lel.textContent='Get ready'; }
    }
  },1000);
  S.restTimers[key]={endTs,iv,done:false,dur:secs};
}
function stopRest(k){ const t=S.restTimers[k]; if(t){clearInterval(t.iv); delete S.restTimers[k];} }
function skipRest(k){ stopRest(k); const el=document.getElementById('rb-'+k); if(el) el.style.display='none'; }
function clearAllRest(){ Object.keys(S.restTimers).forEach(stopRest); }

function backupString(){
  return JSON.stringify({app:'recomp',v:2,exported:new Date().toISOString(),history:S.history,bwLog:S.bwLog,program:S.program});
}
async function copyBackup(){
  const data=backupString();
  try{
    await navigator.clipboard.writeText(data);
    alert('Backup copied. Paste it into your Notes app to keep it safe.');
  }catch{
    const ta=document.createElement('textarea');
    ta.value=data; ta.style.position='fixed'; ta.style.top='-1000px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch{}
    document.body.removeChild(ta);
    if(ok) alert('Backup copied. Paste it into Notes to keep it safe.');
    else { const box=document.getElementById('backup-out'); if(box){box.style.display='block';box.value=data;box.select();} alert('Copy blocked — the text is now in the box below. Select all and copy manually.'); }
  }
}
function downloadBackup(){
  try{
    const blob=new Blob([backupString()],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`recomp-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }catch{ alert('Download not supported here — use Copy instead.'); }
}
async function restoreBackup(){
  const box=document.getElementById('restore-in');
  let raw=box&&box.value&&box.value.trim();
  if(!raw){ try{ raw=await navigator.clipboard.readText(); }catch{} }
  if(!raw) raw=prompt('Paste your backup text:')||'';
  raw=raw.trim();
  if(!raw){ alert('Nothing to restore.'); return; }
  let p;
  try{ p=JSON.parse(raw); }catch{ alert('That text is not a valid backup. Make sure you pasted the whole thing.'); return; }
  if(!p||!Array.isArray(p.history)){ alert('That backup does not contain any history.'); return; }
  const merged=mergeHistory(S.history,p.history);
  if(!confirm(`Restore ${p.history.length} sessions?\n\nYou will have ${merged.length} sessions total after merging with what's already here.`)) return;
  S.history=merged;
  if(Array.isArray(p.bwLog)&&p.bwLog.length) S.bwLog=p.bwLog;
  if(Array.isArray(p.program)&&p.program.length) S.program=p.program;
  await saveHistory(S.history); await saveBW(S.bwLog); await saveProgram(S.program);
  alert(`Restored. You now have ${S.history.length} sessions.`);
  go('history');
}

/* ══════════════════════════════════════════════════════════════
   13. PLATE CALCULATOR
   ══════════════════════════════════════════════════════════════ */
const PLATES=[45,35,25,10,5,2.5];
const PLATE_CLR={45:'#c0392b',35:'#b86e00',25:'#1d5fa8',10:'#2d7a4f',5:'#6b3fa0',2.5:'#888880'};
function calcPlates(target,bar){
  let rem=(target-bar)/2;
  if(rem<0) return null;
  const out=[];
  for(const p of PLATES){
    const n=Math.floor(rem/p);
    if(n>0){ out.push({p,n}); rem=Math.round((rem-p*n)*100)/100; }
  }
  return rem>0.1?null:out;
}

/* ── exercise card ───────────────────────────────────────────── */
function exCard(ex){
  const sub=activeSubFor(ex);
  const id=activeIdFor(ex);
  const sets=S.session.setData[id]||blankSets(ex.sets);
  const drop=S.session.dropData[id]||{weight:'',reps:'',done:false};
  const name=sub?sub.name:ex.name;
  const note=sub?sub.note:ex.note;
  const last=workingOnly(getLastPerf(id));
  const lastDrop=getLastDrop(id);
  const tgt=getTarget(last,ex.reps);
  const allW=sets.every(s=>s.done);
  const allD=allW&&(!ex.dropSet||drop.done);
  const anyD=sets.some(s=>s.done);
  const lastWorkDone=sets.length?sets[sets.length-1].done:false;
  const isPR=sessionPRs().includes(id);
  const rest=ex.noRest?0:(ex.rest||90);   // clock blocks time themselves
  const hasForm=!!FORM[id];

  let h=`<div class="ex-card${anyD&&!allD?' any-done':''}${allD?' all-done':''}">`;
  if(isPR) h+=`<div class="pr-banner"><span>🏆</span><span class="pr-banner-text">New PR on ${esc(name)}</span></div>`;
  h+=`<div class="ex-header">
    <div class="ex-name">${allD?'✓ ':''}${esc(name)}</div>
    <div class="ex-header-right">
      ${hasForm?`<button class="pill-btn" onclick="S.formModal='${id}';render()">Form</button>`:''}
      <div class="ex-badge">${ex.sets}×${esc(String(ex.reps).replace(/,/g,'·'))}</div>
    </div></div>`;
  if(note) h+=`<div class="ex-note">${esc(note)}</div>`;
  if(ex.scheme==='pyramid') h+=`<div class="scheme-tag pyr">REVERSE PYRAMID · heaviest set first</div>`;
  if(ex.scheme==='tempo')   h+=`<div class="scheme-tag tmp">TEMPO ${esc(ex.tempo||'4-1-X-0')} · ~${(parseInt(String(ex.reps))||8)*6}s under tension</div>`;

  // sub chips — one per sub, tracked separately
  if((ex.subs||[]).length&&!allD){
    h+=`<div class="sub-row">`;
    h+=`<button class="sub-btn${sub?'':' active'}" onclick="togSub('${ex.id}',${S.session.activeSubs[ex.id]==null?-1:S.session.activeSubs[ex.id]})">${esc(ex.name)}</button>`;
    ex.subs.forEach((s,i)=>{
      const on=S.session.activeSubs[ex.id]===i;
      h+=`<button class="sub-btn${on?' active':''}" onclick="togSub('${ex.id}',${i})">${esc(s.name)}</button>`;
    });
    h+=`</div>`;
  }

  if(tgt&&!allD) h+=`<div class="target-box"><div class="target-label">Today's target${sub?' · '+esc(sub.name):''}</div><div class="target-text">${esc(tgt.label)}</div></div>`;

  if(last&&last.length){
    const rm=best1RM(last.filter(s=>s.done||s.weight));
    const hint=overloadHint(last,ex.reps,ex);
    h+=`<div class="last-box"><div class="last-label">Last time${sub?' · '+esc(sub.name):''}</div><div class="last-chips">
      ${last.map(s=>`<span class="last-chip">${s.weight?esc(s.weight)+'lb':'—'} × ${esc(s.reps||'—')}${s.rpe?' @'+s.rpe:''}</span>`).join('')}
      ${ex.dropSet&&lastDrop?`<span class="last-chip drop">↓ ${esc(lastDrop.weight||'?')}lb × ${esc(lastDrop.reps||'?')}</span>`:''}
    </div>${rm?`<div class="last-rm">Est. 1RM ${rm}lb</div>`:''}${hint?`<div class="last-hint">${hint}</div>`:''}</div>`;
  }

  const perSet=getSetTargets(ex);
  const warmCount=sets.filter(s=>s.warm).length;
  h+=`<div class="sets-area">`;
  if(warmCount) h+=`<div class="warm-head">Warm-up · not counted</div>`;
  let workIdx=0;
  sets.forEach((set,i)=>{
    const rk=id+'_'+i;
    const isWarm=!!set.warm;
    if(!isWarm && warmCount && workIdx===0) h+=`<div class="work-head">Working sets</div>`;
    const t = isWarm ? null : (perSet[workIdx]||null);
    const phW = t&&t.weight ? t.weight : 'lb';
    const phR = t&&t.reps ? t.reps : (isTimeBased(ex.reps)?'sec':'reps');
    h+=`<div class="set-row">
      <div class="${isWarm?'warm-label':'set-num'}">${isWarm?'W'+(i+1):(workIdx+1)}</div>
      <input class="set-input${isWarm?' warm-inp':''}${set.done?' done':''}" type="number" inputmode="decimal" placeholder="${esc(phW)}" value="${esc(set.weight)}" ${set.done?'readonly':''} onchange="updSet('${id}',${i},'weight',this.value)">
      <input class="set-input${isWarm?' warm-inp':''}${set.done?' done':''}" type="number" inputmode="numeric" placeholder="${esc(phR)}" value="${esc(set.reps)}" ${set.done?'readonly':''} onchange="updSet('${id}',${i},'reps',this.value)">
      <button class="check-btn${isWarm?' warm-btn':''}${set.done?' done':''}" onclick="togSet('${id}',${i},${isWarm?45:rest})">${set.done?'✓':'○'}</button>
    </div>`;
    if(set.done && !isWarm){
      h+=`<div class="rpe-row"><span class="rpe-label">RPE</span>
        ${[6,7,8,9,10].map(r=>`<button class="rpe-btn${set.rpe===r?' sel':''}" onclick="updSet('${id}',${i},'rpe',${set.rpe===r?'null':r});render()">${r}</button>`).join('')}
        ${set.rpe?`<span class="rpe-hint">${RPE_LABELS[set.rpe]}</span>`:''}</div>`;
    }
    h+=restBanner(rk);
    if(!isWarm) workIdx++;
  });
  h+=`</div>`;

  if(ex.dropSet){
    h+=`<div class="drop-area${!lastWorkDone&&!drop.done?' faded':''}">
      <div class="drop-label">↓ Drop set — cut 20-30%, go straight in, no rest</div>
      <div class="set-row">
        <div class="set-num" style="color:#c0392b">↓</div>
        <input class="set-input drop-inp${drop.done?' done':''}" type="number" inputmode="decimal" placeholder="lb" value="${esc(drop.weight)}" ${drop.done?'readonly':''} onchange="updDrop('${id}','weight',this.value)">
        <input class="set-input drop-inp${drop.done?' done':''}" type="number" inputmode="numeric" placeholder="reps" value="${esc(drop.reps)}" ${drop.done?'readonly':''} onchange="updDrop('${id}','reps',this.value)">
        <button class="check-btn drop-btn${drop.done?' done':''}" onclick="togDrop('${id}')">${drop.done?'✓':'○'}</button>
      </div>${restBanner(id+'_drop')}</div>`;
  }
  return h+`</div>`;
}

/* ── block card (kettlebell days) ─────────────────────────────── */
function countClockDone(b){
  let n=0;
  (b.ids||[]).forEach(id=>{
    const e=exById(id); if(!e) return;
    const arr=S.session.setData[activeIdFor(e)]||[];
    n+=arr.filter(s=>s&&s.done&&!s.warm).length;
  });
  return n;
}
function blockCard(b,bi){
  const exs=blockExercises(bi);
  const isAmrap=b.kind==='amrap';
  const isClock=b.kind==='clock'||isAmrap;
  const live=S.session.clock&&S.session.clock.bi===bi;
  let h=`<div class="blk${isClock?' blk-clock':''}">
    <div class="blk-head">
      <div><div class="blk-title">${esc(b.label)}</div>
      <div class="blk-meta">${isAmrap?`AMRAP · ${b.minutes} min · as many rounds as you can`
        :b.quiet?`${b.minutes} min · one minute each · no counting`
        :isClock?`${clockKind(b)} · ${b.minutes} min · ${clockRounds(b)} rounds`:`${b.minutes} min`}</div></div>
      <div class="blk-num">${bi+1}</div>
    </div>`;
  if(b.note) h+=`<div class="blk-note">${esc(b.note)}</div>`;

  if(isClock){
    const ids=b.ids||[];
    if(ids.length>1&&!isAmrap){
      h+=`<div class="blk-order">`;
      ids.forEach((id,k)=>{
        const e=exById(id); if(!e) return;
        h+=`<div class="blk-ord-row">
          <span class="blk-ord-min">${b.interval===60?'min '+(k+1):'slot '+(k+1)}</span>
          <span class="blk-ord-nm">${esc(dispName(e))}</span>
          <span class="blk-ord-rp">${esc(e.repLabel||e.reps)}</span></div>`;
      });
      h+=`</div>`;
    }
    if(live){
      h+=`<div class="clk-run-banner" onclick="go('clock')">
        <div class="clk-run-t">Clock running — tap to return</div><div class="clk-run-a">→</div></div>`;
    }else if(isAmrap){
      const done=countClockDone(b), per=(b.ids||[]).length||1;
      const rounds=Math.round(done/per), best=lastAmrapRounds(b);
      h+=`<button class="btn-clock" onclick="startClock(${bi})">▶ Start ${b.minutes}-minute AMRAP</button>`;
      h+=`<div class="blk-done-lbl"${rounds?'':' style="color:#a09c93"'}>${
        rounds ? rounds+' round'+(rounds>1?'s':'')+' logged this session'
               : (best ? 'Last time you got '+best+' rounds. Beat it.' : 'Rounds are the score. Set a number to beat.')
      }</div>`;
    }else{
      const done=countClockDone(b), R=clockRounds(b);
      h+=`<button class="btn-clock" onclick="startClock(${bi})">▶ ${done>=R?'Run again':'Start'} ${b.minutes}-minute clock</button>`;
      if(done) h+=`<div class="blk-done-lbl">${done} / ${R} rounds logged</div>`;
      else h+=`<div class="blk-done-lbl" style="color:#a09c93">Pick your bells and subs below first</div>`;
    }
  }
  h+=`<div class="blk-body">${exs.map(exCard).join('')}</div>`;
  return h+`</div>`;
}

/* ── the clock screen ─────────────────────────────────────────── */
function clockView(){
  const i=clockInfo();
  if(!i) return `<div class="pad"><div class="card">This block isn't running.</div>
    <button class="btn-secondary" style="margin-top:12px" onclick="go('workout')">Back to workout</button></div>`;
  if(i.amrap) return amrapView(i);
  const st=i.station;
  const id=st?activeIdFor(st):'';
  const sd=(st&&S.session.setData[id])||[];
  const wc=(st&&st.warmup&&st.warmup.length)||0;
  const row=sd[wc+i.cycle];
  const wt=(row&&row.weight)||(st&&st.defaultWeight)||'';
  const rp=st?(st.repLabel||(isTimeBased(st.reps)?st.reps:st.reps+' reps')):'';
  const cue=st?(activeSubFor(st)?activeSubFor(st).note:st.note):'';
  const nx=i.next, nrp=nx?(nx.repLabel||(isTimeBased(nx.reps)?nx.reps:nx.reps+' reps')):'';

  let h=`<div class="clk">
    <div class="clk-top">
      <div class="clk-blk">${esc(i.b.label)} · ${clockKind(i.b)}</div>
      <div class="clk-elapsed" id="clk-elapsed">${fmtTime(i.elapsed)} / ${fmtTime(i.rounds*i.iv)}</div>
    </div>
    <div class="clk-dial">
      <svg class="clk-svg" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="clk-trk" cx="100" cy="100" r="${CLK_R}"></circle>
        <circle class="clk-arc" id="clk-ring" cx="100" cy="100" r="${CLK_R}"
          style="stroke-dashoffset:${CLK_C*(1-i.rem/i.iv)}"></circle>
      </svg>
      <div class="clk-ctr">
        <div class="clk-time${i.rem<=3?' hot':''}" id="clk-time">${fmtTime(i.rem)}</div>
        <div class="clk-round" id="clk-round">${i.b.quiet?`${i.round+1} of ${i.rounds}`:`Round ${i.round+1} / ${i.rounds}`}</div>
      </div>
    </div>
    <div class="clk-now">
      <div class="clk-now-lbl">NOW</div>
      <div class="clk-now-nm">${esc(dispName(st))}</div>
      <div class="clk-now-rp">${esc(rp)}${wt?' · '+esc(String(wt))+' lb':''}</div>
    </div>`;
  if(cue) h+=`<div class="clk-cue">${esc(cue)}</div>`;

  if(i.paused){
    h+=`<div class="clk-paused">
      <div class="clk-paused-t"><span class="pausebars"><i></i><i></i></span>Paused</div>
      <div class="clk-paused-s">Clock stopped where it was. Nothing lost.</div></div>
    <div class="clk-btns">
      <button class="clk-btn go" onclick="resumeClock()">▶ Resume</button>
      <button class="clk-btn end" onclick="endClockEarly()">End block</button></div>`;
  }else{
    // On a one-movement block the next round is the same movement, so the
    // useful thing to show is the rest you have left before it comes round.
    const single=i.n===1;
    h+=`<div class="clk-next">
      <div class="clk-next-lbl">${nx?(single?'THEN':'UP<br>NEXT'):'DONE'}</div>
      <div class="clk-next-nm">${nx?(single?'Rest, then round '+(i.round+2):esc(dispName(nx))):'Last round — finish it'}</div>
      <div class="clk-next-rp">${nx?(single?'of '+i.rounds:esc(nrp)):'—'}</div></div>
    <div class="clk-btns">
      <button class="clk-btn" onclick="pauseClock()"><span class="pausebars"><i></i><i></i></span>Pause</button>
      <button class="clk-btn end" onclick="endClockEarly()">End block</button></div>`;
  }
  return h+`</div>`;
}

/* ── the AMRAP screen ─────────────────────────────────────────── */
function amrapView(i){
  const beat = i.target>0 && i.rounds>i.target;
  let h=`<div class="clk">
    <div class="clk-top">
      <div class="clk-blk">${esc(i.b.label)} · AMRAP</div>
      <div class="clk-elapsed" id="clk-elapsed">${fmtTime(i.elapsed)} / ${fmtTime(i.total)}</div>
    </div>
    <div class="clk-dial">
      <svg class="clk-svg" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="clk-trk" cx="100" cy="100" r="${CLK_R}"></circle>
        <circle class="clk-arc" id="clk-ring" cx="100" cy="100" r="${CLK_R}"
          style="stroke-dashoffset:${CLK_C*(1-i.rem/i.total)}"></circle>
      </svg>
      <div class="clk-ctr">
        <div class="clk-time${i.rem<=10?' hot':''}" id="clk-time">${fmtTime(i.rem)}</div>
        <div class="clk-round">time left</div>
      </div>
    </div>
    <div class="amr-rounds">
      <div class="amr-lbl">ROUNDS COMPLETE</div>
      <div class="amr-n">${i.rounds}</div>
      <div class="amr-target${beat?' beat':''}">${
        i.target>0 ? (beat?'past your best of '+i.target:'last time: '+i.target) : 'first time through, set the number'
      }</div>
    </div>`;

  if(i.paused){
    h+=`<div class="clk-paused">
      <div class="clk-paused-t"><span class="pausebars"><i></i><i></i></span>Paused</div>
      <div class="clk-paused-s">Clock stopped. Your rounds are safe.</div></div>
    <div class="clk-btns">
      <button class="clk-btn go" onclick="resumeClock()">▶ Resume</button>
      <button class="clk-btn end" onclick="endClockEarly()">End block</button></div>`;
  }else{
    h+=`<button class="amr-tap" onclick="amrapRound()">+ 1 ROUND</button>`;
    if(i.rounds>0) h+=`<div style="text-align:center"><button class="amr-undo" onclick="amrapUndo()">undo last round</button></div>`;
    h+=`<div class="amr-list">`;
    (i.ids||[]).forEach(id=>{
      const e=exById(id); if(!e) return;
      h+=`<div class="amr-row"><span class="amr-row-nm">${esc(dispName(e))}</span>
        <span class="amr-row-rp">${esc(e.repLabel||e.reps)}</span></div>`;
    });
    h+=`</div>
    <div class="clk-btns">
      <button class="clk-btn" onclick="pauseClock()"><span class="pausebars"><i></i><i></i></span>Pause</button>
      <button class="clk-btn end" onclick="endClockEarly()">End block</button></div>`;
  }
  return h+`</div>`;
}

/* ── stats ───────────────────────────────────────────────────── */
function statsView(){
  const now=Date.now(), week=7*864e5;
  const recent=S.history.filter(e=>now-new Date(e.date).getTime()<week);
  const ms={};
  recent.forEach(e=>{
    Object.keys(e.sets||{}).forEach(id=>{
      const done=(e.sets[id]||[]).filter(s=>s.done).length;
      if(!done) return;
      const m=lookupMuscle(id); if(!m||m==='Cardio') return;
      ms[m]=(ms[m]||0)+done;
    });
  });
  // PRs across all ids
  const prMap={};
  S.history.forEach(e=>{
    Object.keys(e.sets||{}).forEach(id=>{
      const rm=best1RM((e.sets[id]||[]).filter(s=>s.done||s.weight));
      if(rm&&(!prMap[id]||rm>prMap[id].rm)) prMap[id]={rm,date:e.date};
    });
  });

  // plate calc
  const bar=S.plateBar, tv=S.plateTarget;
  let plateOut='';
  if(tv){
    const t=parseFloat(tv);
    if(!t||t<bar) plateOut=`<div style="font-size:13px;color:#c0392b;margin-top:8px">Target must be at least the bar (${bar}lb).</div>`;
    else{
      const pl=calcPlates(t,bar);
      if(!pl) plateOut=`<div style="font-size:13px;color:#c0392b;margin-top:8px">Can't hit ${t}lb exactly. Try ${Math.round(t/5)*5}lb.</div>`;
      else if(!pl.length) plateOut=`<div style="font-size:14px;margin-top:8px">Just the bar — ${bar}lb.</div>`;
      else plateOut=`<div style="margin-top:10px">
        <div style="font-size:12px;color:#888880;margin-bottom:7px">Per side</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${pl.map(x=>`<span class="mono" style="font-size:13px;font-weight:700;padding:6px 12px;border-radius:8px;border:2px solid ${PLATE_CLR[x.p]};color:${PLATE_CLR[x.p]};background:#fff">${x.n}×${x.p}</span>`).join('')}</div>
        <div class="mono" style="font-size:11px;color:#888880;margin-top:8px">${bar}lb bar + ${(t-bar)/2}lb each side = ${t}lb</div></div>`;
    }
  }

  let h=`<div class="pad">${navTabs('stats')}${sessionBanner()}`;

  h+=`<div class="card"><div class="card-title">Plate calculator</div>
    <div class="field-row">
      <input class="field" type="number" inputmode="decimal" placeholder="Target lb" value="${esc(tv)}" onchange="S.plateTarget=this.value;render()">
      <button class="field" style="width:auto;white-space:nowrap;background:${bar===45?'#1a1a18':'#fff'};color:${bar===45?'#fff':'#888880'};font-weight:600" onclick="S.plateBar=45;render()">45lb</button>
      <button class="field" style="width:auto;white-space:nowrap;background:${bar===35?'#1a1a18':'#fff'};color:${bar===35?'#fff':'#888880'};font-weight:600" onclick="S.plateBar=35;render()">35lb</button>
    </div>${plateOut}</div>`;

  h+=`<div class="sec-label">Weekly volume · last 7 days</div>`;
  if(!recent.length) h+=`<div class="empty"><div class="empty-icon">📊</div>Finish a workout to see your volume</div>`;
  else Object.keys(MUSCLE_TARGETS).filter(m=>m!=='Cardio').forEach(m=>{
    const n=ms[m]||0, t=MUSCLE_TARGETS[m];
    const pct=Math.min(n/t.max*100,100);
    const col=n<t.min?'#b86e00':n>t.max?'#1d5fa8':'#2d7a4f';
    const lbl=n===0?'0 sets':n<t.min?`${n} — aim ${t.min}+`:n>t.max?`${n} — above target`:`${n} ✓`;
    h+=`<div class="vol-bar-wrap">
      <div class="vol-bar-row"><span class="vol-bar-name">${m}</span><span class="vol-bar-status" style="color:${col}">${lbl}</span></div>
      <div class="vol-bar-bg"><div class="vol-bar-fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="vol-bar-minmax"><span>${t.min} min</span><span>${t.max} max</span></div></div>`;
  });

  const prs=Object.entries(prMap).sort((a,b)=>b[1].rm-a[1].rm).slice(0,14);
  h+=`<div class="sec-label">Personal records · est. 1RM</div>`;
  if(!prs.length) h+=`<div class="empty"><div class="empty-icon">🏆</div>No PRs yet</div>`;
  else prs.forEach(([id,pr])=>{
    h+=`<div class="pr-row"><div><div style="font-size:14px;font-weight:600">${esc(lookupName(id))}</div>
      <div class="mono" style="font-size:11px;color:#888880;margin-top:2px">${fmtShort(pr.date)}</div></div>
      <div><div class="pr-row-val">${pr.rm}lb</div><div class="mono" style="font-size:10px;color:#888880;text-align:right">est. 1RM</div></div></div>`;
  });

  // strength trends for the ids with the most data
  const counts={};
  S.history.forEach(e=>Object.keys(e.sets||{}).forEach(id=>{counts[id]=(counts[id]||0)+1;}));
  const tracked=Object.keys(counts).filter(id=>counts[id]>=2).sort((a,b)=>counts[b]-counts[a]).slice(0,6);
  if(tracked.length){
    h+=`<div class="sec-label">Strength trends</div>`;
    tracked.forEach(id=>{
      const pts=[];
      S.history.forEach(e=>{
        const rm=best1RM((e.sets&&e.sets[id]||[]).filter(s=>s.done||s.weight));
        if(rm) pts.push({t:new Date(e.date).getTime(),rm});
      });
      pts.sort((a,b)=>a.t-b.t);
      if(pts.length<2) return;
      const first=pts[0].rm, latest=pts[pts.length-1].rm;
      const ch=Math.round((latest-first)*10)/10;
      const col=ch>0?'#2d7a4f':ch<0?'#c0392b':'#888880';
      const W=300,H=64,P=5;
      const mn=Math.min(...pts.map(p=>p.rm))*0.96, mx=Math.max(...pts.map(p=>p.rm))*1.04;
      const t0=pts[0].t, t1=pts[pts.length-1].t;
      const X=t=>P+(t1===t0?0:(t-t0)/(t1-t0))*(W-P*2);
      const Y=r=>H-P-(mx===mn?0:(r-mn)/(mx-mn))*(H-P*2);
      const d=pts.map((p,i)=>`${i?'L':'M'}${X(p.t).toFixed(1)},${Y(p.rm).toFixed(1)}`).join(' ');
      h+=`<div style="margin-bottom:20px">
        <div style="font-size:14px;font-weight:700">${esc(lookupName(id))}</div>
        <div class="mono" style="font-size:11px;color:#888880;margin:3px 0 6px;display:flex;justify-content:space-between">
          <span>Now ${latest}lb</span><span style="color:${col}">${ch>0?'+':''}${ch}lb overall</span></div>
        <svg viewBox="0 0 ${W} ${H}" height="${H}" style="width:100%">
          <path d="${d}" fill="none" stroke="#1a1a18" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          ${pts.map(p=>`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.rm).toFixed(1)}" r="3" fill="#1a1a18"/>`).join('')}
        </svg></div>`;
    });
  }

  // bodyweight
  h+=`<div class="sec-label">Bodyweight</div>
    <div class="field-row" style="margin-bottom:10px">
      <input class="field" type="number" inputmode="decimal" placeholder="lb today" value="${esc(S.bwInput)}" onchange="S.bwInput=this.value">
      <button class="field" style="width:auto;background:#1a1a18;color:#fff;font-weight:700;white-space:nowrap" onclick="logBodyweight()">Log</button>
    </div>`;
  if(!S.bwLog.length) h+=`<div style="font-size:13px;color:#888880">Log weekly — strength up with weight flat is exactly what recomp looks like.</div>`;
  else{
    if(S.bwLog.length>=2){
      const diff=Math.round((S.bwLog[0].weight-S.bwLog[S.bwLog.length-1].weight)*10)/10;
      const col=diff<0?'#2d7a4f':diff>0?'#b86e00':'#888880';
      h+=`<div class="mono" style="font-size:12px;color:${col};margin-bottom:10px">${diff===0?'No change':(diff<0?'↓ '+Math.abs(diff):'↑ '+diff)+'lb since first entry'}</div>`;
    }
    h+=S.bwLog.slice(0,8).map(e=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0ede8;font-size:13px">
      <span class="mono" style="color:#888880;font-size:11px">${fmtLong(e.date)}</span>
      <span class="mono" style="font-weight:600">${e.weight}lb</span></div>`).join('');
  }
  return h+`</div>`;
}

      </div>
      <button class="ed-icon-btn" onclick="edMove('${ex.id}',-1)" ${i===0?'disabled style="opacity:.3"':''}>↑</button>
      <button class="ed-icon-btn" onclick="edMove('${ex.id}',1)" ${i===day.exercises.length-1?'disabled style="opacity:.3"':''}>↓</button>
      <button class="ed-icon-btn" onclick="edStartEdit('${ex.id}')">✎</button>
      <button class="ed-icon-btn danger" onclick="edDelete('${ex.id}')">✕</button>
    </div>`;
    if((ex.subs||[]).length){
      h+=`<div style="padding:0 0 10px 14px">${ex.subs.map(s=>`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
          <div style="flex:1;font-size:12.5px;color:#666">↳ ${esc(s.name)}</div>
          <button class="ed-icon-btn danger" style="width:26px;height:26px;font-size:12px" onclick="edRemoveSub('${ex.id}','${s.id}')">✕</button>
        </div>`).join('')}</div>`;
    }
    h+=`<div style="padding:0 0 12px 14px"><button class="sub-btn" onclick="edAddSub('${ex.id}')">+ Add substitute</button></div>`;
  });

  h+=`<button class="btn-secondary" style="margin-top:8px" onclick="edStartAdd()">+ Add exercise to ${esc(day.name)}</button>`;
  return h+`</div>`;
}

/* ── history ─────────────────────────────────────────────────── */
function historyView(){
  let h=`<div class="pad">${navTabs('history')}${sessionBanner()}`;

  h+=`<div class="card warn"><div class="card-title">Back up your data</div>
    <div style="font-size:13px;color:#666;margin-bottom:12px">Do this after every few workouts. Paste it into Notes. It is the only thing that makes your history truly safe.</div>
    <button class="btn-primary" onclick="copyBackup()" style="margin-bottom:8px">Copy my data</button>
    <button class="btn-secondary" onclick="downloadBackup()" style="margin-bottom:14px">Download as file</button>
    <textarea id="backup-out" class="txt-area" style="display:none;margin-bottom:12px" readonly></textarea>
    <div class="card-title" style="margin-top:4px">Restore</div>
    <textarea id="restore-in" class="txt-area" placeholder="Paste a backup here, then tap Restore"></textarea>
    <button class="btn-green" style="margin-top:10px" onclick="restoreBackup()">Restore data</button>
    <div style="font-size:11.5px;color:#888880;margin-top:8px">Restoring merges with what's already here — nothing is overwritten or lost.</div>
  </div>`;

  h+=`<div class="sec-label">Past sessions · ${S.history.length}</div>`;
  if(!S.history.length){ h+=`<div class="empty"><div class="empty-icon">📋</div>No sessions yet</div>`; return h+`</div>`; }

  [...S.history].reverse().forEach(e=>{
    const ids=Object.keys(e.sets||{});
    const lines=ids.map(id=>{
      const arr=(e.sets[id]||[]).filter(s=>s.done||s.weight);
      if(!arr.length) return '';
      const txt=arr.map(s=>`${s.weight||'?'}×${s.reps||'?'}${s.rpe?'@'+s.rpe:''}`).join(', ');
      const d=(e.drops||{})[id];
      const ds=d&&(d.weight||d.reps)?` ↓${d.weight||'?'}×${d.reps||'?'}`:'';
      return `<div>${esc(lookupName(id))}: ${esc(txt)}${esc(ds)}</div>`;
    }).filter(Boolean).join('');
    h+=`<div class="hist-entry">
      <div class="hist-date">${fmtLong(e.date)} · ${e.duration||'—'} min</div>
      <div class="hist-day">${esc(e.dayName||'Workout')}</div>
      <div class="hist-exs">${lines||'—'}</div></div>`;
  });
  return h+`</div>`;
}

/* ── main view ───────────────────────────────────────────────── */
const DAY_GROUPS=[
  ['build','Build',      'long sessions, straight sets, real rest'],
  ['short','20 minutes', 'squeeze in anywhere'],
  ['cond', 'Conditioning','kettlebell circuits, bring a towel'],
  ['gym',  'Gym',        'needs machines, cables or dumbbells'],
];
function groupOf(d){ return d.group || (d.kb?'cond':'gym'); }

function view(){
  if(!S.ready) return `<div style="display:flex;align-items:center;justify-content:center;height:70vh;color:#b0ada6" class="mono">LOADING</div>`;

  // Guarantee the session is well-formed before anything reads it
  if(S.session && !normalizeSession()){
    S.session=null; saveSession(null);
    if(S.screen==='workout') S.screen='home';
  }
  if(!S.session && S.screen==='workout') S.screen='home';
  // the clock screen only exists while a clock is actually running
  if(S.screen==='clock' && !(S.session&&S.session.clock)) S.screen=S.session?'workout':'home';
  if(S.screen==='clock') return clockView();   // full-bleed, no header or tabs

  const day=S.session?getDay(S.session.dayId):null;
  const p=calcProg();
  const titles={home:'Choose a day',workout:day?day.name:'Workout',summary:'Done',history:'History',stats:'Stats',program:'Program',clock:'Clock'};
  const badge=S.screen==='workout'?(day?day.type:''):S.screen==='summary'?'✓':'—';

  let header=`<div class="header"><div class="header-row">
    <div><div class="logo">Recomp Workout</div><div class="day-label">${esc(titles[S.screen]||'')}</div></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
      <div class="badge">${esc(badge)}</div>
      ${S.screen==='workout'?`<div class="timer-txt" id="etxt">${fmtTime(S.elapsed)}</div>`:''}
    </div></div>`;
  if(S.screen==='workout'&&S.session){
    header+=`<div class="prog-bar-wrap"><div class="prog-bar-fill" style="width:${p.pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
        <div class="prog-lbl">${p.done} / ${p.total} sets</div>
        ${S.paused
          ?`<button class="hdr-btn resume" onclick="resumeWorkout()">▶ Resume</button>`
          :`<button class="hdr-btn pause" onclick="pauseWorkout()"><span class="pausebars"><i></i><i></i></span>Pause</button>`}
      </div>`;
  }
  header+=`</div>`;

  let body='';

  if(S.screen==='home'){
    const prog=getProgram();
    const dayCard=d=>{
      const last=[...S.history].reverse().find(e=>e.dayId===d.id);
      const active=S.session&&S.session.dayId===d.id;
      const tint = d.tint?(' is-'+d.tint) : d.kb?' is-kb' : d.id==='hiit'?' is-hiit' : d.id==='pyramid'?' is-pyr' : d.id==='tempo'?' is-tmp' : '';
      const cls=active?' is-active':(tint&&!last)?tint:last?' has-history':(tint||'');
      return `<div class="day-card${cls}" onclick="handleDayTap('${d.id}')">
        ${last&&!active?'<div class="green-dot"></div>':''}
        <div class="day-card-type">${esc(d.type)}</div>
        <div class="day-card-name">${esc(d.name)}</div>
        <div class="day-card-sub">${active?`${p.done}/${p.total} sets · in progress`:esc(d.focus)}</div>
        ${last&&!active?`<div class="day-card-last">Last ${fmtShort(last.date)}</div>`:''}
        ${active?`<div class="day-card-last">Tap to resume →</div>`:''}
      </div>`;
    };
    body=`<div class="pad">${navTabs('home')}${sessionBanner()}`;
    const seen={};
    DAY_GROUPS.forEach(([key,label,sub])=>{
      const list=prog.filter(d=>groupOf(d)===key);
      if(!list.length) return;
      list.forEach(d=>seen[d.id]=1);
      body+=`<div class="grp-head">${esc(label)} <span class="grp-sub">· ${esc(sub)}</span></div>
        <div class="day-grid">${list.map(dayCard).join('')}</div>`;
    });
    const rest=prog.filter(d=>!seen[d.id]);
    if(rest.length) body+=`<div class="grp-head">Other</div><div class="day-grid">${rest.map(dayCard).join('')}</div>`;
    body+=`</div>`;
  }

  else if(S.screen==='workout'&&S.session&&day){
    if(S.paused){
      body=`<div class="pad">${navTabs('workout')}
        <div class="card warn" style="text-align:center;padding:26px 20px">
          <div style="margin-bottom:10px;color:#b86e00"><span class="pausebars big"><i></i><i></i></span></div>
          <div style="font-size:18px;font-weight:700;color:#b86e00">Paused</div>
          <div style="font-size:13px;color:#888880;margin-top:4px">Timer stopped. Take your time.</div></div>
        <button class="btn-amber" onclick="resumeWorkout()">▶ Resume workout</button>
        <button class="btn-ghost" style="margin-top:10px" onclick="discardWorkout()">Discard workout</button></div>`;
    }else{
      const workBody = (day.blocks&&day.blocks.length)
        ? day.blocks.map((b,bi)=>blockCard(b,bi)).join('')
        : day.exercises.map(exCard).join('');
      body=`<div class="pad">${navTabs('workout')}
        ${workBody}
        <div style="margin-top:26px">
          <button class="btn-primary" onclick="confirmFinish()">✓ Finish workout</button>
          <div class="hint-txt">Nothing saves until you tap this</div>
          <button class="btn-ghost" style="margin-top:12px" onclick="discardWorkout()">Discard workout</button>
        </div></div>`;
    }
  }

  else if(S.screen==='summary'){
    const s=S.summary;
    body=`<div class="pad">
      <div class="summary-card">
        <div style="font-size:40px;margin-bottom:8px">✓</div>
        <div style="font-size:22px;font-weight:700">${esc(s?s.dayName+' complete':'Workout complete')}</div>
        ${s?`<div style="font-size:14px;color:#888880;margin-top:4px">${fmtLong(s.date)}</div>`:''}
      </div>
      ${s&&s.prs&&s.prs.length?`<div class="pr-callout">
        <div style="font-size:14px;font-weight:700;color:#b8860b;margin-bottom:6px">🏆 New PRs</div>
        ${s.prs.map(id=>{const rm=best1RM(s.sets[id]||[]);return `<div style="font-size:13px;color:#b8860b">${esc(lookupName(id))}${rm?' — '+rm+'lb est. 1RM':''}</div>`;}).join('')}
      </div>`:''}
      ${s?`<div class="stat-grid">
        <div class="stat-box"><div class="stat-val">${s.duration}m</div><div class="stat-lbl">Duration</div></div>
        <div class="stat-box"><div class="stat-val">${s.totalDone}</div><div class="stat-lbl">Sets</div></div>
        <div class="stat-box"><div class="stat-val">${s.exCount}</div><div class="stat-lbl">Exercises</div></div>
      </div>`:''}
      <button class="btn-secondary" onclick="go('home')" style="margin-bottom:10px">← Back to days</button>
      <div class="card warn" style="margin-top:6px">
        <div class="card-title">Back up now</div>
        <div style="font-size:13px;color:#666;margin-bottom:10px">Takes 5 seconds. Paste into Notes.</div>
        <button class="btn-primary" onclick="copyBackup()">Copy my data</button>
      </div></div>`;
  }

  else if(S.screen==='stats') body=statsView();
  else if(S.screen==='program') body=programView();
  else if(S.screen==='history') body=historyView();
  else body=`<div class="pad"><button class="btn-secondary" onclick="go('home')">← Back to days</button></div>`;

  // form modal
  let modal='';
  if(S.formModal&&FORM[S.formModal]){
    const f=FORM[S.formModal];
    modal=`<div class="modal-overlay" onclick="S.formModal=null;render()">
      <div class="modal-sheet" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-header">
          <div><div class="modal-title-label">Form guide</div><div class="modal-title">${esc(lookupName(S.formModal))}</div></div>
          <button class="modal-close" onclick="S.formModal=null;render()">✕</button></div>
        ${(f.c||[]).map((c,i)=>`<div class="cue-row"><div class="cue-num">${i+1}.</div><div class="cue-text">${esc(c)}</div></div>`).join('')}
        ${f.b?`<div class="info-box blue"><div class="info-label" style="color:#1d5fa8">Breathing</div><div style="font-size:14px;color:#1d5fa8">${esc(f.b)}</div></div>`:''}
        ${f.s?`<div class="info-box amber"><div class="info-label" style="color:#b86e00">Shoulder note</div><div style="font-size:14px;color:#b86e00">${esc(f.s)}</div></div>`:''}
      </div></div>`;
  }

  return `<div onclick="unlockAudio()">${header}${body}${modal}</div>`;
}

/* ══════════════════════════════════════════════════════════════
   16. GLOBALS
   ══════════════════════════════════════════════════════════════ */
Object.assign(window,{
  S,go,handleDayTap,startWorkout,togSet,togDrop,togSub,updSet,updDrop,
  confirmFinish,discardWorkout,pauseWorkout,resumeWorkout,skipRest,
  unlockAudio,render,hardReset,copyBackup,downloadBackup,restoreBackup,logBodyweight,
  edOpenDay,edBack,edMove,edDelete,edStartEdit,edStartAdd,edPickLibrary,
  edDraftSet,edSaveDraft,edAddSub,edRemoveSub,edResetProgram
});
// Exposed for debugging from the Safari console if anything ever misbehaves
window.__dev={calcProg,getTarget,getLastPerf,mergeHistory,backupString,view,normalizeSession,getSetTargets,buildSets,estimateWeight,workingOnly,setCountFor,repsForSet,
  sessionPRs,activeIdFor,allTimeBest,getProgram,lookupName,lookupMuscle,DEFAULT_PROGRAM,FORM,LIBRARY};

/* ══════════════════════════════════════════════════════════════
   17. BOOT
   ══════════════════════════════════════════════════════════════ */
(async function boot(){
  render(); // loading state

  // Ask iOS to treat our data as durable rather than disposable cache
  try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch{}

  // Read BOTH stores and merge
  const [ih,ib,ip,isess] = await Promise.all([
    idbGet(K.hist), idbGet(K.bw), idbGet(K.prog), idbGet(K.sess)
  ]);
  const lh=lsGet(K.hist), lb=lsGet(K.bw), lp=lsGet(K.prog), lsess=lsGet(K.sess);

  S.history = mergeHistory(ih,lh);
  S.bwLog   = (Array.isArray(ib)&&ib.length>=((lb||[]).length))?ib:(Array.isArray(lb)?lb:[]);
  S.program = (Array.isArray(ip)&&ip.length)?ip:((Array.isArray(lp)&&lp.length)?lp:null);
  S.session = isess||lsess||null;

  // Write the merged result straight back so both stores are in sync
  if(S.history.length) await saveHistory(S.history);

  const sc=lsGet(K.screen);
  S.screen = (sc&&['home','stats','history','program'].includes(sc))?sc:'home';

  if(S.session){
    if(!normalizeSession()){ S.session=null; await saveSession(null); }
    if(S.session){
      S.elapsed=Math.floor((Date.now()-S.session.startTime)/1000);
      S.screen='workout';
      startElapsed();
      // A clock left running: pick it back up if it's still inside its
      // window, otherwise log what elapsed and retire it cleanly.
      if(S.session.clock){
        const i=clockInfo();
        if(!i || i.finished){
          if(i){ const R=clockRounds(i.b); for(let r=0;r<R;r++) logRound(i.b,r); }
          S.session.clock=null; await saveSession(S.session);
        }else{
          S.screen='clock'; runClock();
        }
      }
    }
  }

  S.ready=true;
  render();

  // Re-sync the mirror whenever the app comes back to the foreground
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState!=='visible') return;
    unlockAudio();
    if(S.session&&S.session.clock&&!S.session.clock.pausedAt){ runClock(); clockTick(); }
    idbGet(K.hist).then(h=>{
      const merged=mergeHistory(S.history,h);
      if(merged.length!==S.history.length){ S.history=merged; saveHistory(merged); render(); }
    }).catch(()=>{});
  });
})();
</script>
