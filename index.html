<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recomp">
<meta name="theme-color" content="#1a1a18">
<title>Recomp Workout</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#fff;color:#1a1a18;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:60px}
input,textarea,select{outline:none;-webkit-appearance:none;appearance:none;font-family:inherit}
button{outline:none;cursor:pointer;font-family:inherit}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* HEADER */
.header{background:#fff;border-bottom:1.5px solid #e0ddd8;padding:16px 20px 12px;position:sticky;top:0;z-index:100}
.header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.logo{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888880}
.day-label{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.badge{font-family:ui-monospace,monospace;font-size:11px;background:#1a1a18;color:#fff;padding:4px 10px;border-radius:20px;letter-spacing:.05em;white-space:nowrap}
.timer-txt{font-family:ui-monospace,monospace;font-size:12px;color:#888880;margin-top:4px;text-align:right}
.prog-bar-wrap{margin-top:12px;height:3px;background:#efefec;border-radius:2px;overflow:hidden}
.prog-bar-fill{height:100%;background:#1a1a18;border-radius:2px;transition:width .4s}
.prog-lbl{font-family:ui-monospace,monospace;font-size:10px;color:#b0ada6;letter-spacing:.05em}
.hdr-btn{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;border-radius:20px;padding:4px 11px;border:1px solid}
.hdr-btn.pause{color:#b86e00;background:#fff8ed;border-color:#f5d49a}
.hdr-btn.resume{color:#2d7a4f;background:#edf7f1;border-color:#b8ddc9}

.pad{padding:20px}
.nav-tabs{display:flex;gap:6px;margin-bottom:4px}
.nav-tab{flex:1;padding:10px 4px;background:#f7f7f5;border:1.5px solid #e0ddd8;border-radius:8px;font-size:12.5px;font-weight:500;color:#888880;text-align:center}
.nav-tab.active{background:#1a1a18;border-color:#1a1a18;color:#fff}
.sec-label{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#888880;margin:24px 0 12px}

/* DAY CARDS */
.day-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.day-card{background:#f7f7f5;border:1.5px solid #e0ddd8;border-radius:12px;padding:16px 14px;position:relative;overflow:hidden}
.day-card.has-history{background:#edf7f1;border-color:#b8ddc9}
.day-card.is-active{background:#1a1a18;border-color:#1a1a18}
.day-card.is-hiit{background:#fdf2f1;border-color:#f5c6c2}
.day-card-type{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#888880;margin-bottom:4px}
.day-card-name{font-size:17px;font-weight:700}
.day-card-sub{font-size:11.5px;color:#888880;margin-top:3px;line-height:1.35}
.day-card-last{font-size:11px;color:#2d7a4f;margin-top:6px}
.day-card.is-active .day-card-type,.day-card.is-active .day-card-sub,.day-card.is-active .day-card-last{color:rgba(255,255,255,.7)}
.day-card.is-active .day-card-name{color:#fff}
.day-card.is-hiit .day-card-type,.day-card.is-hiit .day-card-sub{color:#c0392b}
.day-card.is-hiit .day-card-name{color:#c0392b}
.green-dot{position:absolute;top:11px;right:11px;width:8px;height:8px;border-radius:50%;background:#2d7a4f}

/* SESSION BANNER */
.session-banner{margin:16px 0 0;padding:12px 16px;background:#1a1a18;border-radius:12px;display:flex;align-items:center;gap:12px}
.session-banner-title{font-size:13px;font-weight:700;color:#fff}
.session-banner-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:1px}
.session-banner-arrow{font-size:20px;color:#fff;flex-shrink:0}

/* EXERCISE CARD */
.ex-card{background:#f7f7f5;border:1.5px solid #e0ddd8;border-radius:12px;margin-bottom:14px;overflow:hidden}
.ex-card.any-done{border-color:#1a1a18}
.ex-card.all-done{background:#edf7f1;border-color:#b8ddc9;opacity:.8}
.ex-header{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-name{font-size:16px;font-weight:700;flex:1;line-height:1.3}
.ex-header-right{display:flex;gap:6px;align-items:center;flex-shrink:0}
.ex-badge{font-family:ui-monospace,monospace;font-size:11px;background:#efefec;padding:3px 8px;border-radius:20px;color:#888880;white-space:nowrap}
.pill-btn{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#888880;background:#efefec;border:1px solid #e0ddd8;border-radius:20px;padding:3px 9px}
.ex-note{font-size:12px;color:#888880;padding:0 16px 10px;line-height:1.45}
.sub-row{padding:0 16px 12px;display:flex;gap:6px;flex-wrap:wrap}
.sub-btn{font-size:11.5px;font-weight:500;color:#1d5fa8;background:#eef4fc;border:1.5px solid #b8d0f0;border-radius:20px;padding:5px 12px}
.sub-btn.active{background:#1d5fa8;color:#fff;border-color:#1d5fa8}

.target-box{margin:0 16px 12px;padding:10px 14px;background:#f3eefa;border:1.5px solid #c9aff0;border-radius:8px}
.target-label{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6b3fa0;margin-bottom:4px;font-weight:600}
.target-text{font-size:14px;font-weight:600;color:#6b3fa0}
.last-box{margin:0 16px 12px;padding:10px 14px;background:#fff8ed;border:1.5px solid #f5d49a;border-radius:8px}
.last-label{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#b86e00;margin-bottom:6px;font-weight:600}
.last-chips{display:flex;flex-wrap:wrap;gap:6px}
.last-chip{font-family:ui-monospace,monospace;font-size:13px;font-weight:600;color:#b86e00;background:#fff;border:1px solid #f5d49a;padding:4px 10px;border-radius:20px}
.last-chip.drop{color:#c0392b;border-color:#f5c6c2}
.last-rm{font-size:11px;color:#b86e00;font-family:ui-monospace,monospace;margin-top:6px}
.last-hint{font-size:12px;color:#b86e00;margin-top:4px;font-style:italic}

.sets-area{padding:0 16px 14px}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr 38px;gap:8px;align-items:center;margin-bottom:4px}
.set-num{font-family:ui-monospace,monospace;font-size:12px;color:#888880;text-align:center}
.set-input{background:#fff;border:1.5px solid #e0ddd8;border-radius:8px;padding:11px 8px;font-family:ui-monospace,monospace;font-size:16px;font-weight:600;color:#1a1a18;width:100%;text-align:center}
.set-input.done{background:#edf7f1;border-color:#b8ddc9}
.set-input.drop-inp{background:#fdf2f1;border-color:#f5c6c2}
.set-input.drop-inp.done{background:#edf7f1;border-color:#b8ddc9}
.check-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid #e0ddd8;background:#fff;color:#888880;font-size:17px;display:flex;align-items:center;justify-content:center}
.check-btn.done{background:#2d7a4f;border-color:#2d7a4f;color:#fff}
.check-btn.drop-btn{border-color:#f5c6c2;color:#c0392b}
.check-btn.drop-btn.done{background:#2d7a4f;border-color:#2d7a4f;color:#fff}
.rpe-row{display:flex;align-items:center;gap:5px;margin:2px 0 10px;padding-left:34px;flex-wrap:wrap}
.rpe-label{font-family:ui-monospace,monospace;font-size:10px;color:#888880;letter-spacing:.05em}
.rpe-hint{font-size:11px;color:#888880;font-style:italic}
.rpe-btn{width:30px;height:27px;border-radius:6px;border:1.5px solid #e0ddd8;background:#fff;color:#888880;font-family:ui-monospace,monospace;font-size:12px;font-weight:700}
.rpe-btn.sel{background:#1a1a18;border-color:#1a1a18;color:#fff}
.warm-label{font-family:ui-monospace,monospace;font-size:9.5px;color:#b0ada6;text-align:center;letter-spacing:.03em}
.set-input.warm-inp{background:#faf9f7;border-color:#ececea;color:#999;font-size:14px}
.set-input.warm-inp.done{background:#f0f6f2;border-color:#cfe6da;color:#7aa791}
.check-btn.warm-btn{border-color:#ececea;color:#c0bdb8;width:34px;height:34px;font-size:14px}
.check-btn.warm-btn.done{background:#a8cbb8;border-color:#a8cbb8;color:#fff}
.warm-head{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#b0ada6;margin:2px 0 6px}
.work-head{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#888880;margin:12px 0 6px;padding-top:10px;border-top:1px dashed #e8e5e0}
.scheme-tag{display:inline-block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;padding:3px 9px;border-radius:20px;margin:0 16px 10px}
.scheme-tag.pyr{background:#f3eefa;color:#6b3fa0;border:1px solid #c9aff0}
.scheme-tag.tmp{background:#eef4fc;color:#1d5fa8;border:1px solid #b8d0f0}
.day-card.is-pyr{background:#f3eefa;border-color:#c9aff0}
.day-card.is-pyr .day-card-type,.day-card.is-pyr .day-card-sub{color:#6b3fa0}
.day-card.is-pyr .day-card-name{color:#6b3fa0}
.day-card.is-tmp{background:#eef4fc;border-color:#b8d0f0}
.day-card.is-tmp .day-card-type,.day-card.is-tmp .day-card-sub{color:#1d5fa8}
.day-card.is-tmp .day-card-name{color:#1d5fa8}
.drop-area{padding:10px 16px 14px;border-top:1px dashed #e0ddd8}
.drop-area.faded{opacity:.45}
.drop-label{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#c0392b;margin-bottom:8px}

.rest-banner{margin:8px 0 4px;padding:10px 14px;background:#eef4fc;border:1.5px solid #b8d0f0;border-radius:8px;display:flex;align-items:center;gap:10px}
.rest-banner.done-rest{background:#edf7f1;border-color:#b8ddc9}
.rest-banner.counting{background:#fff8ed;border-color:#f5d49a}
.rest-time{font-family:ui-monospace,monospace;font-size:20px;font-weight:600;color:#1d5fa8;min-width:46px}
.rest-banner.done-rest .rest-time{color:#2d7a4f}
.rest-banner.counting .rest-time{color:#b86e00;font-size:26px}
.rest-lbl{font-size:13px;color:#1d5fa8;flex:1}
.rest-banner.done-rest .rest-lbl{color:#2d7a4f}
.rest-banner.counting .rest-lbl{color:#b86e00;font-weight:600}
.rest-skip{font-size:12px;font-weight:500;color:#1d5fa8;background:none;border:1px solid #b8d0f0;border-radius:20px;padding:4px 10px}

.pr-banner{background:#fffbeb;border-bottom:1px solid #f5d87a;padding:7px 16px;display:flex;align-items:center;gap:8px}
.pr-banner-text{font-size:13px;font-weight:600;color:#b8860b}

.btn-primary{width:100%;padding:17px;background:#1a1a18;color:#fff;font-size:16px;font-weight:700;border:none;border-radius:12px}
.btn-secondary{width:100%;padding:14px;background:#f7f7f5;border:1.5px solid #e0ddd8;border-radius:12px;font-size:15px;font-weight:600;color:#1a1a18}
.btn-ghost{width:100%;padding:12px;background:none;border:1.5px solid #e0ddd8;border-radius:12px;font-size:14px;color:#888880}
.btn-green{width:100%;padding:15px;background:#2d7a4f;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700}
.btn-amber{width:100%;padding:16px;background:#b86e00;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700}
.hint-txt{font-size:12px;color:#b0ada6;text-align:center;margin-top:8px}

.summary-card{background:#edf7f1;border:1.5px solid #b8ddc9;border-radius:12px;padding:24px 20px;text-align:center;margin-bottom:16px}
.pr-callout{background:#fffbeb;border:1.5px solid #f5d87a;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
.stat-box{background:#f7f7f5;border:1.5px solid #e0ddd8;border-radius:8px;padding:14px 8px;text-align:center}
.stat-val{font-family:ui-monospace,monospace;font-size:21px;font-weight:600}
.stat-lbl{font-size:11px;color:#888880;margin-top:2px}

.vol-bar-wrap{margin-bottom:14px}
.vol-bar-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.vol-bar-name{font-size:14px;font-weight:600}
.vol-bar-status{font-size:12px;font-family:ui-monospace,monospace}
.vol-bar-bg{height:8px;background:#efefec;border-radius:4px;overflow:hidden}
.vol-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.vol-bar-minmax{display:flex;justify-content:space-between;margin-top:3px}
.vol-bar-minmax span{font-size:10px;color:#b0ada6;font-family:ui-monospace,monospace}
.pr-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:#f7f7f5;border:1.5px solid #e0ddd8;border-radius:10px;margin-bottom:8px}
.pr-row-val{font-family:ui-monospace,monospace;font-size:18px;font-weight:700;color:#b8860b;text-align:right}

.hist-entry{background:#f7f7f5;border:1.5px solid #e0ddd8;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.hist-date{font-family:ui-monospace,monospace;font-size:11px;color:#888880;margin-bottom:4px}
.hist-day{font-size:16px;font-weight:700;margin-bottom:8px}
.hist-exs{font-size:13px;color:#666;line-height:1.7}
.empty{text-align:center;padding:40px 20px;color:#888880;font-size:14px}
.empty-icon{font-size:36px;margin-bottom:10px}

.card{background:#f7f7f5;border:1.5px solid #e0ddd8;border-radius:12px;padding:16px;margin-bottom:14px}
.card.warn{background:#fff8ed;border-color:#f5d49a}
.card.good{background:#edf7f1;border-color:#b8ddc9}
.card-title{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#888880;margin-bottom:10px}
.field-label{font-size:12px;font-weight:600;color:#666;margin:12px 0 5px}
.field{width:100%;padding:11px 12px;border:1.5px solid #e0ddd8;border-radius:8px;font-size:15px;background:#fff}
.field-row{display:flex;gap:8px}
.txt-area{width:100%;min-height:70px;padding:10px;border:1.5px solid #e0ddd8;border-radius:8px;font-family:ui-monospace,monospace;font-size:12px;resize:vertical;background:#fff}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end}
.modal-sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:20px 20px 44px;-webkit-overflow-scrolling:touch}
.modal-handle{width:36px;height:4px;background:#e0ddd8;border-radius:2px;margin:0 auto 18px}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.modal-title-label{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#888880;margin-bottom:4px}
.modal-title{font-size:19px;font-weight:700;line-height:1.25}
.modal-close{background:#efefec;border:none;border-radius:50%;width:32px;height:32px;font-size:16px;color:#888880;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cue-row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.cue-num{font-family:ui-monospace,monospace;font-size:12px;font-weight:700;color:#1a1a18;min-width:20px;margin-top:2px}
.cue-text{font-size:14px;line-height:1.5}
.info-box{padding:12px 14px;border-radius:8px;margin-top:12px}
.info-box.blue{background:#eef4fc;border:1.5px solid #b8d0f0}
.info-box.amber{background:#fff8ed;border:1.5px solid #f5d49a}
.info-label{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;font-weight:600}

/* PROGRAM EDITOR */
.ed-day{background:#f7f7f5;border:1.5px solid #e0ddd8;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.ed-day-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ed-day-name{font-size:16px;font-weight:700}
.ed-day-meta{font-size:11.5px;color:#888880;margin-top:2px}
.ed-ex{background:#fff;border:1.5px solid #e0ddd8;border-radius:10px;padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.ed-ex-info{flex:1;min-width:0}
.ed-ex-name{font-size:14px;font-weight:600;line-height:1.3}
.ed-ex-meta{font-family:ui-monospace,monospace;font-size:11px;color:#888880;margin-top:2px}
.ed-icon-btn{width:32px;height:32px;border-radius:8px;border:1.5px solid #e0ddd8;background:#f7f7f5;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#666}
.ed-icon-btn.danger{color:#c0392b;border-color:#f5c6c2;background:#fdf2f1}
.lib-item{padding:11px 13px;background:#fff;border:1.5px solid #e0ddd8;border-radius:10px;margin-bottom:7px}
.lib-name{font-size:14px;font-weight:600}
.lib-meta{font-size:11.5px;color:#888880;margin-top:2px}
.err-card{background:#fdf2f1;border:1.5px solid #f5c6c2;border-radius:12px;padding:18px}

/* ── kettlebell days + interval clock ─────────────────────────── */
.day-card.is-kb{background:#fff6ec;border-color:#f3d2a8}
.day-card.is-kb .day-card-type,.day-card.is-kb .day-card-sub{color:#a85f0a}
.day-card.is-kb .day-card-name{color:#a85f0a}
.blk{margin:0 0 22px;border:1.5px solid #e6e3dc;border-radius:14px;background:#fbfaf8;overflow:hidden}
.blk-clock{border-color:#f3d2a8;background:#fffdfa}
.blk-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.blk-title{font-size:16px;font-weight:700;color:#1a1a18;letter-spacing:-.01em}
.blk-meta{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.07em;color:#a09c93;margin-top:3px;text-transform:uppercase}
.blk-clock .blk-meta{color:#c07f28}
.blk-num{flex:none;width:24px;height:24px;border-radius:50%;background:#eae7e0;color:#8a867d;font-family:ui-monospace,monospace;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.blk-clock .blk-num{background:#f7e3c6;color:#a85f0a}
.blk-note{font-size:13px;line-height:1.5;color:#6e6a62;padding:0 16px 12px}
.blk-order{margin:0 16px 12px;border:1px solid #f0e4d2;border-radius:9px;overflow:hidden;background:#fff}
.blk-ord-row{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid #f6efe4;font-size:13px}
.blk-ord-row:last-child{border-bottom:none}
.blk-ord-min{flex:none;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.05em;color:#c07f28;background:#fdf3e4;padding:3px 6px;border-radius:4px;min-width:46px;text-align:center;text-transform:uppercase}
.blk-ord-nm{flex:1;font-weight:600;color:#2a2a26}
.blk-ord-rp{flex:none;font-family:ui-monospace,monospace;font-size:11px;color:#8a867d}
.btn-clock{display:block;width:calc(100% - 32px);margin:0 16px 8px;padding:15px;border:none;border-radius:11px;background:#a85f0a;color:#fff;font-size:15px;font-weight:700;letter-spacing:-.01em;cursor:pointer}
.btn-clock:active{background:#8d4e06}
.btn-clock.running{background:#2d7a4f}
.blk-done-lbl{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;color:#2d7a4f;text-align:center;padding:0 16px 12px;text-transform:uppercase}
.blk-body{padding:4px 0 2px}
.blk-body .ex-card{margin:0 12px 12px;border-radius:11px}

.clk{min-height:100vh;display:flex;flex-direction:column;background:#12120f;color:#fff;padding:18px 20px 26px}
.clk-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clk-blk{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;color:#f0b463;text-transform:uppercase}
.clk-elapsed{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.06em;color:#6d6a62}
.clk-dial{position:relative;margin:10px auto 0;width:min(78vw,300px);aspect-ratio:1}
.clk-svg{width:100%;height:100%;transform:rotate(-90deg)}
.clk-trk{fill:none;stroke:#26251f;stroke-width:9}
.clk-arc{fill:none;stroke:#f0b463;stroke-width:9;stroke-linecap:round;stroke-dasharray:552.92;transition:stroke-dashoffset .2s linear}
.clk-ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.clk-time{font-family:ui-monospace,monospace;font-size:clamp(46px,15vw,66px);font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.clk-time.hot{color:#ffb84d}
.clk-round{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.14em;color:#8a867d;text-transform:uppercase}
.clk-now{margin-top:20px;text-align:center}
.clk-now-lbl{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.18em;color:#f0b463;margin-bottom:5px}
.clk-now-nm{font-size:clamp(24px,7vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.clk-now-rp{font-family:ui-monospace,monospace;font-size:15px;color:#c9c5bb;margin-top:7px;letter-spacing:.02em}
.clk-cue{font-size:13px;line-height:1.5;color:#8f8b82;margin:14px 4px 0;text-align:center}
.clk-next{margin-top:auto;padding:13px 15px;background:#1c1b17;border:1px solid #2c2b24;border-radius:11px;display:flex;align-items:center;gap:11px}
.clk-next-lbl{flex:none;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;color:#6d6a62}
.clk-next-nm{flex:1;font-size:14px;font-weight:600;color:#d6d2c8}
.clk-next-rp{flex:none;font-family:ui-monospace,monospace;font-size:11px;color:#8a867d}
.clk-btns{display:flex;gap:10px;margin-top:12px}
.clk-btn{flex:1;padding:15px;border-radius:11px;border:1.5px solid #34332b;background:#1c1b17;color:#d6d2c8;font-size:14px;font-weight:600;cursor:pointer}
.clk-btn:active{background:#26251f}
.clk-btn.go{background:#f0b463;border-color:#f0b463;color:#12120f}
.clk-btn.end{border-color:#4a2420;color:#e08a7f}
.clk-paused{text-align:center;padding:14px;margin-top:14px;background:#221f18;border:1px solid #3d3527;border-radius:11px}
.clk-paused-t{font-size:17px;font-weight:700;color:#f0b463}
.clk-paused-s{font-size:12.5px;color:#8a867d;margin-top:3px}
.clk-run-banner{margin:0 16px 12px;padding:12px 14px;background:#edf7f1;border:1.5px solid #b8ddc9;border-radius:9px;display:flex;align-items:center;gap:10px;cursor:pointer}
.clk-run-t{flex:1;font-size:13.5px;font-weight:700;color:#2d7a4f}
.clk-run-a{font-size:16px;color:#2d7a4f}

.pausebars{display:inline-flex;gap:3px;vertical-align:-1px;margin-right:7px}
.pausebars i{display:block;width:3.5px;height:13px;border-radius:1.5px;background:currentColor}
.pausebars.big i{width:8px;height:30px;border-radius:3px}

.day-card.is-arm{background:#eef6f4;border-color:#b3d9d0}
.day-card.is-arm .day-card-type,.day-card.is-arm .day-card-sub{color:#1d6b5c}
.day-card.is-arm .day-card-name{color:#1d6b5c}

.day-card.is-str{background:#f1f0f7;border-color:#c5c1dd}
.day-card.is-str .day-card-type,.day-card.is-str .day-card-sub{color:#4a4379}
.day-card.is-str .day-card-name{color:#4a4379}

.amr-rounds{margin-top:18px;text-align:center}
.amr-lbl{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.18em;color:#f0b463;margin-bottom:2px}
.amr-n{font-family:ui-monospace,monospace;font-size:clamp(52px,17vw,76px);font-weight:700;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.amr-target{font-family:ui-monospace,monospace;font-size:12px;color:#8a867d;margin-top:4px;letter-spacing:.04em}
.amr-target.beat{color:#7fd1a4}
.amr-tap{display:block;width:100%;margin-top:16px;padding:22px;border:none;border-radius:14px;background:#f0b463;color:#12120f;font-size:19px;font-weight:700;letter-spacing:-.01em;cursor:pointer}
.amr-tap:active{background:#d99c48}
.amr-list{margin-top:14px;border:1px solid #2c2b24;border-radius:11px;overflow:hidden;background:#1a1915}
.amr-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #26251f;font-size:13.5px}
.amr-row:last-child{border-bottom:none}
.amr-row-nm{flex:1;color:#d6d2c8;font-weight:600}
.amr-row-rp{flex:none;font-family:ui-monospace,monospace;font-size:11.5px;color:#8a867d}
.amr-undo{background:none;border:none;color:#6d6a62;font-size:12px;text-decoration:underline;cursor:pointer;margin-top:10px;padding:6px}
.day-card.is-amr{background:#fdf6ee;border-color:#eccfa6}
.day-card.is-amr .day-card-type,.day-card.is-amr .day-card-sub{color:#9a6212}
.day-card.is-amr .day-card-name{color:#9a6212}
.grp-head{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:#a09c93;text-transform:uppercase;margin:22px 0 9px;padding-top:4px;border-top:1px solid #eceae4}
.grp-head:first-of-type{margin-top:4px;border-top:none;padding-top:0}
.grp-head .grp-sub{color:#c4c0b7;letter-spacing:.06em;text-transform:none}

.day-card.is-flow{background:#f0f4ef;border-color:#c3d6c0}
.day-card.is-flow .day-card-type,.day-card.is-flow .day-card-sub{color:#4a6b47}
.day-card.is-flow .day-card-name{color:#4a6b47}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ══════════════════════════════════════════════════════════════
   1. DEFAULT PROGRAM
   Every exercise has: id, name, sets, reps, note, rest (seconds),
   dropSet, muscle, subs[{id,name,note}]
   Subs have their OWN ids so their history is tracked separately.
   ══════════════════════════════════════════════════════════════ */

const FACE_PULL_SUBS = [
  {id:'band_pull_apart', name:'Band Pull-Aparts', note:'Band at shoulder width, pull apart to full extension. Same rear delt and cuff work — do these anywhere.'},
  {id:'db_rear_delt_fly', name:'DB Rear Delt Fly', note:'Hinge forward 45°, raise light DBs out to the sides. Very light weight, focus on the squeeze.'}
];
const ROW_SUBS = [
  {id:'single_arm_db_row', name:'Single Arm DB Row', note:'One hand on bench, row DB to hip. Full stretch at bottom, squeeze at top. Easiest to feel one side at a time.'},
  {id:'straight_arm_pulldown', name:'Straight Arm Pulldown', note:'Arms stay straight, pull bar to hips using only the lats. Zero bicep involvement.'},
  {id:'chest_sup_y_raise', name:'Chest Supported Y-Raise', note:'Face down on incline bench, arms form a Y. Raise and out. Excellent upper back + shoulder health.'}
];
const FLY_SUBS = [
  {id:'db_fly_flat', name:'DB Flyes (flat bench)', note:'Slight fixed elbow bend, feel the stretch, squeeze at top. Go lighter than cable.'},
  {id:'pushup_wide', name:'Wide Push-Up', note:'Hands wider than shoulders. Bodyweight chest work when nothing is free.'}
];
const INCLINE_SUBS = [
  {id:'feet_elev_pushup', name:'Feet-Elevated Push-Up', note:'Feet on bench, hands on floor. Replicates the incline angle. Pause 1s at the bottom.'},
  {id:'cable_chest_press', name:'Cable Chest Press', note:'Cables at chest height, press forward and slightly in. Constant tension.'}
];
const CURL_SUBS = [
  {id:'seated_preacher_curl', name:'Seated Preacher Curl', note:'Sit on bench, elbows braced on inner thighs. Swing is physically impossible. Go lighter than usual.'},
  {id:'concentration_curl', name:'Concentration Curl', note:'Elbow braced on inner knee, one arm at a time. Maximum isolation, very slow.'},
  {id:'hammer_curl_sub', name:'Hammer Curl', note:'Neutral grip throughout. Hits brachialis — different recruitment to a standard curl.'}
];
const TRICEP_SUBS = [
  {id:'lying_db_tricep', name:'Lying DB Extension', note:'Flat bench, lower DBs toward forehead, elbows stay fixed. Go lighter than cable.'},
  {id:'single_db_overhead', name:'Single DB Overhead Ext', note:'Both hands on one DB overhead, lower behind head. Best long-head stretch.'},
  {id:'bench_dip_sub', name:'Bench Dip', note:'Hands on bench behind you. Lower until upper arms are parallel to the floor. Bodyweight option.'}
];
const CORE_SUBS = [
  {id:'ab_wheel_rollout', name:'Ab Wheel Rollout', note:'Kneel, roll out to full extension, pull back with the abs only. Start with a short range.'},
  {id:'hanging_knee_raise_sub', name:'Hanging Knee Raise', note:'Hang from a bar, curl the pelvis and raise knees to chest. Control the lower, no swinging.'},
  {id:'dead_bug_sub', name:'Dead Bug', note:'On your back, arms up. Lower opposite arm and leg slowly, lower back stays flat. Harder than it looks.'},
  {id:'lying_leg_raise_sub', name:'Lying Leg Raise', note:'Flat, legs straight, raise to 90° and lower slowly without touching the floor.'}
];
const LATERAL_SUBS = [
  {id:'seated_db_lateral', name:'Seated DB Lateral Raise', note:'Seated kills all leg drive. Lighter weight, strict. Thumb up, shoulder height only.'},
  {id:'bent_over_db_lateral', name:'Bent-Over DB Lateral', note:'Hinge 45°, raise out to the sides. Hits rear and side delt together. Light.'}
];
const PRESS_SUBS = [
  {id:'arnold_press', name:'Single Arm DB Arnold Press', note:'Palm faces you, rotate to palm-forward as you press. Closest match to the landmine arc. Start 20lbs.'},
  {id:'db_shoulder_press_strict', name:'DB Shoulder Press (strict)', note:'Elbows FORWARD not flared, stop at ear height. Strict only.'},
  {id:'cable_chest_press_sub', name:'Cable Press (chest height)', note:'Press forward not overhead. Zero shoulder risk when the shoulder feels off.'}
];

/* ── Kettlebell substitution banks ───────────────────────────────
   Bells owned: 25lb, 35lb, 50lb. Every KB movement has a lighter
   option, a no-skill option and a bodyweight option so a missing
   bell or an off day never cancels the session. Each sub is its own
   tracked exercise with its own history. */
const KB_SWING_SUBS = [
  {id:'kb_1arm_swing_s', name:'Single-Arm Swing', note:'Same hinge, one hand. Free arm mirrors the movement. Go one bell lighter — 35lb. Grip and anti-rotation both get harder.'},
  {id:'kb_dead_swing', name:'Dead-Stop Swing', note:'Bell returns to the floor between every rep. Removes the rebound so each rep is a fresh hinge. Best when your form is drifting.'},
  {id:'kb_deadlift_s', name:'KB Deadlift', note:'No ballistic at all. Bell between the feet, hinge and stand. Use this if the back or shoulder is talking — same pattern, zero impact.'},
  {id:'kb_rdl_s', name:'KB Romanian Deadlift', note:'Two hands, knees soft and fixed, push hips back until you feel the hamstrings, stand tall. Slow and controlled.'},
  {id:'db_swing_s', name:'DB Swing', note:'Hold one dumbbell vertically by the head. Identical hinge if no bell is free.'},
  {id:'kb_good_morning_s', name:'Racked Good Morning', note:'Bell in the rack, hinge to horizontal, stand. Loads the hinge with no speed at all.'}
];
const KB_SQUAT_SUBS = [
  {id:'kb_front_squat_s', name:'Front Rack Squat', note:'Bell in the rack position at the shoulder, one side at a time. Harder on the core than a goblet — the load is off-centre.'},
  {id:'kb_sumo_squat_s', name:'KB Sumo Squat', note:'Wide stance, bell hanging between the legs, sit straight down. Easier on the knees, more adductor.'},
  {id:'kb_tempo_bw_squat_s', bw:true, name:'Tempo Bodyweight Squat', note:'3s down, 1s pause at the bottom, stand. No bell needed. Hands out front for balance.'},
  {id:'kb_rev_lunge_s', name:'Goblet Reverse Lunge', note:'Step BACK not forward — much kinder on the knee. Bell at the chest. Alternate legs. Low impact, no jumping.'},
  {id:'kb_split_squat_s', name:'Goblet Split Squat', note:'Feet planted in a lunge stance, drop straight down. All the work, none of the stepping. Do all reps one side then swap.'}
];
const KB_HALO_SUBS = [
  {id:'kb_atw_s', name:'Around-the-World', note:'Bell circles the waist, hand to hand. Same warming effect lower down, no overhead position at all.'},
  {id:'kb_arm_bar_s', name:'KB Arm Bar', note:'On your side, bell locked out, roll onto the stomach. Superb thoracic and shoulder opener. 25lb, 30s a side, move slowly.'},
  {id:'kb_pass_s', bw:true, name:'Band Pass-Through', note:'Band or towel overhead and behind, wide grip. Pure mobility, no load.'},
  {id:'kb_prone_ty_s', bw:true, name:'Prone T-Y Raise', note:'Face down on the floor, thumbs up, lift arms into a T then a Y. Light or no weight. Wakes up the lower traps.'}
];
const KB_CHOP_SUBS = [
  {id:'kb_russian_twist_s', name:'Russian Twist', note:'Seated, heels light, bell travels hip to hip. Rotate from the ribs not the arms.'},
  {id:'kb_hp_plank_s', name:'High Plank Pull-Through', note:'Plank position, reach under and drag the bell across. Anti-rotation under fatigue.'},
  {id:'kb_suitcase_s', name:'Suitcase Carry', note:'One bell, one hand, walk tall. Fighting the sideways lean is the exercise. 50lb, 40s a side.'},
  {id:'kb_dead_bug_s', bw:true, name:'Dead Bug', note:'On your back, arms up. Lower opposite arm and leg, lower back stays flat. No bell needed.'},
  {id:'kb_pallof_s', bw:true, name:'Band Pallof Press', note:'Sideways to a band, press out, hold 2s. Resist the rotation. Direct hockey carry-over.'}
];
const KB_CARRY_SUBS = [
  {id:'kb_racked_carry_s', name:'Racked Carry', note:'Bell in the rack at the shoulder. Ribs down, breathe shallow. Brutal on the core, easy on the shoulder.'},
  {id:'kb_oh_carry_s', name:'Overhead Carry', note:'Locked out overhead, bicep by the ear. Best shoulder stability drill you own. Start 25lb.'},
  {id:'kb_farmer_carry_s', name:'Farmer Carry', note:'Two bells, one each side. Balanced load, pure grip and trap work. Go heaviest here.'},
  {id:'kb_waiter_carry_s', name:'Waiter Carry', note:'Bell bottoms-up overhead. Hardest version. 25lb only, and it is still hard.'},
  {id:'kb_plank_hold_s', bw:true, name:'Plank Hold', note:'No walking, no bell. Squeeze glutes and quads, straight line heels to head.'}
];
const KB_BURPEE_SUBS = [
  {id:'kb_squat_thrust_s', bw:true, name:'Step-Back Squat Thrust', note:'Step back to the plank instead of jumping, no push-up, stand up instead of jumping. Same breathing, zero impact on the shins.'},
  {id:'kb_inchworm_s', bw:true, name:'Inchworm Walkout', note:'Hinge, walk the hands out to a plank, walk back, stand. Low impact, opens the hamstrings.'},
  {id:'kb_mtn_climber_s', bw:true, name:'Mountain Climbers', note:'Plank, drive knees to chest alternately. Fast but the feet stay low — no jumping.'},
  {id:'kb_bear_crawl_s', bw:true, name:'Bear Crawl', note:'Knees an inch off the floor, opposite hand and foot, crawl forward and back. Deceptively savage.'},
  {id:'kb_extra_swing_s', name:'Extra Swings', note:'If the shins are sore, swap the burpee out entirely and swing instead. Keeps the heart rate up with no ground contact.'}
];
const KB_PUSHUP_SUBS = [
  {id:'kb_incline_pu_s', name:'Hands-on-Bells Push-Up', note:'Hands on the handles of two bells. The deeper range plus the wobble makes it harder than it looks — and the neutral wrist is kinder.'},
  {id:'kb_elev_pu_s', name:'Elevated Push-Up', note:'Hands on a bench or step. Easier. Use it to keep the reps clean rather than grinding half-reps on the floor.'},
  {id:'kb_floor_press_pu_s', name:'KB Floor Press', note:'Loaded pressing with no shoulder end range at all. Straight swap if the wrists or shoulder complain.'},
  {id:'kb_tempo_pu_s', name:'Tempo Push-Up', note:'3s down, 1s on the chest, drive up. Cut the reps in half. Far more stimulus per rep.'},
  {id:'kb_knee_pu_s', name:'Knee Push-Up', note:'Knees down, everything else identical. Chest still touches. Better than a sloppy full push-up.'}
];
const KB_GETUP_SUBS = [
  {id:'kb_half_getup_s', name:'Half Get-Up', note:'Go as far as sitting tall on the hand, then reverse. Gets 80% of the shoulder benefit with none of the hard part.'},
  {id:'kb_getup_elbow_s', name:'Get-Up to Elbow', note:'Punch the bell up, roll to the elbow, come back down. The entry only. Where everyone should start.'},
  {id:'kb_naked_getup_s', bw:true, name:'Bodyweight Get-Up', note:'Same sequence, fist up instead of a bell. Learn the pattern with nothing to drop.'},
  {id:'kb_side_plank_s', bw:true, name:'Side Plank', note:'If the floor work is not happening today. 30s a side, hips stacked and lifted.'}
];
const KB_COMPLEX_SUBS = [
  {id:'kb_abc_noclean_s', name:'Swing + Squat Complex', note:'NO CLEAN. 5 two-hand swings, then 5 goblet squats, then rest. Same lungs, none of the wrist-banging. Use this until the clean feels automatic.'},
  {id:'kb_abc_nopress_s', name:'Clean + Front Squat', note:'Drop the press. 2 cleans, 3 front squats each side. Keeps the rack work, removes all overhead load.'},
  {id:'kb_abc_dead_s', name:'Dead-Clean + Press', note:'Bell starts on the floor every single rep. Slower and more honest — no momentum to hide behind, easier to learn.'},
  {id:'kb_abc_swingpress_s', name:'Swing + Push Press', note:'10 swings then 5 push press each side. No rack position needed at all.'},
  {id:'kb_abc_light_s', name:'Light ABC (25lb)', note:'Same complex, smallest bell. Do this for the first two or three sessions while the sequence becomes automatic.'}
];

/* ── Arms & Delts banks ──────────────────────────────────────────
   Home-first (bells and a band), with the gym option listed too, so
   the same day works in either place. With a 25lb smallest bell some
   movements simply cannot be done with a bell — laterals and rear
   delts are band or light-dumbbell by design, not by omission. */
const ADS_PRESS_SUBS = [
  {id:'ads_bu_press', name:'Bottoms-Up Press', note:'Bell upside down, handle squeezed hard. Forces the cuff to switch on. 25lb and it will feel heavy.'},
  {id:'ads_db_press', name:'DB Shoulder Press', note:'Seated or standing, elbows FORWARD not flared, stop at ear height. The gym default.'},
  {id:'ads_landmine', name:'Landmine Press', note:'Half-kneeling, the arc keeps the shoulder in the safest plane. Your most shoulder-friendly press.'},
  {id:'ads_push_press', name:'Push Press', note:'Small dip of the knees to drive it past the hard part. Use it to keep volume when strict reps are failing.'},
  {id:'ads_arnold_ad', name:'DB Arnold Press', note:'Palm faces you, rotate to palm-forward as you press. More front delt through a longer range.'},
  {id:'ads_floor_press_ad', name:'KB Floor Press', note:'On your back, the floor stops you short of the risky range. Zero overhead load when the shoulder is off.'}
];
const ADS_LATERAL_SUBS = [
  {id:'ads_cable_lat', name:'Cable Lateral Raise', bw:true, note:'Constant tension top to bottom. The best version if you are at the gym. Light, slight forward lean, thumb up.'},
  {id:'ads_seated_lat_ad', name:'Seated DB Lateral', bw:true, note:'Seated kills all leg drive and swing. Strict, shoulder height only, 10-15lb is plenty.'},
  {id:'ads_bent_lat_ad', name:'Bent-Over Lateral', bw:true, note:'Hinge 45° with a FLAT back, raise out to the sides. Rear and side delt together. Keep it light so the back stays out of it.'},
  {id:'ads_band_lat', name:'Band Lateral Raise', bw:true, note:'Stand on the band, raise to shoulder height. Tension builds exactly where the movement is hardest. Ideal at home.'},
  {id:'ads_partial_lat', name:'Lean-Away Lateral', bw:true, note:'Hold a post, lean away, raise the outside arm. The lean lengthens the side delt so even a light weight bites.'}
];
const ADS_REAR_SUBS = [
  {id:'ads_band_pullapart_s', name:'Band Pull-Apart', bw:true, note:'Arms straight, pull the band apart to the chest, squeeze the blades. Endless reps, zero joint cost.'},
  {id:'ads_rear_fly', name:'Bent-Over Rear Delt Fly', bw:true, note:'Chest on an incline bench if you have one, which takes the lower back out entirely. Light, thumbs down.'},
  {id:'ads_prone_y_ad', name:'Prone Y-Raise', bw:true, note:'Face down, thumbs up, lift into a Y. Lower traps and rear delts. Little or no weight.'},
  {id:'ads_cable_face', name:'Cable Face Pull', bw:true, note:'High anchor, rope, pull to the forehead and externally rotate at the end. The gym version.'}
];
const ADS_CURL_SUBS = [
  {id:'ads_db_curl_ad', name:'DB Curl', note:'Elbows pinned to the ribs, supinate hard at the top. The straightforward version.'},
  {id:'ads_preacher_ad', name:'Seated Preacher Curl', note:'Elbows braced on the inner thighs. Swinging is physically impossible, so the bicep does all of it.'},
  {id:'ads_conc_curl_ad', name:'Concentration Curl', note:'Elbow on the inner knee, one arm at a time, squeeze 2s at the top. Maximum isolation.'},
  {id:'ads_band_curl', name:'Band Curl', bw:true, note:'Hardest at the top where the bicep is strongest. Great for high-rep burnout sets at home.'},
  {id:'ads_chin_up', name:'Chin-Up', bw:true, note:'Underhand, chin over the bar. The single best bicep builder there is if you have a bar. Assisted or negatives count.'}
];
const ADS_TRI_SUBS = [
  {id:'ads_pushdown_ad', name:'Tricep Pushdown', bw:true, note:'Elbows glued to the sides, only the forearm moves. Squeeze hard at full extension.'},
  {id:'ads_lying_ext_ad', name:'Lying DB Extension', note:'Flat on a bench or the floor, lower toward the forehead, elbows fixed. Classic mass builder.'},
  {id:'ads_bench_dip_ad', name:'Bench Dip', bw:true, note:'Hands on a bench behind you, lower to upper arms parallel. Elbows track BACK, not out.'},
  {id:'ads_diamond_pu', name:'Diamond Push-Up', bw:true, note:'Hands together under the chest. Brutal on the triceps, no equipment at all.'},
  {id:'ads_kick_back', name:'DB Kickback', note:'Hinge with a flat back, upper arm locked parallel to the floor, extend. Light, squeeze, slow.'}
];
const ADS_CORE_SUBS = [
  {id:'ads_pallof_ad', name:'Pallof Press', bw:true, note:'Sideways to a band, press out, hold 2s. Anti-rotation. No spinal flexion at all, so the lower back stays happy.'},
  {id:'ads_side_plank_ad', name:'Side Plank', bw:true, note:'Hips stacked and lifted, squeeze the bottom glute. Builds the lateral trunk without loading the spine.'},
  {id:'ads_hollow', name:'Hollow Hold', bw:true, note:'Lower back PRESSED into the floor, shoulders and legs just off it. If the back arches, bend the knees.'},
  {id:'ads_bird_dog', name:'Bird Dog', bw:true, note:'Opposite arm and leg out, hips level, hold 2s. Low-load and genuinely good for a sore lower back.'},
  {id:'ads_suitcase_ad', name:'Suitcase Carry', note:'One bell, one hand, stand dead vertical and walk. Anti-lean, no bending of the spine.'}
];

/* ── Home Strength ladders ───────────────────────────────────────
   Bodyweight only progresses if the movement gets HARDER. Adding
   reps forever stops working once you can do twenty. These two lists
   are ordered easy to hard on purpose: when you hit the top of the
   rep range on every set, move one step down the list and start the
   rep range again. That is your progressive overload. */

  /* ── KETTLEBELL DAYS ───────────────────────────────────────────

  { id:'kb_swing', name:'KB Swing', type:'Kettlebell', focus:'Ballistic · 25 min', kb:true,

      {id:'kbs_pry', name:'Prying Goblet Squat', sets:2, reps:'5', rest:30, dropSet:false, muscle:'Legs', defaultWeight:35, bell:true, block:0,

        note:'50lb. HINGE, not a squat. Hips snap, the bell floats up on its own. At the top stand TALL and squeeze the glutes — do not lean back. Leaning back at the top is the number one cause of a sore lower back from swings.', subs:KB_SWING_SUBS},
      {id:'kbs_goblet', name:'Goblet Squat', sets:4, reps:'10', rest:0, noRest:true, dropSet:false, muscle:'Legs', defaultWeight:35, bell:true, block:1,
        note:'35lb. Bell at the chest, elbows inside the knees. Push the knees OUT over the toes on the way down — this one is corrective for you.', subs:KB_SQUAT_SUBS},

      {id:'kbs_plank', name:'Plank Hold', sets:2, reps:'45s', rest:30, dropSet:false, muscle:'Core', block:2,

  { id:'amrap_arms', name:'Arms AMRAP', type:'20 min', focus:'Biceps · Triceps · low sweat', tint:'amr', group:'short',

  { id:'amrap_core', name:'Core AMRAP', type:'20 min', focus:'Abs · Trunk · low sweat', tint:'amr', group:'short',

  /* ── THE 10-MINUTE FLOW ────────────────────────────────────────
     One minute per movement, ten movements, no equipment. A quiet clock:
     one soft chime on the turn, no 3-2-1. This is the rest-day session
     and the between-meetings reset. Nothing here counts toward your
     training volume, which is the point of it. */
  { id:'flow_10', name:'Flow', type:'10 min', focus:'Mobility · Circulation · no kit', tint:'flow', group:'short',
    blocks:[{kind:'clock', label:'Flow', minutes:10, interval:60, rounds:10, quiet:true,
      ids:['fl_bounce','fl_armswing','fl_trunk','fl_shoulder','fl_neck','fl_hips','fl_spine','fl_legswing','fl_calf','fl_breath'],
      note:'One minute each, ten movements, one soft chime when it turns over. No counting, no reps, no score. Move slowly and keep breathing. If a minute feels long, you are doing it right.'}],
    exercises:[
      {id:'fl_bounce', name:'Gentle Bounce', sets:1, reps:'60s', rest:0, noRest:true, dropSet:false, muscle:'Cardio', block:0,
        note:'Soft knees, bounce on the spot with the heels barely leaving the floor, or not leaving at all. Let the arms hang and jiggle. This is the classic one for a reason: the calf and foot muscles squeezing rhythmically is what moves fluid back up your legs.', subs:FLOW_BOUNCE_SUBS},
      {id:'fl_armswing', name:'Dead Arm Swings', sets:1, reps:'60s', rest:0, noRest:true, dropSet:false, muscle:'Cardio', block:0,
        note:'Feet planted, arms completely LIMP. Rotate the torso side to side and let the arms whip around and slap your back and belly. The arms do nothing, the trunk does everything. Straight out of qigong and it feels superb after a day at a desk.', subs:FLOW_ROTATE_SUBS},
      {id:'fl_trunk', name:'Trunk Rotations', sets:1, reps:'60s', rest:0, noRest:true, dropSet:false, muscle:'Cardio', block:0,
        note:'Hands on hips or crossed on the chest, feet planted. Rotate slowly and deliberately from the RIBS, not the lower back. Go a little further each rep. Pair it with the breath: exhale as you turn.', subs:FLOW_ROTATE_SUBS},
      {id:'fl_shoulder', name:'Shoulder Rolls & Arm Circles', sets:1, reps:'60s', rest:0, noRest:true, dropSet:false, muscle:'Cardio', block:0,
        note:'Big slow shoulder rolls back for 20 seconds, then forward. Then arm circles, small to large. Your shoulder has been the fragile joint, and this is free maintenance for it.', subs:FLOW_SHOULDER_SUBS},
      {id:'fl_neck', name:'Neck & Jaw Release', sets:1, reps:'60s', rest:0, noRest:true, dropSet:false, muscle:'Cardio', block:0,
        note:'Ear toward shoulder, hold and breathe, both sides. Then slow HALF circles through the front only, never roll the head backwards. Finish by unclenching the jaw. There is a dense cluster of lymph nodes in the neck and this is where desk tension collects.', subs:FLOW_SHOULDER_SUBS},
      {id:'fl_hips', name:'Hip Circles', sets:1, reps:'60s', rest:0, noRest:true, dropSet:false, muscle:'Cardio', block:0,
        note:'Hands on hips, feet shoulder width, draw big slow circles with the pelvis. Thirty seconds each direction. Tai chi pace, no rushing. Then a few slow figure-eights if you want.', subs:FLOW_LOWER_SUBS},
      {id:'fl_spine', name:'Cat-Cow / Spinal Wave', sets:1, reps:'60s', rest:0, noRest:true, dropSet:false, muscle:'Cardio', block:0,
        note:'On all fours. Inhale and drop the belly, lift the chest and tailbone. Exhale and round the whole spine, chin to chest. Move one vertebra at a time rather than hinging in the middle. This is the single best thing for a lower back that sits all day.', subs:FLOW_SPINE_SUBS},
      {id:'fl_legswing', name:'Leg Swings', sets:1, reps:'60s', rest:0, noRest:true, dropSet:false, muscle:'Cardio', block:0,
        note:'Hold a wall. Swing one leg front to back, loose and relaxed, 20 seconds. Then side to side across the body. Swap legs. Hips and hamstrings without stretching anything cold.', subs:FLOW_LOWER_SUBS},
      {id:'fl_calf', name:'Calf Pumps & Ankle Circles', sets:1, reps:'60s', rest:0, noRest:true, dropSet:false, muscle:'Cardio', block:0,
        note:'Slow calf raises, full range, right up onto the toes and right back down. Then ankle circles each way. Your calves are called the second heart for a reason, and this one is directly useful for the shin splints.', subs:FLOW_LOWER_SUBS},
      {id:'fl_breath', name:'Diaphragmatic Breathing', sets:1, reps:'60s', rest:0, noRest:true, dropSet:false, muscle:'Cardio', block:0,
        note:'Lie down or sit tall, one hand on the chest and one on the belly. Breathe so only the BELLY hand moves. In through the nose for 4, out through the mouth for 6. Of everything in this ten minutes, this is the one with the most behind it: the diaphragm moving is what pumps the main lymphatic duct in your chest.', subs:FLOW_BREATH_SUBS},
    ]},
];

  {id:'lib_inverted_row', name:'Inverted Row', sets:3, reps:'12-20', rest:90, muscle:'Back', note:'Bar at hip height, body rigid, chest to bar. More horizontal = harder.'},
  {id:'lib_kb_swing', name:'KB Two-Hand Swing', sets:4, reps:'15', rest:60, muscle:'Cardio', note:'Hinge, do not squat. Hips snap, the bell floats. Glutes and abs lock at the top. 50lb.'},
  {id:'lib_kb_1arm_swing', name:'KB Single-Arm Swing', sets:4, reps:'16', rest:60, muscle:'Cardio', note:'8 a side. Shoulder stays packed, body stays square. One bell lighter than two-hand. 35lb.'},
  {id:'lib_kb_goblet', name:'Goblet Squat', sets:3, reps:'10-12', rest:75, muscle:'Legs', note:'Bell at the chest, knees track OUT over the toes. Corrective for inward knee collapse. 35lb.'},
  {id:'lib_kb_front_squat', name:'KB Front Rack Squat', sets:3, reps:'8-10', rest:90, muscle:'Legs', note:'Bell racked at one shoulder. Off-centre load, so the core works hard to stay square.'},
  {id:'lib_kb_halo', name:'KB Halo', sets:2, reps:'5', rest:30, muscle:'Cardio', note:'Bell by the horns, circle the head close and slow. Ribs down. Best shoulder warm-up there is. 25lb.'},
  {id:'lib_kb_getup', name:'Turkish Get-Up', sets:2, reps:'2', rest:60, muscle:'Shoulders', note:'Eyes on the bell the whole way. Skill practice — 25lb, one rep a side, perfect. Best exercise for an unstable shoulder.'},
  {id:'lib_kb_hk_press', name:'KB Half-Kneeling Press', sets:3, reps:'6-8', rest:90, muscle:'Shoulders', note:'One knee down. No leg drive, no back arch possible. The strictest and safest overhead press.'},
  {id:'lib_kb_bu_press', name:'KB Bottoms-Up Press', sets:3, reps:'5-6', rest:90, muscle:'Shoulders', note:'Bell upside down, squeeze the handle. Rehab-grade rotator cuff work. 25lb will feel heavy.'},
  {id:'lib_kb_chop', name:'KB Wood Chop', sets:3, reps:'20', rest:45, muscle:'Core', note:'10 a side, hip to opposite shoulder. Rotate from the ribs. Closest thing to a hockey shot. 25lb.'},

  {id:'lib_kb_abc', name:'Armor Building Complex', sets:10, reps:'1', rest:60, muscle:'Cardio', note:'One bell. 2 cleans, 1 press, 3 front squats — each side. Best bang-for-buck KB session there is. 35lb.'},

/* ══════════════════════════════════════════════════════════════
   3. FORM CUES — keyed by exercise id (mains AND subs)
   ══════════════════════════════════════════════════════════════ */
const FORM = {
  /* ── the 10-minute Flow ─────────────────────────────────────── */
  fl_bounce:{c:["Stand tall, knees soft and unlocked","Bounce gently on the spot","Heels barely leave the floor, or do not leave at all","Let the arms hang completely loose and jiggle","Relax the jaw and shoulders","Keep it going the whole minute"],b:"Easy nose breathing, do not hold your breath",s:"Low impact by design. Your heels staying down is what keeps this off your shins. The calf and foot muscles squeezing rhythmically is the mechanism that pushes fluid back up the legs, since there is no pump down there doing it for you."},
  fl_armswing:{c:["Feet planted shoulder width, knees soft","Arms completely LIMP, like rope","Rotate the torso side to side","Let the arms whip around and slap the back and belly","The arms do nothing, the trunk does everything","Build up speed slowly, then settle into a rhythm"],b:"Natural breathing, let it find its own rhythm",s:"Straight out of qigong, where it is one of the oldest drills there is. The point is the total relaxation of the arms. If you are actively swinging them, you are doing it wrong. Feels superb after a day at a desk."},
  fl_trunk:{c:["Feet planted, hands on hips or crossed on the chest","Rotate SLOWLY from the ribs, not the lower back","Hips stay facing forward as much as you can","Go a little further each rep","Pause at the end of each turn and breathe"],b:"Exhale as you rotate, inhale back to centre",s:"Rotating from the ribs rather than the lower back is the whole technique. Your thoracic spine is built to rotate and your lumbar spine mostly is not, and desk work stiffens the first one."},
  fl_shoulder:{c:["Big slow shoulder rolls BACKWARD for 20 seconds","Then forward for 20","Then arm circles, starting small and growing","Finish with a few big backward circles","Keep the ribs down throughout"],b:"Steady easy breathing",s:"Free maintenance for the joint that has given you the most trouble. Costs nothing, takes a minute, and it is the sort of thing people only start doing after an injury rather than before."},
  fl_neck:{c:["Ear toward one shoulder, hold and breathe, then the other","Slow HALF circles through the FRONT only","Never roll the head backwards","Chin to chest, hold and breathe","Finish by letting the jaw hang slack"],b:"Slow nose breathing throughout",s:"Half circles through the front only. Rolling the head back compresses the joints at the top of the neck and it is a habit worth dropping. The jaw matters more than people think, it holds a lot of desk tension."},
  fl_hips:{c:["Hands on hips, feet shoulder width","Draw the biggest slow circle you can with the pelvis","30 seconds one way, 30 the other","Tai chi pace, no rushing","Keep the upper body quiet"],b:"Slow natural breathing",s:"Slow is the whole point. If you are whipping through these you have turned a mobility drill into a warm-up. Big, slow, deliberate circles."},
  fl_spine:{c:["On all fours, hands under shoulders, knees under hips","Inhale: drop the belly, lift the chest and the tailbone","Exhale: round the whole spine, chin to chest, push the floor away","Move one vertebra at a time","Do not just hinge in the middle"],b:"The breath drives it: inhale down, exhale round",s:"The single best thing you can do for a lower back that sits all day, and it pairs perfectly with the dead bug work you are already doing. Segment by segment, not one big bend in the middle."},
  fl_legswing:{c:["Hold a wall or a doorframe for balance","Swing one leg front to back, completely loose","20 seconds, then side to side across the body","Swap legs","Let momentum do it, do not force the range"],b:"Easy breathing",s:"Dynamic rather than held, which is what you want before or after training rather than cold static stretching. Loose and relaxed, never forced."},
  fl_calf:{c:["Slow calf raises, full range","All the way up onto the toes, all the way back down","Pause at the top for a second","Then slow ankle circles, both directions","Barefoot if you can"],b:"Exhale as you rise",s:"Your calves get called the second heart because the muscle pump there is a major driver of return circulation from the legs. Directly useful for the shin splints too: strong, mobile calves and ankles are most of that problem."},
  fl_breath:{c:["Lie on your back, or sit tall","One hand on the chest, one on the belly","Breathe so only the BELLY hand moves","In through the nose for 4","Out through the mouth for 6","Keep the shoulders still and relaxed"],b:"4 in through the nose, 6 out through the mouth",s:"Of everything in this ten minutes, this is the one with the most actual physiology behind it. The diaphragm moving up and down is what pumps the thoracic duct, which is the main lymphatic vessel in your chest. The longer exhale also pulls you into a parasympathetic state, which is why you feel calmer after a minute of it."},

  /* ── Flow substitutions ─────────────────────────────────────── */
  fl_heel_drop:{c:["Rise onto the toes","Drop the heels down","Feet never leave the floor","Steady rhythm"],b:"Easy breathing",s:"Zero impact, same calf pump. The version for sore shins."},
  fl_march:{c:["March on the spot, knees up","Arms swinging naturally","Steady rhythm for the minute"],b:"Easy breathing",s:"Gentler than bouncing, easier on the shins, still gets things moving."},
  fl_shake:{c:["Shake out the hands and arms","Then the legs, one at a time","Then everything at once","Keep it going the whole minute"],b:"Loose, uncontrolled breathing is fine",s:"Looks ridiculous and feels great. Genuinely used in dance and martial arts warm-ups to drop tension fast."},
  fl_seated_bounce:{c:["Sitting down, feet flat","Pump the heels up and down fast","Keep it going"],b:"Normal breathing",s:"The one you can do at a desk mid-call without anyone noticing."},
  fl_seated_twist:{c:["Sit tall, hands crossed on the chest","Rotate side to side from the ribs","Slow and controlled"],b:"Exhale as you turn",s:"Same rotation, no standing required."},
  fl_standing_chop:{c:["Same path as a loaded wood chop, no bell","Hip to opposite shoulder","Pivot the back foot","Smooth and continuous"],b:"Exhale on the way up",s:"Grooves the pattern you use loaded, with nothing in your hands."},
  fl_open_book:{c:["On your side, knees bent up at 90°","Arms stretched out in front, palms together","Sweep the top arm open across the body","Follow the hand with your eyes","Let the chest rotate toward the ceiling"],b:"Exhale as the arm opens",s:"The best thoracic rotation drill there is. Keep the knees down and stacked, that is what forces the rotation into the upper back."},
  fl_wall_slide:{c:["Back to the wall, arms up in a goalpost","Slide the arms up and down","Keep the wrists, elbows and lower back in contact","Only go as far as contact holds"],b:"Exhale as the arms go up",s:"Brilliant for posture and shoulder mechanics, and it shows you immediately how restricted you are."},
  fl_pass_through:{c:["Towel or band in both hands, wide grip","Arms straight, lift overhead and behind","Only as far as the elbows stay locked","Return on the same path","Narrow the grip as it gets easier"],b:"Exhale as the arms go back",s:"Pure shoulder mobility, no load. Widen the grip if it is tight."},
  fl_doorway:{c:["Forearm flat on the doorframe, elbow at shoulder height","Step gently through the doorway","Feel the stretch across the chest, not in the shoulder joint","Hold and breathe, then the other side"],b:"Slow deep breaths in the stretch",s:"Opens the chest that pressing and desk work both tighten. Gentle: if you feel it in the front of the shoulder joint rather than across the chest, back off."},
  fl_standing_roll:{c:["Stand tall, chin to chest","Roll down one vertebra at a time","Hang loose at the bottom, knees soft","Roll back up the same way, head last"],b:"Exhale rolling down, inhale coming up",s:"Decompresses the spine and teaches segmental control. Slow is the point."},
  fl_childs:{c:["Sit back on the heels, knees wide","Walk the hands forward and rest the forehead down","Then walk the hands over to one side, then the other","Breathe into the back of the ribs"],b:"Slow deep breathing into the back",s:"Opens the lats and the lower back. The side-to-side walk is where most of the value is."},
  fl_thread:{c:["On all fours","Thread one arm underneath the other","Let the shoulder and side of the head rest down","Hold and breathe, then swap"],b:"Slow breathing in the position",s:"Thoracic rotation with the floor doing the work for you."},
  fl_hip_cars:{c:["Hold something for balance","Lift one knee up","Draw the biggest slow circle you can with it","Both directions, then swap legs"],b:"Steady breathing",s:"Takes the hip through its full range under control. Slow and big beats fast and small."},
  fl_90_90:{c:["Seated, both knees bent at 90°, one in front one to the side","Rotate both knees over to the other side","Keep the chest tall","Slow and controlled"],b:"Exhale as you switch sides",s:"Superb for hip rotation, which is what sitting all day takes away first."},
  fl_couch:{c:["Back foot up on the sofa or a chair, shin vertical","Front foot planted","Square the hips and SQUEEZE the back glute","Stay tall, do not arch the lower back","30 seconds each side"],b:"Slow deep breathing, do not hold your breath",s:"Hip flexors, which shorten from sitting and then pull on your lower back. Squeezing the glute is what makes it work. Back off if the knee complains."},
  fl_calf_wall:{c:["Hands on the wall, one leg back","Back leg straight, heel pressed DOWN","Lean in until you feel the calf","Then bend the back knee slightly for the lower calf","30 seconds each"],b:"Slow breathing in the stretch",s:"Directly relevant to the shin splints. Tight calves are a big part of that problem, and the bent-knee version gets the soleus which the straight-leg one misses."},
  fl_box_breath:{c:["In through the nose for 4","Hold for 4","Out through the mouth for 4","Hold empty for 4","Repeat for the minute"],b:"4 in, 4 hold, 4 out, 4 hold",s:"Settles the nervous system quickly. Used by people who need to be calm under pressure, which is most of the appeal."},
  fl_legs_wall:{c:["Lie on your back with your bottom near a wall","Legs straight up, resting against it","Arms out to the sides, palms up","Breathe slowly and stay there"],b:"Slow deep belly breathing",s:"Gravity does the draining. The easiest possible version of this whole session and genuinely restorative after a hard day."},
  fl_physio_sigh:{c:["Two inhales through the nose, the second one short and sharp on top of the first","One long slow exhale through the mouth","Repeat for the minute"],b:"Double inhale through the nose, long exhale out the mouth",s:"The double inhale reinflates collapsed air sacs and the long exhale drops your heart rate. The fastest deliberate way to calm down that has actually been studied."},

  /* ── bell-first replacements ────────────────────────────────── */
  ad_bandpull:{c:["25lb. Bell in one hand, standing tall","Pass it around the waist, hand to hand behind your back","Keep it close to the body and keep it moving","Stay upright, do not sway with it","Change direction halfway"],b:"Breathe normally throughout",s:"Warms the shoulders, the grip and the trunk with the bell in your hands instead of a band. Nothing goes overhead, so it is safe on any day the shoulder feels off."},
  ad_lateral:{c:["35lb. Set up exactly like a swing: feet shoulder width, bell a foot in front","Hinge, hike, and let the hips drive the bell up","Stop it at CHEST height with the elbow leading high and wide","The arm only steers, the hips do the lifting","Guide it back down into the next hinge","8 a side, switch at the top"],b:"Sharp exhale at the top of every rep",s:"This is the bell's answer to a lateral raise. The side and rear delt have to decelerate the bell at the top, which loads them hard, and because the hips are driving it your heart rate goes somewhere a band raise never takes it. Never yank with the shoulder: if your arm is lifting rather than steering, go lighter."},
  ad_rear:{c:["25lb. High plank with one hand gripping the bell","Feet WIDE, this is what stops you twisting","Row the bell to the hip, elbow back not out","Hips stay DEAD level throughout","Set it down, then the other side"],b:"Exhale on each row, never hold your breath",s:"Rear delts, lats and anti-rotation core in one movement. The plank you hold between reps is what keeps the heart rate up, which is the whole reason it replaced a face pull here. Go lighter than you think, the stability is the hard part."},
  hs_fly:{c:["25lb. Grip the HORNS, bell upside down at the chest","Crush the horns together as hard as you physically can","Press the bell away from the chest, still crushing","Return to the chest without relaxing the squeeze","Never stop squeezing mid-set"],b:"Exhale as you press away",s:"The tension is the squeeze, not the weight. Your chest works to drive the hands together while your arms press the bell out, which is why 25lb is plenty. This is the single best answer to a light bell for chest work."},
  hp_fly:{c:["25lb. Crush the horns together, bell upside down at the chest","Press it away from the chest, squeezing throughout","Slow back to the chest, still crushing","Keep the elbows in, shoulders down"],b:"Exhale as you press away",s:"Dips and push-ups load the lockout. This loads the squeeze. Two different jobs and you want both, which is why it sits here rather than a band fly."},
  hp_lateral:{c:["25lb, bell UPSIDE DOWN, handle squeezed as hard as you can","Wrist dead straight, forearm vertical","Press slowly, speed will dump it","Everything from your hand to your shoulder is fighting to balance it","Lower just as slowly","6-8 a side"],b:"Exhale on the press, brace hard",s:"Rehab-grade rotator cuff work disguised as a press, and it still builds delts. 25lb will feel absurdly heavy and that is correct. If the bell tips, the set is over, that is your form cue built in."},
  hpl_pull:{c:["25lb. On your back, knees bent, feet flat","Bell over the chest in both hands, elbows soft and FIXED","Lower it behind your head slowly","RIBS DOWN, lower back stays on the floor","Stop where your SHOULDERS stop, not where the floor is","Pull back over the chest with the lats"],b:"Inhale as it goes back, exhale on the pull",s:"Reaches the lats through a range no row gets to. Stop where your shoulders stop: chasing the floor is how a good lat exercise becomes a shoulder problem. Light and slow, this is not a strength movement."},
  hpl_rear:{c:["35lb. Set up like a swing","Hips drive the bell up, elbow leads high and wide","Stop it at chest height","Arm steers, hips lift","8 a side"],b:"Sharp exhale at the top",s:"Rear delts, traps and hips together. It also keeps your heart rate up through what would otherwise be a quiet accessory slot at the end of a long session."},
  au_bandrow:{c:["50lb. Wide stance, bell between the feet","Hinge with a FLAT back, chest proud","Brace your free hand on the opposite knee or the floor","Row the bell to the hip, elbow back not out","Alternate sides, keeping the torso still"],b:"Exhale on each row",s:"Bracing the free hand lets you row heavier than single-arm, so this is your heaviest pulling movement. Holding the hinge between reps is what keeps the heart rate up. If your back rounds at any point, the set is over."},
  au_pulldown:{c:["35lb. High plank gripping the bell, feet WIDE","Row the bell to the hip, elbow back","Hips stay DEAD level, no rotation at all","Set it down under control","8 a side"],b:"Exhale on each row, breathe between",s:"Holding a plank between every single rep is what turns a row into conditioning. Widen your feet if the hips twist. Lighter than you think."},

  /* ── 20-minute AMRAP menu ───────────────────────────────────── */
  aa_curl:{c:["25lb. Bell by the handle, elbows pinned to the ribs","Curl it clean to the chest, no swing","From the chest, circle it around your head","Close to the skull, ribs down, no lower-back arch","Back to the chest, then lower under control"],b:"Exhale on the curl, breathe normally on the halo",s:"Two movements welded into one rep. The curl does the biceps, the halo keeps the shoulder moving through range. Do not let the halo become a swing, that is the whole skill of it."},
  aa_horncurl:{c:["Grip the HORNS of the bell, not the handle","Squeeze them together as hard as you can","Keep squeezing for the entire set","Elbows pinned, curl without them drifting forward","Slow lower, full extension at the bottom"],b:"Exhale on the way up",s:"The crush grip is the clever part. Squeezing hard recruits far more of the arm than the load alone would, which is how a 25lb bell still gives you something to work against. Grip tension is half this exercise."},
  aa_tri:{c:["Both hands cupped under one bell, pressed overhead","Elbows point UP and stay beside your ears","Lower behind the head until you feel the stretch","Drive up without letting the elbows flare","Keep the ribs down throughout"],b:"Inhale down, exhale on the extension",s:"The long head of the tricep is most of your arm's size and only loads properly overhead. Flaring elbows means too heavy."},
  aa_cgpush:{c:["Hands just inside shoulder width","Body one rigid line, glutes and abs squeezed","Elbows track BACK along the ribs, not out","Chest to the floor every rep","Knees down rather than half reps"],b:"Inhale down, exhale on the push",s:"Elbows back is what makes this triceps rather than chest, and it keeps the shoulder out of trouble."},
  aa_pullover:{c:["On your back, knees bent, feet flat","Bell held over the chest with both hands, elbows soft and fixed","Lower it back behind your head slowly","RIBS DOWN, do not let the lower back arch off the floor","Stop where your shoulders stop, not where the floor is","Pull it back over the chest with the lats"],b:"Inhale as it goes back, exhale on the pull",s:"Stop where your shoulders stop. Chasing the floor is how people turn a good lat exercise into a shoulder problem. Go light and slow, this is not a strength movement."},

  ap_hornlift:{c:["Grip the HORNS, bell upside down at the chest","Crush the horns together as hard as you possibly can","Press the bell away from your chest, still crushing","Return to the chest without relaxing the squeeze","Keep crushing for the entire set"],b:"Exhale as you press away",s:"The tension comes from the squeeze, not the weight. Your chest is working to press the hands together while your arms press the bell out. It is the single best answer to a light bell for chest work."},
  ap_liftoff:{c:["One hand on the bell handle, one flat on the floor","Push-up position, feet wide for stability","Lower under control, chest between the hands","At the top, LIFT the floor hand off the ground","Hips stay square, do not twist","5 reps, then swap hands"],b:"Inhale down, exhale on the push",s:"Lifting the floor hand forces one arm to hold your whole bodyweight for a moment. It is a genuine step toward a one-arm push-up, and the anti-rotation demand hits your core hard. Widen your feet if the hips twist."},
  ap_floor:{c:["On your back, knees bent, bell in one hand","Elbow at 45° from the body, NOT flared straight out","Lower until the triceps touch the floor","Pause, then press straight up","Wrist stacked over the elbow throughout"],b:"Inhale down, exhale on the press",s:"The floor stops you short of the end range where an unstable shoulder gets into trouble. All the pressing, none of the risk."},
  ap_halo:{c:["Bell by the horns, upside down, close to the chest","Circle it around the head as close as you can","Alternate direction every rep","Ribs stay DOWN, no lower-back arch","Everything below the neck stays still"],b:"Breathe normally throughout",s:"The breather movement in this block. Use it to get your breath back rather than rushing it."},
  ap_press:{c:["Bell racked at the shoulder, elbow tucked in","Ribs pulled DOWN, glutes tight","Press UP, not forward","Lock out with the bicep beside your ear","Lower under control back to the rack"],b:"Exhale on the press",s:"If your lower back arches to get the bell up, it is too heavy for this rep count today. Drop to the 25 or tap the push press sub rather than bending backwards around it."},

  au_row:{c:["Free hand braced flat on a chair or bench","Back flat and SUPPORTED, never holding a hinge unaided","Row the bell to the HIP, not the chest","Elbow back along the ribs, not flared out","Full stretch at the bottom, let the shoulder blade travel","Squeeze 1s at the top"],b:"Exhale on the pull",s:"To the hip, not the chest. Rowing high turns it into a rear delt exercise and takes the lats out of it."},
  au_bandrow:{c:["Sit tall, band looped round your feet","Handles in each hand, arms extended","Row to the belly, elbows back along the ribs","Squeeze the shoulder blades together 1s","Control the return to a full stretch"],b:"Exhale on the pull",s:"Zero spinal load, so it is always available. Step further into the band or shorten it to progress."},
  au_pullover:{c:["On your back, bell over the chest, elbows soft and fixed","Lower behind the head slowly","Ribs down, lower back stays on the floor","Stop where your shoulders stop","Pull back over with the lats"],b:"Inhale back, exhale on the pull",s:"Reaches the lats through a range no row gets to. Light and slow."},
  au_shrug:{c:["Bell held at one side, or two bells","Shrug straight UP toward the ears","No rolling the shoulders, ever","Pause at the top for a full second","Lower slowly, let the traps stretch"],b:"Exhale as you shrug up",s:"Rolling the shoulders does nothing useful and grinds the joint. Straight up, pause, straight down. Your 50lb bell is the right one here."},
  au_pulldown:{c:["Band anchored high, or over the top of a door","Kneel facing it, arms overhead","Pull to the collarbone, driving the ELBOWS down and back","Squeeze the lats 1s","Control the return to a full overhead stretch"],b:"Exhale on the pull",s:"The width builder, and zero load on your spine. Drive with the elbows, not the hands."},

  ac_situp:{c:["On your back, bell held at the chest, feet flat and DOWN","Sit all the way up in one motion","At the top, press the bell overhead","Lower the bell back to the chest","Lower yourself back down SLOWLY"],b:"Exhale as you sit up and press",s:"The way down is where the burn lives, so do not just drop back. If sit-ups bother your lower back at all, tap the hollow hold sub and you lose nothing."},
  ac_deadbug:{c:["On your back, arms straight up, knees at 90°","Press the lower back FLAT into the floor first","It stays flat for every single rep","Lower opposite arm and leg slowly","Stop the instant the back wants to arch"],b:"Exhale slowly as you extend",s:"Slow and small beats big and fast. The moment your back lifts off the floor the exercise has stopped working."},
  ac_drag:{c:["High plank, bell just outside one hand","Feet wide for stability","Reach under with the opposite hand and drag the bell across","HIPS STAY LEVEL, no rotation at all","Reset, then drag it back"],b:"Breathe steadily, never hold your breath",s:"Resisting the rotation is the entire exercise. If your hips swing as you reach, widen your feet or go lighter."},
  ac_carry:{c:["One bell, one hand, hanging at your side","Stand DEAD vertical, do not lean away from it","Shoulder packed down, no shrugging","Ribs down, abs braced, walk normally","30 seconds, swap hands, 30 more"],b:"Short shallow breaths, core stays braced",s:"The whole exercise is refusing to bend sideways. If you are leaning, it is too heavy or you have stopped bracing."},
  ac_hollow:{c:["On your back, lower back PRESSED into the floor","Shoulders and legs lifted just off the ground","The back never leaves the floor","Bend the knees to make it easier","Arms overhead to make it harder"],b:"Short controlled breaths, stay braced",s:"If the lower back arches off the floor, shorten the lever by bending the knees. Form is the entire exercise here."},

  ae_swing:{c:["Feet shoulder width, bell a foot in front","HIPS BACK, not down. A hinge, not a squat","Chest proud, back flat, eyes on the horizon","Hips snap forward hard, glutes and abs lock","The bell floats to chest height on its own","Stand TALL at the top, do not lean back"],b:"Sharp exhale at the top of every rep",s:"Leaning back at the top is the number one cause of a sore lower back from swings. Stand tall and squeeze the glutes instead. Your arms are rope, the hips do everything."},
  ae_highpull:{c:["Set up exactly like a swing","Hips start it, the bell comes up","Stop it at chest height with the ELBOW leading","The arm only finishes what the hips started","Guide it back down into the next hinge"],b:"Sharp exhale at the top",s:"Never yank with the shoulder. If your arm is doing the lifting rather than the steering, drop to a plain swing until the hinge is driving it."},
  ae_goblet:{c:["Bell at the chest by the horns, elbows tucked","Feet shoulder width or slightly wider","Sit straight DOWN, knees tracking out over the toes","Elbows inside the knees at the bottom, chest tall","Drive up through the whole foot"],b:"Inhale down, exhale on the drive up",s:"Knees out, not in. Holding the load in front automatically encourages that, which is why this one is corrective for you."},
  ae_pushup:{c:["Hands slightly wider than the shoulders","Body one rigid line, glutes and abs squeezed","Elbows 45° from the ribs, NOT flared","Chest to the floor every rep","Knees down rather than half reps as the rounds add up"],b:"Inhale down, exhale on the push",s:"By round four these get ugly. Drop to your knees and keep the reps clean rather than grinding half reps."},

  /* ── AMRAP substitutions ────────────────────────────────────── */
  sq_plate_press:{c:["Two hands crushing a plate, book or anything flat","Press it away from the chest","Keep crushing the whole set"],b:"Exhale as you press away",s:"Same crush-grip principle with no bell at all."},
  sq_band_fly_s:{c:["Band round the back, a handle in each hand","Arms slightly bent and FIXED","Hug together, squeeze 1s in the middle"],b:"Exhale as the hands meet",s:"Loads the stretched position that push-ups miss."},
  sq_cg_pushup_s:{c:["Hands just inside shoulder width","Elbows track back along the ribs","Chest to the floor"],b:"Inhale down, exhale up",s:"No equipment, straight chest and tricep work."},
  sq_floor_press_s:{c:["On your back, bell in one hand","Elbow 45°, triceps to the floor, press","Wrist stacked over the elbow"],b:"Inhale down, exhale on the press",s:"The floor caps the range, so the shoulder stays safe."},
  po_band_pullover:{c:["Band anchored high, arms straight","Pull down to the hips with the lats only","Elbows stay locked"],b:"Exhale on the pull",s:"Pure lat isolation with no elbow involvement."},
  po_band_pulldown:{c:["Kneel facing a high band","Pull to the collarbone, elbows down and back"],b:"Exhale on the pull",s:"The width builder, zero spinal load."},
  po_straight_arm:{c:["Arms locked straight throughout","Pull from overhead to the thighs","Only the shoulders move"],b:"Exhale on the pull",s:"The purest lat isolation there is."},
  po_dead_bug_s:{c:["Lower back flat into the floor","Lower opposite arm and leg slowly"],b:"Exhale as you extend",s:"Use it when the overhead position is not happening today."},
  lo_pushup_s:{c:["Hands slightly wider than shoulders","Elbows 45°, chest to the floor","Body one rigid line"],b:"Inhale down, exhale up",s:"The standard version. Still excellent."},
  lo_knee_s:{c:["Knees down, body straight from knees to head","Chest still touches the floor"],b:"Inhale down, exhale up",s:"Clean reps beat ugly ones every time."},
  lo_elev_s:{c:["Hands on a bench, step or couch","Body rigid, chest to the surface","Lower the surface over time to progress"],b:"Inhale down, exhale up",s:"Infinitely adjustable, which makes it a good long-term progression."},
  lo_floor_press_s:{c:["On your back, bell in one hand","Elbow 45°, triceps to the floor, press"],b:"Inhale down, exhale on the press",s:"Loaded alternative with no wrist strain."},
  sh_farmer_s:{c:["A bell in each hand, or one","Stand tall, shoulders packed down","Just hold and breathe"],b:"Short shallow breaths",s:"No movement at all, pure grip and trap endurance."},
  sh_band_shrug:{c:["Stand on the band, handles at your sides","Shrug straight up, pause","No rolling"],b:"Exhale as you shrug",s:"Constant tension, easy on the joints."},
  sh_high_pull_s:{c:["Hinge like a swing","Stop the bell at chest height, elbow leading"],b:"Sharp exhale at the top",s:"Traps plus hips. More conditioning cost than a shrug."},
  sh_suitcase_s:{c:["One bell at your side, stand dead vertical","Walk without leaning away from it"],b:"Short shallow breaths",s:"Traps and anti-lean core under time."},
  su_hollow_press:{c:["On your back, bell pressed straight overhead","Lower back PRESSED into the floor","Shoulders and legs just off the ground","Hold 30 seconds"],b:"Short controlled breaths",s:"The swap if sit-ups bother your back. Same burn, zero spinal flexion. Bend the knees if the back lifts."},
  su_dead_bug_s:{c:["Lower back flat and it stays flat","Lower opposite arm and leg slowly"],b:"Exhale as you extend",s:"Low load, genuinely good for a back that is still catching up."},
  su_crunch_s:{c:["Bell held on the chest","Crunch the ribs toward the hips","Shorter range than a sit-up"],b:"Exhale on the crunch",s:"Less hip flexor, less spinal flexion, still loaded."},
  su_vup_s:{c:["Legs and torso rise to meet","Bend the knees to scale it down"],b:"Exhale as you fold",s:"No bell needed. Scale with knee bend."},
  hpl_swing_s:{c:["Standard two-hand swing","Hinge, snap, float","Stand tall at the top"],b:"Sharp exhale at the top",s:"Drop the pull entirely when the shoulder has had enough."},
