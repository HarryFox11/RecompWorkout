  hpl_1arm_swing_s2:{c:["Same hinge, one hand","Free arm mirrors the working arm","Body stays square"],b:"Sharp exhale at the top",s:"Adds an anti-rotation demand. One bell lighter."},
  hpl_snatch_pull:{c:["Bell starts on the floor every rep","Hinge, hike, pull to chest height","Park it back down and reset"],b:"Exhale at the top",s:"No rebound, so every rep is a fresh honest hinge."},
  hpl_row_s2:{c:["Free hand braced on a chair","Row to the hip, elbow back"],b:"Exhale on the pull",s:"No ballistic at all. Use it when the back or shoulder wants a quieter day."},

  kbs_pushup:{c:["Hands slightly wider than the shoulders","Body one rigid line, glutes and abs squeezed","Elbows 45° from the ribs, NOT flared to 90°","Chest to the floor every rep","Drop to your knees rather than grinding half reps"],b:"Inhale down, exhale on the push",s:"This minute used to be a second set of swings. It is a push-up now so the session has one hinging station instead of two, which halves what your lower back absorbs. Same rule as always on elbows: 45°, never flared."},

  /* ── Home Push / Home Pull ──────────────────────────────────── */
  hp_dip_main:{c:["Band looped over the bars and under your knees to start","Grip the bars, arms locked, shoulders pulled DOWN away from your ears","Lower under control, slight forward lean for chest","STOP when your upper arms reach parallel to the floor","Drive up, do not slam the lockout","Thinner band as you get stronger, then no band"],b:"Inhale down, exhale on the push",s:"Your heaviest pressing movement, and the reason the tower is worth buying. One caution: the bottom of a dip puts the shoulder into deep extension, which is the position your shoulder likes least. Parallel and no further, keep the shoulders packed down, and if it ever feels loose or clicky down there, swap to close-grip push-ups that day. No ego on depth."},
  hp_push:{c:["Hardest variant you can do for 10 clean reps","Body one rigid line, glutes and abs squeezed","Elbows 45° from the ribs, NOT flared to 90°","Chest to the floor every rep","Stop 1-2 reps short, last set to failure"],b:"Inhale down, exhale on the push",s:"Hit 15 reps on all four sets and the movement has become too easy. Move one step up the ladder and start again at 10. That is your progression now that you cannot just grab a heavier dumbbell."},
  hp_press:{c:["One knee down, opposite knee up at 90°","Bell racked on the side of the down knee","Squeeze the down-side glute, ribs pulled DOWN","Press straight up, elbow driving under the bell","Lock out with the bicep beside your ear","Stop with 1 rep left, never grind"],b:"Exhale on the press, brace the trunk",s:"Your main overhead strength work. The half-kneeling stance makes it impossible to arch your lower back to heave the bell up, which is exactly what you want while the back is rebuilding. When 35lb for 8 gets easy, slow the lowering to 4 seconds before you think about a heavier bell."},
  hp_fly:{c:["Band around your back, a handle in each hand","Arms slightly bent and that bend never changes","Open out until you feel a real stretch across the chest","Hug back together, squeeze 1s in the middle","Light tension, high reps, perfect control"],b:"Exhale as the hands come together",s:"Dips and push-ups load the chest hardest near lockout and barely at all in the stretch. This covers the half they miss. Do not chase heavy bands."},
  hp_lateral:{c:["Stand on the middle of the band, handle in each hand","Slight forward lean from the hips","Thumb up, lead with the ELBOW","Raise to shoulder height only, never higher","3 second lower, resist the band pulling you down"],b:"Exhale as you raise",s:"Side delts are what give a physique width from the front, and they are the one muscle that genuinely prefers high reps and constant tension to heavy load. Bands are arguably better here than dumbbells."},
  hp_tri:{c:["Both hands cupped under one bell, pressed overhead","Elbows point UP and stay beside your ears","Lower behind the head until you feel the stretch","Drive up without letting the elbows flare","Last set to failure, then straight into close-grip push-ups"],b:"Inhale down, exhale on the extension",s:"The long head of the tricep is most of your arm's size and it only loads properly with the arm overhead. Flaring elbows means it is too heavy."},
  hp_core:{c:["Dead hang from the bar, shoulders packed down","Curl the PELVIS first, then raise the knees","Knees to chest, hold 1s","Lower slowly, no swinging or kipping","If you swing, you are using momentum, not abs"],b:"Exhale as the knees come up",s:"Curling the pelvis is the whole exercise. Just lifting the knees with a flat back is hip flexor work. The tower makes this available and it is one of the best ab movements there is."},
  hpl_chin_main:{c:["Band looped under your knees or one foot, THICKEST band first","Underhand grip, hands shoulder width","Start from a dead hang, arms straight","Pull until your chin clears the bar","Lower under control for 3 seconds","No kipping, no swinging"],b:"Exhale on the way up",s:"Not being able to do one yet is completely normal and the band is the right answer, not a compromise. The path is: thick band, thinner band, negatives, then your first unassisted rep. Each of those is a separate step in the ladder with its own history, so you will see the progress even when it feels slow."},
  hpl_row:{c:["Free hand braced flat on a chair, bench or your knee","Back flat and SUPPORTED, never holding a hinge unaided","Row the bell to the hip, elbow back not out","Full stretch at the bottom, let the shoulder blade travel","Hard squeeze for 1s at the top"],b:"Exhale on the pull",s:"Bracing the free hand is what keeps this off your lower back. 50lb is your heaviest bell, so this will eventually become the limiting movement. When it does, slow the lowering and add reps before you buy anything."},
  hpl_pull:{c:["Band anchored high, or thrown over the top of the tower","Kneel facing it, arms overhead, slight backward lean","Pull to the collarbone, driving the ELBOWS down and back","Squeeze the lats 1s","Control the return to a full stretch overhead"],b:"Exhale on the pull",s:"This is the width builder, and it loads the lats in a way rows cannot. Zero spinal load, so it is always available even on a bad back day."},
  hpl_rear:{c:["Band anchored at roughly forehead height","Pull toward your face, elbows high and wide","Rotate at the end so the hands finish behind your ears","Squeeze 1s, control the return","Light band, high reps, every session"],b:"Exhale on the pull",s:"Doubles as your shoulder health work. These are the muscles that hold the joint stable, and they are what make delts look three-dimensional from the side."},
  hpl_curl:{c:["25lb, one bell in both hands or one per side","Elbows pinned to the ribs and they stay there","Curl without the elbows drifting forward","Squeeze hard at the top for a full second","3 second lower, all the way to straight","Last set to failure, then drop to a band"],b:"Exhale on the way up",s:"Full extension at the bottom of every rep. Chin-ups already hit your biceps hard, so this is the finishing work rather than the main event."},
  hpl_hammer:{c:["Neutral grip, palms facing each other throughout","A bell per hand by the handle, or a band","Elbows pinned to the ribs","No wrist rotation at all","Squeeze at the top, 3 second lower"],b:"Exhale on the way up",s:"Hits the brachialis, which sits underneath the bicep and physically pushes it upward as it grows. Most people skip it and wonder why their arms stall."},
  hpl_core:{c:["On your back, arms up, knees up at 90°","Press the lower back FLAT into the floor first","It stays flat for every rep","Lower opposite arm and leg slowly","Stop the instant the back wants to arch"],b:"Exhale slowly as you extend",s:"The work that makes your back strong enough for everything else. Slow and small beats big and fast."},

  /* ── dip ladder ─────────────────────────────────────────────── */
  hp_floor_press:{c:["On your back, knees bent, bell in one hand at the chest","Press straight up, wrist stacked over the elbow","Lower until the upper arm touches the floor","Pause, then press again","Elbow at about 45° from the body"],b:"Inhale down, exhale on the press",s:"The floor physically stops you short of the range that bothers an unstable shoulder. Needs no tower at all."},
  hp_cg_pushup:{c:["Hands just inside shoulder width","Body one rigid line, glutes and abs squeezed","Elbows track BACK along the ribs, not out","Chest to the floor every rep","Knees down rather than half reps"],b:"Inhale down, exhale on the push",s:"The closest thing to a dip you can do with nothing but the floor. Elbows back is what makes it a tricep movement."},
  hp_chair_dip:{c:["Hands on a chair or bench behind you, fingers forward","Feet out in front, legs straight for harder","Lower until the upper arms are parallel","Elbows track BACK, never flare out","Push through the heels of the hands"],b:"Exhale on the push",s:"Honest warning: this version is harder on the shoulder than a proper parallel-bar dip, because your arms are behind your torso. Keep it shallow, and prefer the tower version once you have it."},
  hp_band_dip:{c:["Band looped over both bars, knees resting in it","Arms locked at the top, shoulders pulled down","Lower to upper arms parallel, no further","Drive up through the band's help","Thinner band as you get stronger"],b:"Inhale down, exhale on the push",s:"Where to start on the tower. The band helps most at the bottom, which is exactly where you are weakest and where the shoulder is most vulnerable."},
  hp_dip:{c:["Grip the bars, press to a locked-out start","Shoulders pulled DOWN away from the ears","Slight forward lean for chest, upright for triceps","Lower to upper arms parallel and stop","Drive up under control"],b:"Inhale down, exhale on the push",s:"Parallel is the floor, not a target to beat. Going deeper adds shoulder risk and almost no extra muscle."},
  hp_weighted_dip:{c:["Bell hung from a dip belt, or squeezed between the feet","Start with the 25lb bell","Same depth rule: parallel and no further","Controlled 3 second lower"],b:"Inhale down, exhale on the push",s:"Once bodyweight dips are comfortable for 10, this is how you keep adding load for years without owning a rack."},

  /* ── chin ladder ────────────────────────────────────────────── */
  hpl_band_row:{c:["Sit tall, band looped round your feet","Handles in each hand, arms extended","Row to the belly, elbows back along the ribs","Squeeze the shoulder blades 1s","Control the return to a full stretch"],b:"Exhale on the pull",s:"Step 1 and the most back-friendly pull you own. Nothing loads the spine. Step further into the band to make it harder."},
  hpl_pulldown:{c:["Band anchored high or over the tower","Kneel, arms overhead","Pull to the collarbone, elbows down and back","Squeeze the lats, control the return"],b:"Exhale on the pull",s:"Step 2. Trains the exact pulling direction a chin-up needs, with resistance you can dial precisely."},
  hpl_inverted:{c:["Under a table or a bar at hip height","Body rigid, heels on the floor","Pull the chest to the edge","Squeeze 1s, lower under control","Walk the feet out to make it harder"],b:"Exhale on the pull",s:"Step 3. The best bridge toward a chin-up because you scale it just by changing your body angle."},
  hpl_chin_neg:{c:["Jump or step to the top, chin over the bar","Lower yourself for a full 5 seconds","Step back up, do not drop and repeat","3-5 reps is a full set"],b:"Breathe steadily, brace the trunk",s:"Step 4. You are roughly 40% stronger lowering than lifting, which is why negatives build the chin-up faster than anything else. Combine these with band-assisted sets and you will get there."},
  hpl_chin:{c:["Underhand grip, hands shoulder width","Dead hang start, arms straight","Pull until the chin clears the bar","3 second lower","No kipping or swinging"],b:"Exhale on the way up",s:"Step 5, the goal. The best upper body builder there is, and it trains your biceps hard at the same time. Even one clean rep is a set worth logging."},
  hpl_chin_wt:{c:["Bell on a dip belt or held between the feet","Dead hang start, chin clears the bar","Controlled 3 second lower","Start with the 25lb bell"],b:"Exhale on the way up",s:"Step 6. Where you go once ten clean bodyweight reps feel comfortable."},
  hpl_kb_row_alt:{c:["Free hand braced on a chair or bench","Back flat and supported","Row to the hip, elbow back not out","Full stretch, hard squeeze"],b:"Exhale on the pull",s:"Not a ladder step, an alternative. Use it on days the bar is not happening or when you want more total back volume."},

  /* ── row and press alternatives ─────────────────────────────── */
  hpr_band_row_s:{c:["Sit tall, band round the feet","Row to the belly, elbows back","Squeeze the blades 1s","Full stretch on the return"],b:"Exhale on the pull",s:"Always available, never loads the spine."},
  hpr_inverted_s:{c:["Under a table or low bar","Body rigid, chest to the edge","Squeeze 1s at the top","Feet further out is harder"],b:"Exhale on the pull",s:"Bodyweight pulling scaled by body angle."},
  hpr_renegade:{c:["Plank position gripping two bells","Row one bell to the hip","Hips stay DEAD level, do not let them rotate","Set it down, then the other side","Feet wider makes it easier"],b:"Exhale on each row",s:"Back and anti-rotation core at once. Go much lighter than a normal row, the stability is the hard part."},
  hpr_gorilla:{c:["Two bells between the feet, wide stance","Hinge with a FLAT back, chest proud","Row one bell to the hip while the other stays down","Alternate, keeping the torso still"],b:"Exhale on each row",s:"Heavier than single-arm rows because you can brace against the other bell. Only when the lower back feels fully good, since it holds the hinge throughout."},
  hpr_band_pullover:{c:["Band anchored high, standing or kneeling","Arms STRAIGHT and they stay straight","Pull down to the hips using only the lats","Squeeze, control the return"],b:"Exhale on the pull",s:"Pure lat isolation with no biceps involvement at all. Great finisher when the arms are already cooked."},
  hpp_bu_press:{c:["Bell upside down, handle squeezed hard","Wrist dead straight, forearm vertical","Press slowly, speed will dump it","Lower just as slowly"],b:"Exhale on the press, brace hard",s:"Rotator cuff work disguised as a press. 25lb will feel absurdly heavy and that is correct."},
  hpp_push_press:{c:["Bell racked at the shoulder","Short sharp dip of the knees","Drive with the legs to start the bell","Finish the lockout with the arm","Control it back to the rack"],b:"Exhale on the drive",s:"Legs get you past the sticking point so you keep volume instead of grinding."},
  hpp_seesaw:{c:["Two bells racked at the shoulders","One presses up as the other lowers","Continuous, no pause at the bottom","Ribs down, no lower-back arch"],b:"Exhale on each press",s:"The constant tension makes this conditioning as much as strength. Lighter than a strict press."},
  hpp_z_press:{c:["Seated on the floor, legs straight out in front","Bell racked at the shoulder","Press straight overhead without leaning back","Ribs down, core braced hard"],b:"Exhale on the press",s:"No leg drive and nowhere to hide. The strictest overhead press there is, and it exposes any lower-back arching instantly. Go much lighter than standing."},
  hpp_band_press:{c:["Stand on the middle of the band","Handle at the shoulder, press overhead","Resistance builds toward lockout","Control the return"],b:"Exhale on the press",s:"Hardest where you are strongest. Good for high-rep finishing after the heavy bell work."},

  /* ── hanging core ───────────────────────────────────────────── */
  hph_knee_raise:{c:["Dead hang, shoulders packed down","Curl the PELVIS first","Knees to chest, hold 1s","Lower slowly, no swinging"],b:"Exhale as the knees rise",s:"Curling the pelvis is the exercise. Lifting the knees with a flat back is just hip flexors."},
  hph_leg_raise:{c:["Dead hang, legs straight","Raise to horizontal or higher","Control the lower completely","No swinging between reps"],b:"Exhale as the legs rise",s:"Much harder than knee raises. Earn it by getting 15 clean knee raises first."},
  hph_hollow_s:{c:["On your back, lower back PRESSED into the floor","Shoulders and legs lifted just off the ground","The back never leaves the floor","Bend the knees to make it easier"],b:"Short controlled breaths, stay braced",s:"No tower needed. If the back arches, shorten the lever by bending the knees."},
  hph_dead_bug_s:{c:["On your back, arms up, knees at 90°","Lower back flat and it stays flat","Lower opposite arm and leg slowly","Stop if the back wants to arch"],b:"Exhale slowly as you extend",s:"No tower needed, and genuinely good for a lower back that needs strengthening."},
  hph_side_plank_s:{c:["On your side, elbow under the shoulder","Hips stacked one on top of the other","Lift the hips into a straight line","Squeeze the bottom glute"],b:"Slow controlled breathing",s:"Lateral trunk work with no spinal loading."},

  /* ── Home Strength ──────────────────────────────────────────── */
  hs_push:{c:["Pick the hardest variant you can manage for 10 clean reps","Hands slightly wider than the shoulders","Body one rigid line, glutes and abs squeezed","Elbows at 45° from the ribs, NOT flared to 90°","Chest to the floor every rep, no half reps","Stop 1-2 reps short, last set all the way to failure"],b:"Inhale down, exhale on the push",s:"This is the day that builds, so the rule is different from your kettlebell days: the set ends when the muscle is done, not when a clock says so. If 15 reps feels comfortable on all four sets, the movement is too easy and you move up the ladder. That is how bodyweight keeps working."},
  hs_pull:{c:["Hardest version you can do for 8 clean reps","Pull with the elbows, not the hands","Squeeze the shoulder blades together and hold 1s","Full stretch at the bottom of every rep","Body stays rigid, no heaving with the lower back"],b:"Exhale on the pull",s:"Pulling is the biggest gap in your week, 8 sets against a minimum of 10, while chest sits at 17. Fixing that ratio is worth more to how you look and how your shoulders feel than any amount of extra pressing."},
  hs_press:{c:["Half-kneeling: one knee down, opposite knee up","Bell racked on the side of the down knee","Squeeze that glute hard, ribs pulled DOWN","Press straight up, elbow driving under the bell","Lock out with the bicep beside your ear","Stop with 1 rep left, never grind the last one"],b:"Exhale on the press, brace the trunk",s:"Your heaviest pressing, so treat it as the strength lift of the day. The half-kneeling stance makes it impossible to arch your lower back to get the bell up, which is exactly what you want while the back is rebuilding."},
  hs_fly:{c:["Band around your back, a handle in each hand","Arms slightly bent and that bend never changes","Open out until you feel a real stretch across the chest","Hug it back together, squeeze 1s at the middle","Light tension, high reps, perfect control"],b:"Exhale as the hands come together",s:"Push-ups load the chest hardest near lockout and barely at all in the stretch. This does the opposite, so the two together cover the whole muscle. Do not chase heavy bands here."},
  hs_curl:{c:["25lb, one bell in both hands or one per side","Elbows pinned to the ribs and they stay there","Curl without the elbows drifting forward","Squeeze hard at the top for a full second","3 second lower, all the way to straight","Last set to failure, then drop to a band and keep going"],b:"Exhale on the way up",s:"Full extension at the bottom every single rep. Half reps at the top feel harder and build less. The drop set at the end is where the real burn comes from."},
  hs_tri:{c:["Both hands cupped under one bell, pressed overhead","Elbows point UP and stay beside your ears","Lower behind the head until you feel the stretch","Drive up without letting the elbows flare","Last set to failure, then straight into close-grip push-ups"],b:"Inhale down, exhale on the extension",s:"The long head of the tricep is most of your arm's size and it only gets loaded properly with the arm overhead. Flaring elbows means the weight is too heavy."},
  hs_core:{c:["On your back, arms up, knees up at 90°","Press the lower back FLAT into the floor first","It stays flat for every rep, no exceptions","Lower opposite arm and leg slowly","Stop the moment the back wants to arch"],b:"Exhale slowly as you extend",s:"You said your back just isn't strong enough yet. This is the exercise that fixes that, more than any amount of swinging. It trains the trunk to resist extension under load, which is the pattern that was failing."},

  /* ── push-up ladder ─────────────────────────────────────────── */
  hs_knee_pu:{c:["Knees on the floor, ankles crossed","Straight line from knees to head, do not sit back","Chest still touches the floor","Elbows 45°, not flared"],b:"Inhale down, exhale on the push",s:"Step 1. No shame here. Clean reps at an easy angle beat ugly reps at a hard one, every time."},
  hs_incline_pu:{c:["Hands on a bench, step, counter or couch arm","Body one rigid line from heels to head","Chest to the surface on every rep","Lower the surface over the weeks"],b:"Inhale down, exhale on the push",s:"Step 2. The beauty of this one is that it is infinitely adjustable: every inch lower is a small progression you can actually feel."},
  hs_tempo_pu:{c:["Standard push-up position","3 seconds down","1 second paused with the chest on the floor","Drive up at normal speed","Halve your usual reps"],b:"Inhale on the slow descent",s:"Step 3. Same position, much more time under tension. A great way to make standard push-ups hard again without needing anything new."},
  hs_feet_pu:{c:["Feet on a bench or step, hands on the floor","Body one rigid line, do not let the hips sag","Chest to the floor","Elbows 45°, not flared"],b:"Inhale down, exhale on the push",s:"Step 4. Raising the feet shifts load onto the upper chest and front delts and adds roughly 15% to what you are pressing."},
  hs_deficit_pu:{c:["Hands on the handles of two bells, bells on the floor","Squeeze the handles hard, they want to tip","Lower until your chest drops BELOW the handles","Push back up through the full range"],b:"Inhale down, exhale on the push",s:"Step 5. The extra depth is the point: the stretched position is where most of the growth happens, and a floor push-up never reaches it. Neutral wrists are a bonus if yours complain."},
  hs_archer_pu:{c:["Hands much wider than shoulders","Lower toward ONE hand, the other arm stays straight","That straight arm just assists, it does not press","Alternate sides each rep or each set"],b:"Inhale down, exhale on the push",s:"Step 6. Most of your bodyweight through one arm. The honest bridge toward a one-arm push-up."},
  hs_weighted_pu:{c:["Loaded backpack worn tight, or a bell set on the upper back","Have someone place the bell if you can","Body rigid, chest to the floor","Elbows 45°"],b:"Inhale down, exhale on the push",s:"Step 7. Once bodyweight is easy, this is how you keep adding load for years. A backpack with books is genuinely fine."},

  /* ── pull ladder ────────────────────────────────────────────── */
  hs_band_row:{c:["Sit tall, band looped round your feet","Handles in each hand, arms extended","Row to the belly, elbows back along the ribs","Squeeze the shoulder blades 1s","Control the return to a full stretch"],b:"Exhale on the pull",s:"Step 1, and the most back-friendly pull you own. Nothing is loading your spine at all. Shorten the band or step further into it to make it harder."},
  hs_band_pulldown:{c:["Band anchored high, or in the top of a door","Kneel facing it, arms overhead","Pull to the collarbone, driving the elbows down and back","Squeeze the lats, control the return"],b:"Exhale on the pull",s:"Step 2. Pure lat work with zero spinal load. This is the movement that builds width."},
  hs_kb_row_sup:{c:["Free hand braced flat on a bench, chair or your knee","Back flat and SUPPORTED, not holding a hinge","Row the bell to the hip, elbow back not out","Full stretch at the bottom, hard squeeze at the top"],b:"Exhale on the pull",s:"Step 3. Bracing the free hand is what keeps this off your lower back. Never do unsupported bent-over rows while the back is still rebuilding."},
  hs_inverted_row:{c:["Under a sturdy table or a bar at hip height","Body rigid, heels on the floor","Pull the chest to the edge or the bar","Squeeze 1s, lower under control","Walk the feet out to make it harder"],b:"Exhale on the pull",s:"Step 4. Bodyweight pulling you can scale precisely by changing your body angle. The more horizontal, the harder."},
  hs_chin_neg:{c:["Jump or step up to the top position, chin over the bar","Lower yourself for a full 5 seconds","Step back up, do not drop and repeat","3-5 reps is a full set"],b:"Breathe steadily, brace the trunk",s:"Step 5. You are far stronger lowering than lifting, so negatives let you train the movement before you can do one. This is how almost everyone earns their first chin-up."},
  hs_chin_up:{c:["Underhand grip, hands shoulder width","Start from a dead hang, arms straight","Pull until the chin clears the bar","Lower under control, 3 seconds","No kipping or swinging"],b:"Exhale on the way up",s:"Step 6. The best single upper body builder there is, and it trains your biceps hard at the same time. Worth working toward on its own."},
  hs_weighted_chin:{c:["Bell on a dip belt, or held between the feet","Dead hang start, chin clears the bar","Controlled 3 second lower","Start with the 25lb bell"],b:"Exhale on the way up",s:"Step 7. Where you go once ten clean bodyweight chin-ups feel comfortable."},

  /* ── Arms & Delts ───────────────────────────────────────────── */
  ad_bandpull:{c:["Band at chest height, arms straight out in front","Hands slightly wider than shoulders, palms down","Pull the band apart until your arms form a T","Squeeze the shoulder blades together and hold 1s","Control the return, do not let it snap back"],b:"Exhale as you pull apart",s:"Costs nothing and makes every press that follows feel better. Widen your grip if it's too hard, narrow it if it's too easy."},
  ad_halo:{c:["Bell by the horns, upside down, close to the chest","Circle it around the head, as close as you can","Ribs stay DOWN, no arching the lower back","Slow and deliberate, 5 each direction"],b:"Breathe normally throughout",s:"Takes the shoulder through its full range under light control before you load it."},
  ad_press:{c:["Half-kneeling: one knee down, opposite knee up at 90°","Bell racked on the side of the DOWN knee","Squeeze the down-side glute hard, ribs pulled down","Press straight up, elbow driving under the bell","Lock out with the bicep beside your ear"],b:"Exhale on the press, brace the trunk",s:"The stance makes it physically impossible to arch your lower back to muscle the bell up. With your back sore, this is the press to use. All the delt stimulus, none of the spinal load."},
  ad_lateral:{c:["Band underfoot or 10-15lb dumbbells","Slight forward lean from the hips, not the lower back","Thumb up, lead with the ELBOW not the hand","Raise to shoulder height only, never higher","Lower slowly, 3 seconds, do not drop it"],b:"Exhale as you raise",s:"Your lightest bell is 25lb, which is far too heavy here and will turn this into a shrug. Band or light dumbbells. If you can swing it up, it's too heavy and the side delt isn't doing the work."},
  ad_rear:{c:["Band or cable at roughly forehead height","Pull toward your face, elbows high and wide","At the end, rotate so your hands finish behind your ears","Squeeze 1s, control the return","Light weight, high reps, every time"],b:"Exhale on the pull",s:"Doubles as your shoulder-health work. Rear delts and external rotators are what hold the joint stable, and they're what give shoulders width from the side."},
  ad_curl:{c:["25lb, both hands on one bell or one bell per hand","Elbows pinned to your ribs and they stay there","Curl up without letting the elbows drift forward","Squeeze hard at the top for a full second","Lower for 3 seconds, all the way to straight"],b:"Exhale on the way up",s:"The bell hangs below your hands, so the bottom of the rep is loaded harder than with a dumbbell. Full extension at the bottom every rep, that's where the growth is."},
  ad_tri:{c:["Both hands cupped under one bell, pressed overhead","Elbows point UP at the ceiling and stay beside your ears","Lower the bell behind your head under control","Go until you feel a real stretch, then drive up","Elbows never flare out to the sides"],b:"Inhale down, exhale on the extension",s:"The long head of the tricep only gets properly stretched with the arm overhead, and the long head is most of your arm's size. If your elbows flare, you've gone too heavy."},
  ad_hammer:{c:["Neutral grip, palms facing each other throughout","Dumbbells, or one bell per hand by the handle","Elbows pinned to the ribs","Curl without rotating the wrist at all","Squeeze at the top, lower for 3 seconds"],b:"Exhale on the way up",s:"Hits the brachialis, which sits underneath the bicep and physically pushes it upward as it grows. Most people skip it and wonder why their arms stall."},
  ad_cgpush:{c:["Hands just INSIDE shoulder width","Body one rigid line, glutes and abs squeezed","Elbows track BACK along the ribs, not out to the sides","Chest to the floor on every rep","Push the floor away hard at the top"],b:"Inhale down, exhale on the push",s:"Elbows back rather than flared is what makes this a tricep exercise instead of a chest one, and it keeps the shoulder out of trouble. Knees down beats half reps."},
  ad_deadbug:{c:["On your back, arms straight up, knees up at 90°","Press the lower back FLAT into the floor first","It stays flat for every single rep","Lower one arm overhead and the opposite leg","Stop the instant the back wants to arch, then switch"],b:"Exhale slowly as you extend",s:"This is rehab-grade work for exactly the back you're complaining about. It teaches the trunk to brace against extension, which is the thing that was failing during your swings. Slow and small beats big and fast."},
  ad_plank:{c:["Forearms down, elbows directly under the shoulders","Squeeze glutes, then quads, then abs","Straight line from heels to head","No sag in the hips and no pike upward","Breathe, do not just hold your breath and shake"],b:"Slow controlled breaths through the nose",s:"Anti-extension: your trunk resists the lower back arching. That's the opposite of what irritated it today, and the reason it's here rather than sit-ups."},

  /* ── Arms & Delts substitutions ─────────────────────────────── */
  ads_bu_press:{c:["Bell upside down, handle squeezed as hard as you can","Wrist dead straight, forearm vertical","Press slowly, speed will dump it","Lower just as slowly"],b:"Exhale on the press, brace hard",s:"Rotator cuff work disguised as a press. 25lb will feel absurdly heavy and that's correct."},
  ads_db_press:{c:["Seated or standing, dumbbells at shoulder height","Elbows FORWARD at about 30°, not flared wide","Press up and slightly in","Stop at ear height, do not slam the lockout","Ribs down, no lower-back arch"],b:"Exhale on the press",s:"Elbows forward keeps the shoulder in the safe plane. Flaring to a wide T is the position that causes impingement."},
  ads_landmine:{c:["Half-kneeling at the end of a barbell in a corner","Press up and forward along the bar's arc","Elbow stays in front of the body","Full extension without locking hard"],b:"Exhale on the press",s:"The arc keeps the upper arm in the scapular plane, which is the single most shoulder-friendly way to press overhead."},
  ads_push_press:{c:["Bell or dumbbells racked at the shoulders","Short sharp dip of the knees","Drive with the legs, let that start the weight","Finish the lockout with the arm","Lower under control to the rack"],b:"Exhale on the drive",s:"Legs get you past the sticking point so you keep the volume instead of grinding out ugly reps."},
  ads_arnold_ad:{c:["Start with palms facing you at chest height","Rotate to palms-forward as you press up","Elbows stay forward throughout","Reverse the rotation on the way down"],b:"Exhale on the press",s:"The rotation gives the front delt a longer path under tension. Go lighter than a straight press."},
  ads_floor_press_ad:{c:["On your back, knees bent, bell in one hand","Press straight up, wrist stacked over the elbow","Lower until the upper arm touches the floor","Pause, then press again"],b:"Inhale down, exhale on the press",s:"The floor physically stops you short of the end range where an unstable shoulder gets into trouble."},
  ads_cable_lat:{c:["Cable at the lowest setting, opposite hand","Slight lean away from the stack","Thumb up, lead with the elbow","Shoulder height only, lower slowly"],b:"Exhale as you raise",s:"Constant tension through the whole range, which dumbbells can't give you at the bottom. The best lateral if you're at the gym."},
  ads_seated_lat_ad:{c:["Seated upright on a bench","Dumbbells at your sides, 10-15lb","Thumb up, lead with the elbow","Shoulder height, no higher","3 second lower"],b:"Exhale as you raise",s:"Sitting removes every bit of leg drive and body english. Strict and light."},
  ads_bent_lat_ad:{c:["Hinge to 45° with a FLAT back, or lie chest-down on an incline bench","Light dumbbells hanging straight down","Raise out to the sides, thumbs down","Squeeze the rear delts, control the lower"],b:"Exhale as you raise",s:"Use the incline bench version while your back is sore. Chest supported means the lower back does nothing at all."},
  ads_band_lat:{c:["Stand on the middle of a band, handle in one hand","Raise out to the side, thumb up","Shoulder height only","Resist on the way down, the band wants to snap back"],b:"Exhale as you raise",s:"Band tension increases exactly where the side delt is strongest. The best home option by a distance."},
  ads_partial_lat:{c:["Hold a post or rack with one hand, lean away","Weight in the outside hand","Raise to shoulder height from the lengthened position","Slow lower, full stretch at the bottom"],b:"Exhale as you raise",s:"Leaning away loads the side delt at a longer muscle length, so a light weight produces far more stimulus."},
  ads_band_pullapart_s:{c:["Band at chest height, arms straight","Pull apart to a T, squeeze the blades","Control the return"],b:"Exhale as you pull",s:"Endless reps with no joint cost. Do them between sets of anything."},
  ads_rear_fly:{c:["Chest down on an incline bench if you have one","Light dumbbells, thumbs down","Raise out to the sides, not backward","Squeeze 1s, lower slowly"],b:"Exhale as you raise",s:"Chest supported takes the lower back out of it completely, which matters this week."},
  ads_prone_y_ad:{c:["Face down on the floor, forehead resting","Thumbs pointing up at the ceiling","Lift the arms into a Y overhead","Hold 2s, lower slowly","Little or no weight"],b:"Exhale as you lift",s:"Lower traps and rear delts, the muscles that keep the shoulder blade where it belongs."},
  ads_cable_face:{c:["High anchor, rope attachment, overhand grip","Pull to forehead level, elbows high","Externally rotate at the end, hands behind the ears","Control the return"],b:"Exhale on the pull",s:"Your number one shoulder health exercise. Light, strict, high reps."},
  ads_db_curl_ad:{c:["Dumbbells at your sides, palms forward","Elbows pinned to the ribs","Curl without the elbows drifting forward","Supinate hard and squeeze at the top","3 second lower to full extension"],b:"Exhale on the way up",s:"The eccentric is where most of the growth comes from. Do not drop the weight."},
  ads_preacher_ad:{c:["Seated, elbows braced on the inner thighs or a preacher pad","Curl from a full stretch","Swinging is physically impossible here","Squeeze at the top, lower slowly"],b:"Exhale on the way up",s:"Loads the bicep hardest in the stretched position. Go lighter than a standing curl, it will feel much harder."},
  ads_conc_curl_ad:{c:["Seated, elbow braced on the inner knee","One arm at a time","Curl to the shoulder, squeeze 2s","Lower all the way to straight"],b:"Exhale on the way up",s:"Maximum isolation. Nothing else can help, so the bicep does every bit of it."},
  ads_band_curl:{c:["Stand on the band, handles in each hand","Elbows pinned, curl up","Hardest at the top where you're strongest","Resist the return"],b:"Exhale on the way up",s:"Perfect for a high-rep burnout at the end. Chase the pump, not the load."},
  ads_chin_up:{c:["Underhand grip, hands shoulder width","Start from a dead hang, arms straight","Pull until your chin clears the bar","Lower under control, 3 seconds","Assisted or slow negatives both count"],b:"Exhale on the way up",s:"The best bicep builder there is, and it hits your back at the same time, which you're currently short on. If you can only do a few, do slow negatives."},
  ads_pushdown_ad:{c:["Rope or bar at a high cable","Elbows GLUED to your sides and immobile","Only the forearm moves","Squeeze hard at full extension","Control the return to 90°"],b:"Exhale on the pushdown",s:"If your elbows are moving, the weight is too heavy and your back and shoulders are helping."},
  ads_lying_ext_ad:{c:["Flat on a bench or the floor","Dumbbells above the chest, elbows pointing up","Lower toward the forehead, elbows fixed","Full stretch, then drive back up"],b:"Inhale down, exhale on the extension",s:"Classic mass builder for the triceps. Keep the elbows pointing at the ceiling the whole time."},
  ads_bench_dip_ad:{c:["Hands on a bench behind you, fingers forward","Lower until the upper arms are parallel to the floor","Elbows track BACK, never flare out","Push through the heels of the hands","Feet closer is easier, further is harder"],b:"Exhale on the push",s:"Don't go deeper than parallel. Below that the shoulder takes the load in its most vulnerable position."},
  ads_diamond_pu:{c:["Hands together under the chest, thumbs and fingers touching","Body one rigid line","Elbows track back along the ribs","Chest to the hands","Knees down if needed"],b:"Inhale down, exhale on the push",s:"Brutal triceps work with no equipment at all. A genuinely hard finisher."},
  ads_kick_back:{c:["Hinge with a FLAT back, or brace a hand on a bench","Upper arm locked parallel to the floor","Extend from the elbow only","Squeeze 1s at full extension","Light weight, this is not a strength movement"],b:"Exhale on the extension",s:"Brace a hand on a bench so your lower back isn't holding the hinge. Peak contraction work, keep it light."},
  ads_pallof_ad:{c:["Stand sideways to a band at chest height","Hands at the sternum, press straight out","Hold 2 seconds at full extension","Resist the pull that wants to rotate you","Return slowly"],b:"Exhale on the press-out",s:"Anti-rotation with zero spinal flexion. One of the safest and most useful core exercises for a sore back."},
  ads_side_plank_ad:{c:["On your side, elbow directly under the shoulder","Hips STACKED one on top of the other","Lift the hips into a straight line","Squeeze the bottom glute","30 seconds a side"],b:"Slow controlled breathing",s:"Builds the lateral trunk without loading the spine at all."},
  ads_hollow:{c:["On your back, lower back PRESSED into the floor","Shoulders and legs lifted just off the ground","The back never leaves the floor","Bend the knees to make it easier","Arms overhead to make it harder"],b:"Short controlled breaths, stay braced",s:"If your lower back arches off the floor, shorten the lever by bending the knees. Form is the entire exercise."},
  ads_bird_dog:{c:["On hands and knees, back flat","Extend the opposite arm and leg","Hips stay LEVEL, do not let them rotate","Hold 2s, return under control","Slow and small"],b:"Exhale as you extend",s:"Low-load, genuinely good for a sore lower back, and it trains the bracing pattern that failed during your swings."},
  ads_suitcase_ad:{c:["One bell, one hand, hanging at your side","Stand dead vertical, do not lean away from it","Shoulder packed down, no shrugging","Ribs down, walk normally"],b:"Short shallow breaths, core braced",s:"Anti-lean, no bending of the spine. Safe and useful even with a sore back."},

  /* ── kettlebell: main movements ─────────────────────────────── */
  kbs_halo:{c:["Bell by the horns, upside down, close to the chest","Circle it around the head — as close as you can without hitting it","Ribs stay DOWN, no arching the lower back","Slow. This is mobility, not a rep to rush","5 one direction, then 5 the other"],b:"Breathe normally throughout",s:"The single best shoulder warm-up you can do with a bell. It takes the shoulder through its full range under light, controlled load — exactly what an unstable joint wants before you load it. 25lb, every kettlebell session."},
  kbc_halo:{c:["Bell by the horns, upside down, close to the chest","Circle it around the head — as close as you can without hitting it","Ribs stay DOWN, no arching the lower back","Slow. This is mobility, not a rep to rush","5 one direction, then 5 the other"],b:"Breathe normally throughout",s:"The single best shoulder warm-up you can do with a bell. 25lb, every kettlebell session."},
  kbg_halo:{c:["Bell by the horns, upside down, close to the chest","Circle it around the head, close to it","Ribs down — no lower-back arch","Slow and deliberate","5 each direction"],b:"Breathe normally throughout",s:"Your shoulder warm-up. Never skip it to save 90 seconds."},
  kbs_pry:{c:["Bell at the chest by the horns, feet a little wider than shoulders","Sit all the way down and STAY there","Elbows inside the knees, push the knees outward","Rock gently side to side, then forward and back","Stand up tall, squeeze the glutes"],b:"Deep breaths in the bottom position",s:"You are prying the hips open, not training the legs. Because the bell is in front it pulls you into a more upright squat and encourages the knees to track OUT — which is exactly the correction you need."},
  kbg_pry:{c:["Bell at the chest, feet slightly wide","Sit to the bottom and stay","Elbows push the knees out","Rock side to side, then stand"],b:"Deep breaths at the bottom",s:"Hip opener and a knee-tracking drill in one. Front-loading pulls the knees out."},
  kbs_swing:{c:["Feet shoulder width, bell a foot in front of you", "HINGE — hips go back, shins stay near vertical. This is not a squat", "Chest proud, back flat, eyes on the horizon", "Hips snap forward hard, glutes and abs lock at the top", "The bell floats to chest height on its own. Never lift it with the arms", "Let it fall, catch it with the hips, repeat"],b:"Sharp exhale at the top of every rep — a hiss through the teeth",s:"Swings are actively GOOD for your shoulder. The bell pulls the arm forward and the shoulder has to work to stay packed in the socket, which is exactly the stability you want. The arm is a rope — all the power is hips. If you feel it in the shoulders or lower back, you are lifting instead of hinging."},
  kbg_swing:{c:["Feet shoulder width, bell a foot in front of you", "HINGE — hips go back, shins stay near vertical. This is not a squat", "Chest proud, back flat, eyes on the horizon", "Hips snap forward hard, glutes and abs lock at the top", "The bell floats to chest height on its own. Never lift it with the arms", "Let it fall, catch it with the hips, repeat"],b:"Sharp exhale at the top of every rep",s:"Hips do the work, the arm is a rope. Glutes and abs lock hard at the top."},
  kbc_swing:{c:["Feet shoulder width, bell a foot in front of you", "HINGE — hips go back, shins stay near vertical. This is not a squat", "Chest proud, back flat, eyes on the horizon", "Hips snap forward hard, glutes and abs lock at the top", "The bell floats to chest height on its own. Never lift it with the arms", "Let it fall, catch it with the hips, repeat"],b:"Sharp exhale at the top of every rep",s:"Last block of the day. Form first — a sloppy swing under fatigue is where backs get hurt. If the bell stops floating, stop the set."},
  kbs_1arm:{c:["Same hinge, one hand on the handle","Free arm mirrors the working arm — do not let it dangle","Keep the shoulder PACKED — lat tight, do not let the bell drag it forward","Body stays square, resist the twist","8 reps, then swap hands at the top of a swing"],b:"Sharp exhale at the top",s:"One bell on one side means your core has to stop you rotating — that anti-rotation demand is why this beats the two-hand version for hockey. Go one bell lighter than your two-hand swing."},
  kbs_goblet:{c:["Bell at the chest by the horns, elbows tucked in","Feet shoulder width or slightly wider","Sit straight DOWN, knees tracking out over the toes","Elbows inside the knees at the bottom, chest tall","Drive up through the whole foot, squeeze the glutes"],b:"Inhale on the way down, exhale on the drive up",s:"This one is corrective for you. Your knees want to collapse inward, and holding the load in front automatically encourages them to track out. Push the knees against the elbows at the bottom to feel it."},
  kbg_goblet:{c:["Bell at the chest, elbows tucked","Sit straight down, knees tracking OUT","Elbows inside the knees at the bottom","Drive up through the whole foot"],b:"Inhale down, exhale up",s:"Knees out, not in. The front load helps you do that automatically."},
  kbs_chop:{c:["Bell in both hands, start low outside one hip","Sweep it diagonally up to the opposite shoulder","Rotation comes from the RIBS, not the arms","Pivot the back foot, let the hips follow","Control it back down on the same line"],b:"Exhale on the way up",s:"This is the closest thing in the gym to a hockey shot. Rotational power through a braced trunk. 25lb is plenty — speed and range matter more than load."},
  kbg_core:{c:["Bell in both hands low outside one hip","Sweep diagonally to the opposite shoulder","Rotate from the ribs, pivot the back foot","Control the way down"],b:"Exhale on the way up",s:"Rotational core work. Light bell, full range."},
  kbs_carry:{c:["One bell, one hand, hanging at your side","Stand DEAD vertical — do not lean away from it","Shoulder packed down and back, do not shrug","Ribs down, abs braced, walk normally","20 seconds, swap hands, 20 more"],b:"Short shallow breaths, core stays braced",s:"The whole exercise is refusing to bend sideways. Go heavy — 50lb. If you are leaning, it is too heavy or you have stopped bracing."},
  kbg_carry:{c:["Bell in the rack position at one shoulder","Elbow tight to the ribs, wrist straight","Ribs pulled DOWN — this is the hard part","Walk tall and normally, do not waddle","20 seconds a side"],b:"Short shallow breaths — the rack position restricts them on purpose",s:"The rack position is the breathing challenge. It is also completely safe for the shoulder because nothing goes overhead. This is your breather station — but the core never switches off."},
  kbs_plank:{c:["Forearms down, elbows under the shoulders","Squeeze the glutes, then the quads, then the abs","Straight line from heels to head","No sag in the hips, no pike upward","Breathe — do not just hold your breath and shake"],b:"Slow controlled breaths through the nose",s:"Quality over duration. 45 hard seconds beats 2 soft minutes."},
  kbc_getup:{c:["Lie on your side, both hands on the bell, roll onto your back","Bell pressed up, elbow LOCKED. Same-side knee bent, foot flat","Free arm at 45° on the floor","Roll to the elbow, then post up onto the hand","Sweep the straight leg back into a half-kneel","Stand up. Then reverse every step exactly"],b:"Steady breathing — never hold your breath",s:"EYES ON THE BELL the whole way up and down. This is the best single exercise for a shoulder that has been unstable: it demands stability through every angle the joint has. Treat it as skill practice — 25lb, one rep a side, perfect. Do not chase weight here for months."},
  kbc_abc:{c:["ONE bell. Right hand: 2 cleans, 1 press, 3 front squats","Clean — hinge, pull the bell close to the body, spear the hand through. It should SETTLE into the rack, not bang the wrist","Press from the rack: ribs down, elbow drives up, lock out with the bicep by the ear","Front squat with the bell still racked: sit down between the hips, chest tall","Switch hands. Repeat everything on the left. That is one round"],b:"Exhale on each clean and each press. Breathe in the rack between reps",s:"Dan John's Armor Building Complex — the single best bang-for-buck kettlebell session there is. If the clean bangs your wrist, you are curling it: pull the bell in TIGHT and let the arm rotate around it. If it still bangs after a few sessions, use the Swing + Squat sub — it trains the same lungs with none of the skill."},
  kbg_burpee:{c:["STEP back into the plank, one foot at a time. No jumping","Chest touches the floor, elbows track back at 45°","Push up, STEP the feet back in one at a time","Stand up tall. No jump at the top either","Steady rhythm — this is a breathing drill, not a sprint"],b:"Exhale as you push up off the floor",s:"Stepping instead of jumping is deliberate: it takes the ground impact off your shins and the landing off your knees, and you lose almost nothing in conditioning. Never jump these."},
  kbg_pushup:{c:["Hands slightly wider than the shoulders","Body one rigid line — squeeze glutes and abs","Elbows at 45° from the torso, NOT flared to 90°","Chest to the floor on every rep","Push the floor away, do not let the hips sag"],b:"Inhale down, exhale on the push",s:"Elbows at 45° is the same rule as your incline press, and it matters for the same reason — flaring to 90° puts the shoulder in the impingement position. Drop to the elevated version rather than grinding half-reps."},

  /* ── kettlebell: substitutions ──────────────────────────────── */
  kb_1arm_swing_s:{c:["Same hinge, one hand","Free arm mirrors the working arm","Shoulder packed — do not let the bell drag it forward","Stay square, resist the twist"],b:"Sharp exhale at the top",s:"Anti-rotation on top of the hinge. One bell lighter than your two-hand swing."},
  kb_dead_swing:{c:["Bell starts on the floor, a foot in front of you","Hinge, hike it back between the legs, snap the hips","At the top of the backswing, park it back on the floor","Reset your grip and position every single rep"],b:"Exhale at the top of each swing",s:"No rebound means every rep is a fresh, honest hinge. This is the fix when your swings start drifting into squats."},
  kb_deadlift_s:{c:["Bell between the feet, handle in line with the ankles","Hinge down, chest proud, back flat","Both hands on the handle, take the slack out","Stand up by driving the hips forward","Lower it under control, do not drop it"],b:"Exhale as you stand",s:"The hinge with zero ballistic load. This is the swap when the back or shoulder is complaining — same pattern, no speed."},
  kb_rdl_s:{c:["Standing tall, bell in both hands at the hips","Knees SOFT and fixed — they do not bend further","Push the hips straight back, bell slides down the thighs","Stop when you feel the hamstrings, not when you touch the floor","Squeeze the glutes to stand"],b:"Inhale on the way down, exhale standing",s:"Pure hamstring and glute stretch under load. Slow — 3 seconds down."},
  db_swing_s:{c:["Hold one dumbbell vertically by the top head, both hands","Identical hinge to a kettlebell swing","Hips snap, the weight floats up","Do not let it pull you forward at the top"],b:"Sharp exhale at the top",s:"Works fine if no bell is free. The grip is worse, so go lighter."},
  kb_good_morning_s:{c:["Bell in the rack at one shoulder, or two hands at the chest","Knees soft, hinge until the torso is near horizontal","Back flat throughout, ribs down","Stand by driving the hips forward"],b:"Inhale down, exhale up",s:"Loads the hinge with no speed at all. Good when you want posterior chain work but the shins or back are not up for swings."},
  kb_front_squat_s:{c:["Bell in the rack at one shoulder, elbow tight to the ribs","Feet shoulder width","Sit straight down between the hips, knees tracking out","Chest tall — the off-centre load wants to fold you sideways","Drive up, stay vertical"],b:"Inhale down, exhale up",s:"Harder on the core than a goblet because the load is on one side. Do all reps one side, then swap."},
  kb_sumo_squat_s:{c:["Wide stance, toes turned out 30°","Bell hanging between the legs in both hands","Sit STRAIGHT down, knees over the toes","Chest up, back flat","Drive up through the heels, squeeze the glutes"],b:"Inhale down, exhale up",s:"Kinder on the knees than a narrow squat and more adductor. A good option on a day the knees feel cranky."},
  kb_tempo_bw_squat_s:{c:["No weight. Arms out in front for balance","3 seconds down","1 second pause at the bottom","Stand up at normal speed","Knees track out over the toes the whole time"],b:"Inhale down, exhale up",s:"No bell needed. The slow eccentric gives you real stimulus from bodyweight, and it is the best version for grooving your knee tracking."},
  kb_rev_lunge_s:{c:["Bell at the chest, goblet grip","Step BACKWARD into the lunge — never forward","Back knee lowers toward the floor, front shin stays vertical","Push through the front foot to stand","Alternate legs"],b:"Exhale as you stand",s:"Stepping back rather than forward loads the front leg without the braking force that irritates knees. Low impact, so your shins stay out of it."},
  kb_split_squat_s:{c:["Bell at the chest, feet already in a lunge stance","Both feet stay planted — no stepping","Drop straight down, back knee toward the floor","Front shin vertical, torso upright","All reps one side, then swap"],b:"Inhale down, exhale up",s:"All of the single-leg work, none of the stepping. The most knee-friendly loaded leg exercise you own."},
  kb_hk_press_s:{c:["Half-kneeling: one knee down, opposite knee up at 90°","Bell in the rack on the side of the DOWN knee","Squeeze the down-side glute, ribs pulled down","Press straight up, elbow driving under the bell","Lock out with the bicep by the ear"],b:"Exhale on the press",s:"The strictest overhead press there is. The half-kneeling stance removes all leg drive and physically prevents you arching the lower back to cheat the bell up. If a press is going to be safe for your shoulder, it is this one."},
  kb_bu_press_s:{c:["Bell UPSIDE DOWN, handle squeezed as hard as you can","Wrist dead straight, forearm vertical","Press slowly — speed will dump it","Everything from the hand to the shoulder is fighting to balance it","Lower just as slowly"],b:"Exhale on the press, brace hard",s:"Rehab-grade rotator cuff work disguised as a press. Balancing the bell forces the small stabilisers to fire in a way no normal press does. 25lb will feel absurdly heavy — that is correct."},
  kb_push_press_s:{c:["Bell in the rack, feet shoulder width","Short sharp DIP of the knees","Drive the legs and let that momentum start the bell","Finish with the arm, lock out overhead","Lower under control back to the rack"],b:"Exhale on the drive",s:"Use the legs to get past the hard part. This is how you keep the volume when a strict press is failing — not by grinding ugly reps."},
  kb_floor_press_s:{c:["On your back, knees bent, bell in one hand at the chest","Press straight up, wrist stacked over the elbow","Lower until the upper arm touches the floor — the floor is your stop","Pause, then press again","Elbow stays at about 45° from the body"],b:"Inhale down, exhale on the press",s:"The floor stops you short of the end range where an unstable shoulder gets into trouble. All the pressing, none of the risk."},
  kb_seesaw_press_s:{c:["Two bells, both in the rack","One presses up as the other comes down","Continuous, no pause at the bottom","Ribs down — do not let the lower back arch as you alternate"],b:"Exhale on each press",s:"The constant tension makes this a conditioning movement as much as a strength one. Lighter than your strict press."},
  kb_atw_s:{c:["Bell in one hand, standing tall","Pass it around the waist, hand to hand behind your back","Keep it close, keep it moving","Stay upright — do not sway with it","Change direction halfway"],b:"Breathe normally",s:"Same warming effect as a halo but nothing goes near overhead. Use it on a day the shoulder feels touchy."},
  kb_arm_bar_s:{c:["On your side, bell pressed up, elbow locked","Top leg sweeps back and over, hips rotate toward the floor","Chest opens toward the ceiling, eyes stay ON the bell","Hold and breathe — 30 seconds","Reverse carefully to come out"],b:"Deep slow breaths in the stretch",s:"Superb thoracic and shoulder opener, and it builds exactly the kind of end-range stability your shoulder wants. 25lb, move slowly, never rush the exit."},
  kb_pass_s:{c:["Band or towel in both hands, wide grip","Arms straight, lift overhead and continue behind you","Go only as far as you can WITHOUT bending the elbows","Return on the same path","Narrow the grip slightly as it gets easier"],b:"Exhale as the arms go back",s:"Pure mobility, zero load. Good first thing if the shoulders are stiff."},
  kb_prone_ty_s:{c:["Face down on the floor, forehead resting down","Thumbs pointing UP to the ceiling","Lift the arms into a T, hold 2s, lower","Then into a Y overhead, hold 2s, lower","Very light or no weight at all"],b:"Exhale as you lift",s:"Wakes up the lower traps and rear delts — the muscles that hold the shoulder blade where it belongs. This is prep, not training."},
  kb_russian_twist_s:{c:["Seated, knees bent, heels light on the floor","Bell held at the chest","Rotate and touch the bell down beside one hip, then the other","Rotation from the RIBS, chest turns with the arms","Do not let the lower back round"],b:"Exhale on each rotation",s:"Simple rotational core. Keep the chest up and actually turn — do not just swing the arms across a static torso."},
  kb_hp_plank_s:{c:["High plank, bell just outside one hand","Reach under with the opposite hand and drag it across","Hips stay LEVEL — that is the whole exercise","Reset and drag it back","Slow and controlled"],b:"Breathe steadily, never hold",s:"Anti-rotation under fatigue with a shoulder-stability bonus from the single-arm support. Harder than it looks."},
  kb_suitcase_s:{c:["One bell, one hand, at your side","Stand dead vertical, do not lean away","Shoulder packed down, no shrugging","Ribs down, abs braced, walk normally"],b:"Short shallow breaths, stay braced",s:"Refusing to bend sideways is the exercise. Go heavy."},
  kb_dead_bug_s:{c:["On your back, arms straight up, knees up at 90°","Press the lower back FLAT into the floor and keep it there","Lower one arm overhead and the opposite leg toward the floor","Stop the moment the back wants to arch","Return and switch sides"],b:"Exhale slowly as you extend",s:"No bell needed. Far harder than it looks if you keep the lower back genuinely flat."},
  kb_pallof_s:{c:["Stand sideways to a band at chest height","Hands at the sternum, press straight out","Hold 2 seconds at full extension","Resist the pull that wants to rotate you","Return slowly, do not let it snap back"],b:"Exhale on the press-out",s:"Anti-rotation, which is what your trunk actually does in hockey. Direct carry-over."},
  kb_racked_carry_s:{c:["Bell in the rack at one shoulder, elbow tight to the ribs","Wrist straight, bell resting on the forearm","Ribs pulled DOWN hard","Walk tall and normal","Swap sides halfway"],b:"Short shallow breaths — the position restricts them on purpose",s:"Brutal on the core, completely safe for the shoulder. Nothing goes overhead."},
  kb_oh_carry_s:{c:["Bell locked out overhead, elbow straight","Bicep beside the ear, shoulder pushed UP into the socket","Ribs down — the lower back must not arch","Walk slowly and deliberately","Bring it down under control, never drop it"],b:"Short controlled breaths",s:"The best shoulder stability drill you own now the joint is healthy. Start at 25lb and stay there until 60 seconds is easy."},
  kb_farmer_carry_s:{c:["A bell in each hand at your sides","Shoulders packed down and back","Stand tall, ribs down","Walk normally — no waddling, no leaning"],b:"Short shallow breaths, core braced",s:"Balanced load means you can go heaviest here. Pure grip and trap work."},
  kb_waiter_carry_s:{c:["Bell BOTTOMS-UP overhead, handle squeezed hard","Elbow locked, bicep by the ear","Wrist dead straight","Walk slowly, tiny steps","25lb only"],b:"Short controlled breaths",s:"The hardest carry there is. Every stabiliser in the shoulder is working at once. Stop the moment the wrist starts to bend."},
  kb_plank_hold_s:{c:["Forearms down, elbows under the shoulders","Squeeze glutes, quads, abs","Straight line heels to head","No sag, no pike"],b:"Slow controlled nose breathing",s:"No bell, no walking. Quality over duration."},
  kb_squat_thrust_s:{c:["STEP back into a plank, one foot at a time","No push-up","STEP the feet back in","Stand up — no jump","Steady, repeatable rhythm"],b:"Exhale as you stand",s:"A burpee with the impact and the push-up removed. Same breathing cost, nothing for your shins to complain about."},
  kb_inchworm_s:{c:["Stand tall, hinge and put the hands on the floor","Walk the hands out to a full plank","Hold 1 second","Walk the hands back to the feet","Stand up tall"],b:"Exhale walking out",s:"Low impact, and it opens the hamstrings while it gets you breathing. Good early in a session."},
  kb_mtn_climber_s:{c:["High plank, hands under the shoulders","Drive one knee toward the chest, then the other","Hips stay LOW and level — no bouncing up and down","Feet stay close to the floor","Fast but controlled"],b:"Quick shallow breathing, keep the core braced",s:"Fast breathing with no ground impact. Good burpee swap when the shins are sore."},
  kb_bear_crawl_s:{c:["Hands and feet down, knees an inch off the floor","Opposite hand and foot move together","Hips stay LOW and level","Small steps, crawl forward then backward","Do not let the hips sway side to side"],b:"Steady breathing, core braced throughout",s:"Deceptively savage full-body conditioning. If your hips are swinging, your steps are too big."},
  kb_extra_swing_s:{c:["Standard two-hand swing","Hinge, snap, float","Glutes and abs lock at the top"],b:"Sharp exhale at the top",s:"Straight burpee swap when the shins or knees have had enough. No ground contact at all."},
  kb_incline_pu_s:{c:["Hands on the HANDLES of two bells, bells on the floor","Squeeze the handles hard — they want to tip","Body one rigid line","Lower until the chest passes below the handles","Elbows at 45°, not flared"],b:"Inhale down, exhale on the push",s:"The extra depth plus the wobble makes this harder than a floor push-up, and the neutral wrist is far kinder if your wrists complain."},
  kb_elev_pu_s:{c:["Hands on a bench, step or the sofa","Body one rigid line from heels to head","Chest to the surface on every rep","Elbows 45°","The higher the hands, the easier it gets"],b:"Inhale down, exhale on the push",s:"Use this to keep every rep clean rather than grinding half-reps on the floor. Clean reps at an easier angle beat ugly reps at a hard one."},
  kb_floor_press_pu_s:{c:["On your back, bell in one hand at the chest","Press straight up, wrist over the elbow","Lower until the upper arm touches the floor","Pause, press again"],b:"Inhale down, exhale on the press",s:"Loaded pressing with the risky end range physically removed. Straight swap if the wrists or shoulder complain about push-ups."},
  kb_tempo_pu_s:{c:["Standard push-up position","3 seconds down","1 second with the chest on the floor","Drive up at normal speed","Halve your normal reps"],b:"Inhale on the 3-second descent",s:"Far more stimulus per rep. Six of these beats fifteen fast ones."},
  kb_knee_pu_s:{c:["Knees on the floor, everything else identical","Body straight from knees to head — do not sit back","Chest still touches the floor","Elbows 45°"],b:"Inhale down, exhale on the push",s:"Better than a sloppy full push-up. No ego here."},
  kb_half_getup_s:{c:["Same start: on your side, roll to your back, bell pressed up","Elbow LOCKED, eyes on the bell","Roll to the elbow, post to the hand","Sweep the leg back to a half-kneel","STOP there. Reverse back down"],b:"Steady breathing, never hold",s:"You get most of the shoulder benefit without the stand-up, which is the part people rush and butcher. Start here."},
  kb_getup_elbow_s:{c:["On your back, bell pressed up, elbow locked","Same-side knee bent, foot flat","Free arm at 45° on the floor","Drive the foot and roll onto the free elbow","Eyes on the bell. Lower back down"],b:"Steady breathing",s:"The entry only. This is where everybody should start, and there is no shame in staying here for a month."},
  kb_naked_getup_s:{c:["No bell — closed fist pointing at the ceiling instead","Full get-up sequence, start to finish","Eyes on the fist the whole way","Move slowly and learn each step"],b:"Steady breathing",s:"Learn the pattern with nothing that can fall on you. Do this before you ever load it."},
  kb_side_plank_s:{c:["On your side, elbow under the shoulder","Hips STACKED, one on top of the other","Lift the hips into a straight line","Squeeze the bottom glute","30 seconds a side"],b:"Slow controlled breathing",s:"Lateral trunk work when the floor get-ups are not happening today."},
  kb_abc_noclean_s:{c:["NO CLEAN. 5 two-hand swings","Straight into 5 goblet squats","Put the bell down, rest the remainder of the interval","Same bell for both"],b:"Exhale at the top of each swing and each squat",s:"Same lungs, same legs, none of the wrist-banging. Use this until the clean feels automatic — there is no rush."},
  kb_abc_nopress_s:{c:["Right hand: 2 cleans, then 3 front squats","Switch hands, repeat on the left","No overhead pressing at all","Bell settles into the rack, never bangs"],b:"Exhale on each clean, breathe in the rack",s:"Keeps the rack work and the legs, removes every bit of overhead load. Use this if the shoulder is having an off week."},
  kb_abc_dead_s:{c:["Bell starts on the FLOOR for every single rep","Hinge, pull it in tight, spear the hand through to the rack","Press, then front squat","Return it to the floor and reset before the next rep"],b:"Exhale on each clean and press",s:"Slower and more honest — no momentum to hide behind. The best way to actually learn the clean."},
  kb_abc_swingpress_s:{c:["10 two-hand swings","Then 5 push press each side","No rack position to hold, no clean to learn","Put the bell down between movements"],b:"Exhale on each swing and each press",s:"All the conditioning with the two technical bits removed. A good bridge if the rack position is uncomfortable."},
  kb_abc_light_s:{c:["Exact same complex — 2 cleans, 1 press, 3 front squats each side","Smallest bell, 25lb","Focus entirely on the clean landing softly in the rack"],b:"Exhale on each clean and press",s:"Do this for your first two or three sessions. Learn the sequence at a weight where mistakes cost nothing."},

  face_pull:{c:["Anchor high on the stack — above head height","Rope attachment, overhand grip, thumbs pointing back","Pull to forehead level, elbows flaring out and up","At the end position externally rotate — hands behind ears","Control the return, don't let it yank you forward"],b:"Exhale on the pull",s:"Your #1 shoulder health exercise. It strengthens the posterior cuff and external rotators that stabilise against subluxation. Light weight, perfect form, every session, no exceptions."},
  incline_db:{c:["Bench at 30-45° — higher means more upper chest and less shoulder stress","Grip just outside shoulder width, wrists stacked over elbows","Lower to mid-chest, elbows at 45° from the torso","Pause at the bottom, drive up and in, don't lock out","Shoulder blades retracted and depressed the whole set"],b:"Inhale down, exhale on the push",s:"Elbows at 45° is the single most important cue for your shoulder. Flaring to 90° puts the joint in the impingement position."},
  cable_fly:{c:["Cables at chest height or slightly above","Split stance, step forward for stability","Slight FIXED bend in the elbow — never changes","Initiate with the chest, think hugging a barrel","Squeeze hard at centre, hold 1s, controlled return"],b:"Exhale as the cables come together",s:"Keep it in the horizontal plane. An upward arc turns this into an impingement drill."},
  seated_cable_row_a:{c:["Close neutral grip handle, palms facing each other","Sit tall, slight 10-15° lean back, chest up","Full arm stretch at the front — load the lats completely","Pull to the belly button, elbows drive back and down","Hold full retraction 1-2s and squeeze before returning"],b:"Exhale on the pull, inhale on the return",s:"Neutral grip and pulling low to the belly keeps the shoulder in its safest position."},
  seated_cable_row_c:{c:["Close neutral grip handle","Sit tall, slight lean back, chest up","Full stretch at the front on every single rep","Pull to belly button, elbows back and down","Chase the mid-back squeeze, not the weight on the stack"],b:"Exhale on the pull",s:"Neutral grip only. Avoid a wide overhand grip here."},
  cable_crunch:{c:["Kneel facing the stack, rope at the high position","Rope held at your temples — you are NOT pulling with the arms","Crunch elbows toward knees — think ribs to hips","Hold the contraction 1-2s and squeeze","Return slowly to full stretch","Add weight over time — this is how abs actually grow"],b:"Exhale hard on the crunch",s:null},
  cable_crunch_cond:{c:["Kneel facing the stack, rope high","Hands at the temples, arms are just hooks","Crunch ribs toward hips, hold 1s","Slow return to full stretch","Higher reps today — chase the burn"],b:"Exhale hard on the crunch",s:null},
  db_curl_a:{c:["Elbows pinned at your sides the whole set","Supinate as you curl — pinky leads at the top","Squeeze hard at the top and pause","Lower over 2-3s — the eccentric builds the arm","No swing. Swinging means the weight is too heavy"],b:"Exhale on the curl",s:null},
  overhead_tricep:{c:["Cable: rope anchored low. DB: both hands on one bell","Elbows point straight up and stay near the head","Only the forearm moves, upper arm fixed and vertical","Full extension at the top, deep stretch at the bottom","Control the descent — that's where the growth is"],b:"Exhale on the extension",s:"If overhead feels wrong on the shoulder, switch to the pushdown sub. Same stimulus, zero risk."},
  face_pull_b:{c:["High anchor, rope, overhand grip","Pull to forehead, elbows out and up","Externally rotate at the end — hands behind ears","Slow controlled return","Light weight, perfect form"],b:"Exhale on the pull",s:"Non-negotiable shoulder work. Every session."},
  landmine_press:{c:["Half-kneeling: one knee down, opposite foot forward, tall spine","Grip the bar end at shoulder height","Press up and forward along the bar's natural arc — don't fight it","That arc keeps the humerus in the scapular plane","Lower controlled, reset posture between reps"],b:"Exhale on the press",s:"The most shoulder-safe press available. The bar path physically cannot put you in a dangerous position. Standing is fine for heavier days — same arc, more core."},
  lateral_raise:{c:["Cable at hip height, working arm crosses in front of the body","Slight 10-15° forward lean at the hips","Thumb up or neutral — NEVER thumb down","Raise to shoulder height only, no higher","Lead with the elbow, control the lower"],b:"Exhale on the raise",s:"Thumb up plus forward lean shifts the arm into the scapular plane. Both cues are non-negotiable for you."},
  hanging_knee_raise:{c:["Dead hang from the bar, shoulders packed down","Curl the PELVIS up — the hip rotation is the whole exercise","Knees to chest, hold 1s, squeeze","Lower slowly, don't let gravity swing you","Too hard? Bend more. Too easy? Straighten the legs"],b:"Exhale on the raise",s:"Keep the shoulders packed and depressed in the hang. Don't let them shrug up to your ears."},
  db_fly:{c:["Flat bench, DBs over the chest, palms facing each other","Slight FIXED elbow bend that never changes","Lower in a wide arc to a deep chest stretch","Drive back up squeezing the chest together","Control the descent — that's where the chest loads"],b:"Inhale down, exhale on the squeeze",s:"Your shoulder sets the depth. Stop before any discomfort — don't chase range here."},
  hammer_curl:{c:["Neutral grip throughout, palms facing each other","Elbows pinned at the sides","Curl, pause, lower over 2-3s","Alternating or together, both work","Hits brachialis and brachioradialis — different from a standard curl"],b:"Exhale on the curl",s:null},
  tricep_pushdown:{c:["Cable high, rope or straight bar","Elbows pinned tight to the sides — they must not move","Only the forearm moves, hinge at the elbow","Full extension, pause, squeeze hard","On the rope, flare the wrists out at the bottom"],b:"Exhale on the push",s:null},
  face_pull_c:{c:["High anchor, rope, overhand grip","Pull to forehead, elbows out and up","Externally rotate at the end","Controlled return","Light and perfect"],b:"Exhale on the pull",s:"Non-negotiable. Every session."},
  pallof_press:{c:["Cable at chest height, stand SIDEWAYS to the stack","Feet shoulder width, slight knee bend, tall spine","Handle at the chest, press straight out in front","Hold the extended position 2s — that's peak core demand","Return to chest. Do NOT rotate — that's the whole point","Equal sets both sides"],b:"Exhale as you press out, breathe steady in the hold",s:"Completely shoulder-safe. No overhead position, pure anti-rotation core work."},
  incline_db_c:{c:["Bench 30-45°, same setup as Upper A","Slightly lighter for the higher rep range","Chase the squeeze at the top, not the load","2-3s controlled descent every rep","DBs travel up and slightly in"],b:"Inhale down, exhale up",s:"Elbows at 45°. Always."},
  cable_fly_c:{c:["Detail day — go lighter and deliberate","Full stretch at the open position","Squeeze at centre and hold 2s","Slow controlled return, no snapping back","Quality over load today"],b:"Exhale on the squeeze",s:"Horizontal plane only."},
  db_curl_c:{c:["Elbows pinned","Supinate at the top, pinky leads","Squeeze and pause","2-3s eccentric","No swing"],b:"Exhale on the curl",s:null},
  tricep_pushdown_c:{c:["Elbows pinned and immobile","Only the forearm moves","Full extension, squeeze at the bottom","Rope: flare the wrists at the bottom","Control the return"],b:"Exhale on the push",s:null},
  face_pull_d:{c:["High anchor, rope","Pull to forehead, externally rotate","Higher reps today, lighter weight","Perfect form on every rep","45s rest only"],b:"Exhale on the pull",s:"Still the priority even on conditioning day."},
  pushup:{c:["Hands just outside shoulder width","Body rigid heels to head, glutes and core squeezed","Chest to the floor, full range, no half reps","3s descent, explosive push","Hands on a bench = easier. Feet on a bench = harder"],b:"Inhale down, exhale up",s:"Elbows track back at 45°, not flared wide to the sides."},
  inverted_row_d:{c:["Bar in a rack at hip height","Hang underneath, arms straight, body rigid","Squeeze glutes to stay in a straight line","Pull chest to the bar, elbows back not out","Lower over 2-3s"],b:"Exhale on the pull",s:"Great horizontal pull to balance all the pressing. Shoulder-safe and needs nothing but a bar."},
  db_lateral_cond:{c:["Lighter than Upper B — this is endurance work","Thumb up, slight forward lean, always","Shoulder height only","Control the lower, don't drop the arms","Deep burn by rep 15+"],b:"Exhale on the raise",s:"Same shoulder-safe cues apply even when light."},
  db_curl_d:{c:["Light weight, high reps","Squeeze hard at the top","Slow 3s eccentric","Elbows pinned","Finisher — take it near failure"],b:"Exhale on the curl",s:null},
  tricep_dip:{c:["Hands on the bench behind you, fingers forward","Feet on the floor (easier) or elevated (harder)","Lower until the upper arms are parallel to the floor — no deeper","Drive up through the triceps","Elbows track backward, never flare out"],b:"Inhale down, exhale up",s:"Any shoulder discomfort at all — stop and use the pushdown sub instead. Dips can aggravate an unstable shoulder if you go too deep."},
  plank:{c:["Forearms down, elbows under shoulders","Squeeze glutes, quads and core simultaneously and hard","Straight line from heels to head","No hip sag, no piking up","Breathe steadily, don't hold your breath"],b:"Slow steady breathing",s:null},
  // Subs
  band_pull_apart:{c:["Band at shoulder width, arms straight out front","Pull apart until the band touches your chest","Squeeze the shoulder blades together hard","Slow controlled return","High reps, light band"],b:"Exhale on the pull apart",s:"Excellent rotator cuff and rear delt work. Do these anywhere, even at home on off days."},
  db_rear_delt_fly:{c:["Hinge forward 45°, DBs hanging straight down","Raise out to the sides, lead with the elbows","Very light weight — this is not a strength move","Squeeze the rear delts at the top","Slow lower"],b:"Exhale on the raise",s:"Keep the movement in the plane of your torso. Don't raise toward the ceiling."},
  single_arm_db_row:{c:["Hand and knee braced on the bench","Let the arm hang fully — full stretch at the bottom","Row to the HIP, elbow back not out to the side","Squeeze 1s at the top","Don't rotate the torso to cheat it up"],b:"Exhale on the pull",s:"Braced position means the shoulder can't compensate. Keep the working shoulder packed."},
  straight_arm_pulldown:{c:["Cable high, straight bar or rope","Step back, slight hip hinge forward","Arms STAY STRAIGHT — no elbow bend at all","Pull the bar down to your thighs using only the lats","Squeeze at the bottom, controlled return"],b:"Exhale on the pull down",s:"Arms straight is the whole exercise. Bend the elbows and it becomes a bicep movement."},
  chest_sup_y_raise:{c:["Face down on an incline bench at 30-45°","Light DBs, arms hanging straight down","Raise up and out into a Y shape, thumbs up","Squeeze the upper back and rear delts hard","Lower slowly — you'll feel muscles you've never felt"],b:"Exhale on the raise",s:"Outstanding shoulder health movement — builds the lower trap and rear delt that stabilise the joint. Use very light weight."},
  db_fly_flat:{c:["Flat bench, palms facing each other","Slight fixed elbow bend","Wide arc down to a deep chest stretch","Squeeze back up like closing around a barrel","Control the descent"],b:"Inhale down, exhale up",s:"Your shoulder sets the depth. Don't force range."},
  pushup_wide:{c:["Hands wider than shoulder width","Body rigid, core and glutes squeezed","Chest to the floor","Controlled descent","More chest emphasis than a standard push-up"],b:"Inhale down, exhale up",s:"Wide hands increase shoulder stress. If it feels off, go back to standard width."},
  feet_elev_pushup:{c:["Feet on a bench, hands on the floor","Body rigid in a straight line","Lower chest to the floor, pause 1s","Elbows at 45°, not flared","Replicates the incline press angle"],b:"Inhale down, exhale up",s:"Elbows at 45°, same as any pressing movement."},
  cable_chest_press:{c:["Cables at chest height, split stance","Press forward and slightly in","Squeeze the chest at full extension","Controlled return to a chest stretch","Constant tension is the advantage here"],b:"Exhale on the press",s:"Pressing forward rather than overhead is very shoulder friendly."},
  seated_preacher_curl:{c:["Sit on the end of a bench, feet flat","Elbows rest on your inner thighs — locked in place","Your thighs are the preacher pad, cheating is impossible","Curl up, squeeze, lower over 3s","Go lighter than your standing curl — the isolation makes it much harder"],b:"Exhale on the curl",s:null},
  concentration_curl:{c:["Sit, legs wide, lean forward slightly","Elbow braced on the inside of the knee","Curl up, rotating the wrist at the top","Hold the squeeze 1-2s","Slow lower to full extension"],b:"Exhale on the curl",s:null},
